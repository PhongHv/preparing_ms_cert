<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>☁️ DANH SÁCH CÂU HỎI ÔN THI (SẮP XẾP THEO TOPIC)</title>
<style>
  /* ---------- Design tokens ---------- */
  :root{
    --bg:#0d1117;          /* graphite editor */
    --bg-2:#161b22;        /* panel */
    --bg-3:#1c2333;        /* raised */
    --line:#283041;
    --line-soft:#21262d;
    --ink:#e6edf3;         /* primary text */
    --ink-2:#9aa7b5;       /* muted */
    --ink-3:#6b7686;       /* faint */
    --green:#3fb950;       /* GitHub green */
    --green-dim:#1f6f2e;
    --violet:#a371f7;      /* Copilot violet */
    --violet-dim:#553c8b;
    --amber:#d29922;
    --red:#f85149;
    --blue:#58a6ff;
    --radius:14px;
    --radius-sm:9px;
    --shadow:0 16px 50px -20px rgba(0,0,0,.7);
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:"Space Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --header-bg:rgba(13,17,23,.82);
    --glow-1:rgba(163,113,247,.08);
    --glow-2:rgba(63,185,80,.06);
    --tint-violet-sel:rgba(163,113,247,.1);
    --tint-green-ok:rgba(63,185,80,.12);
    --tint-red-bad:rgba(248,81,73,.1);
    --tint-violet-tab:rgba(163,113,247,.12);
    --on-green:#04140a;
    --on-violet:#100a1f;
    --on-red:#1f0605;
    --amber-dim:#6b5118;
    --logo-glow:rgba(163,113,247,.6);
    color-scheme:dark;
  }
  :root[data-theme="light"]{
    --bg:#ffffff;
    --bg-2:#f6f8fa;
    --bg-3:#eef1f4;
    --line:#d0d7de;
    --line-soft:#e2e5e9;
    --ink:#1f2328;
    --ink-2:#57606a;
    --ink-3:#818b98;
    --green:#1a7f37;
    --green-dim:#aceebb;
    --violet:#8250df;
    --violet-dim:#d8c9f7;
    --amber:#9a6700;
    --red:#cf222e;
    --blue:#0969da;
    --shadow:0 16px 40px -20px rgba(31,35,40,.18);
    --header-bg:rgba(255,255,255,.82);
    --glow-1:rgba(130,80,223,.06);
    --glow-2:rgba(26,127,55,.05);
    --tint-violet-sel:rgba(130,80,223,.08);
    --tint-green-ok:rgba(26,127,55,.10);
    --tint-red-bad:rgba(207,34,46,.08);
    --tint-violet-tab:rgba(130,80,223,.10);
    --on-green:#ffffff;
    --on-violet:#ffffff;
    --on-red:#ffffff;
    --amber-dim:#f2d99a;
    --logo-glow:rgba(130,80,223,.35);
    color-scheme:light;
  }
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);
    line-height:1.55;-webkit-font-smoothing:antialiased;touch-action:manipulation;
    background-image:radial-gradient(900px 500px at 85% -10%,var(--glow-1),transparent 60%),
                     radial-gradient(700px 400px at 5% 0%,var(--glow-2),transparent 55%);
    background-attachment:fixed;
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* ---------- Header ---------- */
  header{
    position:sticky;top:0;z-index:50;backdrop-filter:blur(12px);
    background:var(--header-bg);border-bottom:1px solid var(--line-soft);
  }
  .bar{max-width:1100px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px}
  .brand{display:flex;align-items:center;gap:11px;min-width:0}
  .logo{
    width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--violet),var(--green));font-size:20px;
    box-shadow:0 8px 20px -8px var(--logo-glow);
  }
  .brand h1{font-size:15px;font-weight:600;margin:0;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand .sub{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.5px}
  .spacer{flex:1}
  .lang{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;font-family:var(--mono);font-size:12px}
  .lang button{background:transparent;color:var(--ink-2);border:0;padding:6px 12px;cursor:pointer;font-family:inherit;font-weight:500}
  .lang button.on{background:var(--ink);color:var(--bg)}

  /* ---------- Layout ---------- */
  main{max-width:1100px;margin:0 auto;padding:26px 20px 80px}

  /* ---------- Mode tabs ---------- */
  .modes{display:flex;gap:10px;margin-bottom:26px;flex-wrap:wrap}
  .mode-tab{
    flex:1;min-width:200px;text-align:left;cursor:pointer;border:1px solid var(--line);
    background:var(--bg-2);border-radius:var(--radius);padding:16px 18px;transition:.18s;color:inherit;
    display:flex;gap:13px;align-items:center;
  }
  .mode-tab:hover{border-color:var(--ink-3);transform:translateY(-1px)}
  .mode-tab.on{border-color:var(--violet);background:linear-gradient(180deg,var(--tint-violet-tab),transparent)}
  .mode-tab .ic{font-size:22px;flex:none}
  .mode-tab .t{font-weight:600;font-size:15px}
  .mode-tab .d{font-size:12.5px;color:var(--ink-2);margin-top:2px}

  /* ---------- Cards / panels ---------- */
  .panel{background:var(--bg-2);border:1px solid var(--line-soft);border-radius:var(--radius);padding:20px}
  .panel + .panel{margin-top:16px}

  .toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.6px;text-transform:uppercase}
  select,input[type=number]{
    background:var(--bg-3);border:1px solid var(--line);color:var(--ink);border-radius:var(--radius-sm);
    padding:9px 12px;font-family:var(--sans);font-size:14px;min-width:120px;
  }
  select:focus,input:focus{outline:2px solid var(--violet);outline-offset:1px}

  .btn{
    border:1px solid var(--line);background:var(--bg-3);color:var(--ink);border-radius:var(--radius-sm);
    padding:10px 18px;font-family:var(--sans);font-weight:600;font-size:14px;cursor:pointer;transition:.16s;
  }
  .btn:hover{border-color:var(--ink-3)}
  .btn.primary{background:var(--green);border-color:var(--green);color:var(--on-green)}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.violet{background:var(--violet);border-color:var(--violet);color:var(--on-violet)}
  .btn.ghost{background:transparent}

  /* ---------- Progress ---------- */
  .progress-wrap{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
  .pbar{flex:1;min-width:160px;height:7px;background:var(--bg-3);border-radius:99px;overflow:hidden}
  .pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--violet));transition:width .3s}
  .pcount{font-family:var(--mono);font-size:13px;color:var(--ink-2);white-space:nowrap}

  /* ---------- Question card ---------- */
  .qcard{background:var(--bg-2);border:1px solid var(--line-soft);border-radius:var(--radius);padding:22px 22px 20px;margin-bottom:16px}
  .qmeta{display:flex;gap:8px;align-items:center;margin-bottom:13px;flex-wrap:wrap}
  .chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;
    border:1px solid var(--line);border-radius:99px;padding:3px 9px;color:var(--ink-2)}
  .chip.q{color:var(--violet);border-color:var(--violet-dim)}
  .chip.multi{color:var(--amber);border-color:var(--amber-dim)}
  .qtext{font-size:16px;font-weight:500;margin:0 0 16px;letter-spacing:-.1px;white-space:pre-wrap}

  .opts{display:flex;flex-direction:column;gap:9px}
  .opt{
    display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);background:var(--bg-3);
    border-radius:var(--radius-sm);padding:12px 14px;cursor:pointer;transition:.14s;
  }
  .opt:hover{border-color:var(--ink-3)}
  .opt .key{
    font-family:var(--mono);font-weight:700;font-size:13px;width:24px;height:24px;flex:none;border-radius:6px;
    display:grid;place-items:center;background:var(--bg);border:1px solid var(--line);color:var(--ink-2);
  }
  .opt .otext{font-size:14.5px;padding-top:1px}
  .opt.sel{border-color:var(--violet);background:var(--tint-violet-sel)}
  .opt.sel .key{background:var(--violet);color:var(--on-violet);border-color:var(--violet)}
  .opt.correct{border-color:var(--green);background:var(--tint-green-ok)}
  .opt.correct .key{background:var(--green);color:var(--on-green);border-color:var(--green)}
  .opt.wrong{border-color:var(--red);background:var(--tint-red-bad)}
  .opt.wrong .key{background:var(--red);color:var(--on-red);border-color:var(--red)}
  .opt.disabled{cursor:default;pointer-events:none}

  /* ---------- Yes/No & dropdown (hotspot) ---------- */
  .ynwrap{display:flex;flex-direction:column;gap:9px}
  .ynrow{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--bg-3);border-radius:var(--radius-sm);padding:11px 14px}
  .ynrow .stext{flex:1;font-size:14.5px}
  .ynbtn{font-family:var(--mono);font-size:12.5px;font-weight:700;border:1px solid var(--line);background:var(--bg);color:var(--ink-2);border-radius:99px;padding:5px 14px;cursor:pointer;transition:.14s;flex:none}
  .ynbtn:hover{border-color:var(--ink-3)}
  .ynbtn.sel{background:var(--violet);border-color:var(--violet);color:var(--on-violet)}
  .ynbtn.correct{background:var(--green);border-color:var(--green);color:var(--on-green)}
  .ynbtn.wrong{background:var(--red);border-color:var(--red);color:var(--on-red)}
  .ynrow.disabled .ynbtn{cursor:default;pointer-events:none}
  .dropwrap{display:flex;flex-direction:column;gap:12px}
  .droppart{border:1px solid var(--line);background:var(--bg-3);border-radius:var(--radius-sm);padding:12px 14px}
  .droppart .ptext{font-size:14.5px;margin-bottom:9px;white-space:pre-wrap}
  .droppart select{width:100%;max-width:560px;background:var(--bg)}
  .droppart select.correct{outline:2px solid var(--green)}
  .droppart select.wrong{outline:2px solid var(--red)}
  .drop-ans{font-family:var(--mono);font-size:12.5px;color:var(--green);margin-top:7px;font-weight:700}
  @media(max-width:560px){.ynrow{flex-wrap:wrap}.ynrow .stext{flex:1 1 100%}}

  /* ---------- Explanation ---------- */
  .qactions{display:flex;gap:10px;margin-top:15px;flex-wrap:wrap;align-items:center}
  .verdict{font-family:var(--mono);font-size:13px;font-weight:700}
  .verdict.ok{color:var(--green)}
  .verdict.no{color:var(--red)}
  .explain{
    margin-top:14px;border-top:1px dashed var(--line);padding-top:14px;font-size:14px;color:var(--ink-2);
    display:none;
  }
  .explain.show{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .explain h4{color:var(--ink);font-size:13.5px;margin:14px 0 6px;font-family:var(--mono);letter-spacing:.3px}
  .explain h4:first-child{margin-top:0}
  .explain p{margin:6px 0}
  .explain ul{margin:6px 0;padding-left:20px}
  .explain li{margin:4px 0}
  .explain strong{color:var(--ink)}
  .explain code{font-family:var(--mono);font-size:12.5px;background:var(--bg);padding:1px 5px;border-radius:4px;color:var(--green)}
  .ans-line{font-family:var(--mono);color:var(--green);font-weight:700}

  /* ---------- Exam controls / footer ---------- */
  .exam-nav{display:flex;justify-content:space-between;gap:12px;margin-top:10px;flex-wrap:wrap}
  .timer{font-family:var(--mono);font-size:14px;color:var(--amber);font-weight:700}
  .palette{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
  .pdot{
    width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--bg-3);
    font-family:var(--mono);font-size:11px;cursor:pointer;color:var(--ink-2);
  }
  .pdot.answered{border-color:var(--violet);color:var(--violet)}
  .pdot.current{background:var(--ink);color:var(--bg);border-color:var(--ink)}

  /* ---------- Result ---------- */
  .result{text-align:center;padding:30px 20px}
  .score-ring{width:150px;height:150px;margin:0 auto 18px;position:relative}
  .score-ring svg{transform:rotate(-90deg)}
  .score-ring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:30px}
  .score-ring .num small{display:block;font-size:12px;color:var(--ink-3);font-weight:500}
  .verdict-big{font-size:20px;font-weight:600;margin:6px 0}
  .stat-row{display:flex;justify-content:center;gap:26px;margin:18px 0;flex-wrap:wrap}
  .stat{font-family:var(--mono)}
  .stat b{display:block;font-size:24px}
  .stat span{font-size:11px;color:var(--ink-3);letter-spacing:.5px;text-transform:uppercase}

  .empty{text-align:center;color:var(--ink-3);padding:40px;font-family:var(--mono);font-size:14px}
  .hidden{display:none!important}
  footer{text-align:center;color:var(--ink-3);font-family:var(--mono);font-size:11.5px;padding:30px 20px}
  footer a{color:var(--ink-2)}

  /* ========== MOBILE OPTIMIZATIONS ========== */
  @media(max-width:640px){
    /* Header */
    .bar{padding:10px 12px;gap:8px}
    .logo{width:32px;height:32px;font-size:17px;border-radius:9px}
    .brand h1{font-size:13px}
    .brand .sub{font-size:10px}
    .lang button{padding:5px 9px;font-size:11px}

    /* Layout */
    main{padding:16px 12px 80px}

    /* Mode tabs — full width stack */
    .modes{gap:8px;margin-bottom:18px}
    .mode-tab{min-width:100%;padding:13px 14px;gap:10px}
    .mode-tab .ic{font-size:20px}
    .mode-tab .t{font-size:14px}
    .mode-tab .d{font-size:12px}

    /* Panels & toolbar */
    .panel{padding:14px 12px}
    .toolbar{gap:8px}
    .field label{font-size:10px}
    select,input[type=number]{font-size:15px;padding:10px 10px;min-width:0;width:100%}
    .btn{padding:11px 14px;font-size:14px;width:100%;text-align:center}
    .btn + .btn{margin-top:0}

    /* Question card */
    .qcard{padding:16px 13px 14px;margin-bottom:12px}
    .qtext{font-size:15px;margin-bottom:14px}
    .chip{font-size:10px;padding:3px 8px}

    /* Answer options — larger tap target */
    .opts{gap:8px}
    .opt{padding:13px 12px;gap:10px;border-radius:10px}
    .opt .key{width:26px;height:26px;font-size:13px}
    .opt .otext{font-size:15px;line-height:1.45}

    /* Yes/No rows */
    .ynrow{flex-wrap:wrap;padding:10px 12px}
    .ynrow .stext{flex:1 1 100%;font-size:15px}
    .ynbtn{padding:8px 16px;font-size:13px}

    /* Dropdown */
    .droppart{padding:11px 12px}
    .droppart .ptext{font-size:15px}
    .droppart select{max-width:100%;font-size:15px}

    /* Exam controls */
    .exam-nav{gap:8px}
    .exam-nav .btn{flex:1}
    .timer{font-size:15px}
    .palette{gap:5px}
    .pdot{width:32px;height:32px;font-size:12px;border-radius:8px}

    /* Progress */
    .progress-wrap{gap:10px;margin-bottom:14px}
    .pcount{font-size:12px}

    /* Result */
    .result{padding:20px 12px}
    .score-ring{width:130px;height:130px}
    .score-ring .num{font-size:26px}
    .verdict-big{font-size:18px}
    .stat-row{gap:18px}
    .stat b{font-size:20px}

    /* Explain */
    .explain{font-size:13.5px}
    .explain h4{font-size:13px}
    .explain code{font-size:12px}

    /* Qactions */
    .qactions{gap:8px}
    .qactions .btn{flex:1;padding:10px 10px}

    /* Study search */
    #studySearch{width:100%!important;min-width:0!important;font-size:15px}
  }

  /* Extra small phones */
  @media(max-width:380px){
    .brand h1{font-size:12px}
    .qtext{font-size:14.5px}
    .opt .otext{font-size:14px}
    .pdot{width:28px;height:28px;font-size:11px}
  }

  /* Touch / tap improvements for all mobile */
  @media(hover:none){
    .opt,.btn,.mode-tab,.ynbtn,.pdot{
      -webkit-tap-highlight-color:transparent;
    }
    .opt:active{opacity:.85}
    .btn:active{opacity:.8}
  }
</style>
<script>
(function(){
  var saved=null;
  try{ saved=localStorage.getItem("examTheme"); }catch(e){}
  var theme=saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
  document.documentElement.setAttribute("data-theme",theme);
})();
</script>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">
      <div class="logo">🤖</div>
      <div>
        <a href="./index.html">Back to List</a>
        <h1 id="docTitle">☁️ DANH SÁCH CÂU HỎI ÔN THI (SẮP XẾP THEO TOPIC)</h1>
        <div class="sub"><span id="qTotal">0</span> <span data-i18n="questions">câu hỏi</span> · <span data-i18n="examPrep">Luyện thi</span></div>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="lang" role="group" aria-label="Theme">
      <button id="themeDark" onclick="setTheme('dark')">🌙</button>
      <button id="themeLight" onclick="setTheme('light')">☀️</button>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button id="langVi" class="on" onclick="setLang('vi')">VI</button>
      <button id="langEn" onclick="setLang('en')">EN</button>
    </div>
  </div>
</header>

<main>
  <!-- Mode selector -->
  <div class="modes">
    <button class="mode-tab on" id="tabStudy" onclick="setMode('study')">
      <span class="ic">📚</span>
      <span>
        <span class="t" data-i18n="studyMode">Chế độ học tập</span>
        <span class="d" data-i18n="studyDesc">Xem đáp án và giải thích ngay sau mỗi câu</span>
      </span>
    </button>
    <button class="mode-tab" id="tabExam" onclick="setMode('exam')">
      <span class="ic">📝</span>
      <span>
        <span class="t" data-i18n="examMode">Chế độ thi thử</span>
        <span class="d" data-i18n="examDesc">Tự cấu hình số câu, có hẹn giờ và chấm điểm</span>
      </span>
    </button>
  </div>

  <!-- ====== STUDY ====== -->
  <section id="studyView">
    <div class="panel toolbar">
      <div class="field">
        <label data-i18n="filterTopic">Chủ đề</label>
        <select id="studyTopic" onchange="renderStudy()"></select>
      </div>
      <div class="field">
        <label data-i18n="filterType">Loại câu</label>
        <select id="studyType" onchange="renderStudy()">
          <option value="all" data-i18n="typeAll">Tất cả</option>
          <option value="single" data-i18n="typeSingle">Một đáp án</option>
          <option value="multi" data-i18n="typeMulti">Nhiều đáp án</option>
        </select>
      </div>
      <div class="field">
        <label data-i18n="search">Tìm kiếm</label>
        <input type="text" id="studySearch" oninput="renderStudy()" placeholder="..." style="min-width:180px;background:var(--bg-3);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:9px 12px;font-family:var(--sans);font-size:14px">
      </div>
      <div class="spacer" style="flex:1"></div>
      <div class="field">
        <label>&nbsp;</label>
        <button class="btn ghost" onclick="toggleAllExplain()"><span data-i18n="toggleAll">Hiện/ẩn tất cả</span></button>
      </div>
    </div>
    <div id="studyList"></div>
  </section>

  <!-- ====== EXAM SETUP ====== -->
  <section id="examSetup" class="hidden">
    <div class="panel">
      <h2 style="margin:0 0 4px;font-size:18px" data-i18n="examSetupTitle">Thiết lập bài thi thử</h2>
      <p style="color:var(--ink-2);margin:0 0 20px;font-size:14px" data-i18n="examSetupDesc">Chọn số câu, thời gian và phạm vi. Đề được trộn ngẫu nhiên.</p>
      <div class="toolbar" style="margin-bottom:8px">
        <div class="field">
          <label data-i18n="numQ">Số câu hỏi</label>
          <input type="number" id="cfgCount" min="1" value="30">
        </div>
        <div class="field">
          <label data-i18n="timeLimit">Thời gian (phút)</label>
          <input type="number" id="cfgTime" min="0" value="45">
        </div>
        <div class="field">

const EXAM = {"title":"☁️ DANH SÁCH CÂU HỎI ÔN THI (SẮP XẾP THEO TOPIC)","count":86,"questions":[{"topic":1,"num":1,"question":"You are using Microsoft 365 Copilot to enhance your productivity in Microsoft Excel. Which two tasks can you achieve by using Copilot in Excel? Each correct answer presents a complete the solution. NOTE: Each correct selection is worth one point.","options":[{"key":"A","text":"Customize the conditional formatting rules for your data."},{"key":"B","text":"Insert a custom chart that has specific formatting."},{"key":"C","text":"Generate a summary of key insights from your data."},{"key":"D","text":"Build a pivot table based on your data."}],"correct":["C","D"],"multi":true,"explanation":"#### 🎯 Đáp án đúng: **C, D**\n\n#### 💡 Giải thích (từ v1)\n\nCopilot trong Excel phân tích dữ liệu để tạo insight/tóm tắt (C) và có thể tạo PivotTable (D). Tùy chỉnh chi tiết quy tắc conditional formatting hay định dạng biểu đồ cụ thể vẫn là thao tác thủ công của Excel.\n\n#### 📚 Nguồn tham khảo\n\nsupport.microsoft.com — Copilot in Excel: analyze & insights; learn.microsoft.com Copilot overview\n\n#### 🔎 Độ tin cậy: **Cao (H)**"},{"topic":1,"num":2,"question":"You are using Microsoft 365 Copilot to enhance your productivity in Microsoft Word. Which two tasks can you achieve by using Copilot in Word? Each correct answer presents a complete the solution. NOTE: Each correct selection is worth one point.","options":[{"key":"A","text":"Insert a table of contents based on the headings in your document."},{"key":"B","text":"Customize the page margins to match your company's document standards."},{"key":"C","text":"Generate a summary of the key points in your document."},{"key":"D","text":"Insert a custom watermark that has specific text and formatting."}],"correct":["A","C"],"multi":true,"explanation":"#### 🎯 Đáp án đúng: **A, C**\n\n#### 💡 Giải thích (từ v1)\n\nC (tóm tắt) là năng lực Copilot rõ ràng và đã được tài liệu xác nhận. A (tạo mục lục theo heading) là đáp án thứ hai theo cộng đồng nhưng còn tranh cãi vì chèn mục lục vốn là tính năng gốc của Word. B (lề) và D (watermark) là thao tác định dạng thủ công, chắc chắn không phải Copilot. → Độ tin cậy Trung bình cho A.\n\n#### 📚 Nguồn tham khảo\n\nsupport.microsoft.com — Welcome to Copilot in Word (summarize/draft/rewrite)\n\n#### 🔎 Độ tin cậy: **Trung bình (M)**"},{"topic":1,"num":3,"question":"You are using Microsoft 365 Copilot to enhance your productivity in Microsoft Outlook. Which two tasks can you achieve by using Copilot in Outlook? Each correct answer presents a complete the solution. NOTE: Each correct selection is worth one point.","options":[{"key":"A","text":"Insert a custom HTML signature that has specific formatting."},{"key":"B","text":"Generate a draft response to an email based on the context of the conversation."},{"key":"C","text":"Create a summary of unread emails in your inbox."},{"key":"D","text":"Customize the folder structure to organize your emails."}],"correct":["B","C"],"multi":true,"explanation":"#### 🎯 Đáp án đúng: **B, C**\n\n#### 💡 Giải thích (từ v1)\n\nCopilot trong Outlook soạn nháp phản hồi (B) và tóm tắt email/chuỗi hội thoại (C). Chữ ký HTML và cấu trúc thư mục là thiết lập thủ công.\n\n#### 📚 Nguồn tham khảo\n\nsupport.microsoft.com — Copilot in Outlook (draft & summarize)\n\n#### 🔎 Độ tin cậy: **Cao (H)**"},{"topic":1,"num":4,"question":"You have a Microsoft 365 Copilot license. You are preparing a business presentation by using Copilot in PowerPoint. Which two tasks can you achieve by using Copilot in PowerPoint? Each correct answer presents a complete the solution. NOTE: Each correct selection is worth one point.","options":[{"key":"A","text":"Insert a custom animation for a specific object on a slide."},{"key":"B","text":"Create a slide layout based on the content of your presentation."},{"key":"C","text":"Customize the design theme of your presentation to match your company's branding."},{"key":"D","text":"Produce a summary slide based on the key points in your presentation."}],"correct":["B","D"],"multi":true,"explanation":"#### 🎯 Đáp án đúng: **B, D**\n\n#### 💡 Giải thích (từ v1)\n\nCopilot trong PowerPoint tạo bài trình bày từ prompt/file (B) và tạo slide tóm tắt (D). Animation và theme thương hiệu là thao tác thiết kế thủ công.\n\n#### 📚 Nguồn tham khảo\n\nsupport.microsoft.com — Copilot in PowerPoint (create & summarize)\n\n#### 🔎 Độ tin cậy: **Cao (H)**"},{"topic":1,"num":5,"question":"You are using Microsoft 365 Copilot to enhance your productivity in Microsoft Teams. Which two tasks can you achieve by using Copilot in Teams? Each correct answer presents a complete the solution. NOTE: Each correct selection is worth one point.","options":[{"key":"A","text":"Mute and unmute participants in a meeting based on their location."},{"key":"B","text":"Create a custom background and add the background to your video calls."},{"key":"C","text":"Create a meeting summary, including key decisions and action items."},{"key":"D","text":"Draft a response to a channel message based on the context of the conversation."}],"correct":["C","D"],"multi":true,"explanation":"#### 🎯 Đáp án đúng: **C, D**\n\n#### 💡 Giải thích (từ v1)\n\nCopilot trong Teams tóm tắt cuộc họp (C) và soạn nháp phản hồi tin nhắn channel (D). Mute theo vị trí và background là tính năng Teams thông thường.\n\n#### 📚 Nguồn tham khảo\n\nsupport.microsoft.com — Copilot in Teams (meeting recap & drafting)\n\n#### 🔎 Độ tin cậy: **Cao (H)**"},{"topic":1,"num":6,"question":"A colleague from another company shares a link to a prompt. When you select the link, you receive the following response: \"Prompt not found. Sorry, it looks like the prompt is no longer available.\" What is a possible cause of the response?","options":[{"key":"A","text":"The prompt is outdated."},{"key":"B","text":"The prompt is outside of your organization."},{"key":"C","text":"The prompt contains a reference to a file that you do NOT have access to."},{"key":"D","text":"The prompt is a scheduled prompt."},{"key":"E","text":"The prompt contains a file that has a sensitivity label applied."}],"correct":["B"],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **B**\n\n#### 💡 Giải thích (từ v1)\n\nPrompt chia sẻ chỉ hoạt động trong cùng tổ chức/tenant. Link từ công ty khác nằm ngoài tổ chức nên không truy cập được.\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Sharing prompts in Microsoft 365 Copilot (org boundary)\n\n#### 🔎 Độ tin cậy: **Cao (H)**"},{"topic":1,"num":7,"question":"You run a saved prompt and receive the following response: \"You asked for a summary of File.docx. However, the file appears to be either empty, corrupted, or in a format that I cannot process.\" What is a possible cause of the response?","options":[{"key":"A","text":"You did NOT schedule the prompt to run."},{"key":"B","text":"You ran the prompt from a web app instead of a desktop app."},{"key":"C","text":"You used the wrong agent to run the prompt."},{"key":"D","text":"You do NOT have access to the file."}],"correct":["D"],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **D**\n\n#### 💡 Giải thích (từ v1)\n\nKhi Copilot không đọc được nội dung file được tham chiếu, nguyên nhân phổ biến là người chạy không có quyền truy cập file đó.\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Prompts referencing files & permissions\n\n#### 🔎 Độ tin cậy: **Trung bình (M)**"},{"topic":1,"num":8,"question":"You receive several images from a colleague. You suspect that the images were generated by using Microsoft 365 Copilot. What can you use to verify whether the images were AI-generated?","options":[{"key":"A","text":"file names"},{"key":"B","text":"watermarks"},{"key":"C","text":"content credentials"},{"key":"D","text":"file descriptions"}],"correct":["C"],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **C**\n\n#### 💡 Giải thích (từ v1)\n\nẢnh do Copilot/Designer tạo được gắn Content Credentials (chuẩn C2PA) — metadata mật mã cho biết nguồn gốc AI. Tên/mô tả tệp dễ thay đổi, không đáng tin.\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Content Credentials for AI-generated images\n\n#### 🔎 Độ tin cậy: **Cao (H)**"},{"topic":1,"num":9,"question":"You are a merchandiser who is planning for the upcoming season. You prompt Microsoft 365 Copilot to suggest which products to stock based on historical sales data. Without reviewing the suggestions or checking current market trends, you place a large order based solely on the output of Copilot. What is this an example of?","options":[{"key":"A","text":"verification"},{"key":"B","text":"overreliance"},{"key":"C","text":"fabrication"},{"key":"D","text":"prompt injection"}],"correct":["B"],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **B**\n\n#### 💡 Giải thích (từ v1)\n\nLàm theo kết quả AI mà không kiểm chứng là 'overreliance' (phụ thuộc quá mức) — một rủi ro sử dụng AI có trách nhiệm.\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Responsible AI: overreliance\n\n#### 🔎 Độ tin cậy: **Cao (H)**"},{"topic":1,"num":10,"question":"You are comparing the difference between Microsoft 365 Copilot and Microsoft 365 Copilot Chat. What is available in both versions?","options":[{"key":"A","text":"the Researcher agent"},{"key":"B","text":"Copilot Pages"},{"key":"C","text":"Copilot Notebooks"}],"correct":["B"],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **B**\n\n#### 💡 Giải thích (từ v1)\n\nCopilot Pages có ở cả Copilot Chat (không cần license Copilot) lẫn M365 Copilot. Researcher agent và Notebooks yêu cầu license M365 Copilot.\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Copilot Pages availability; support.microsoft.com Copilot Chat with/without license\n\n#### 🔎 Độ tin cậy: **Cao (H)**"},{"topic":1,"num":11,"question":"You are discussing Microsoft 365 Copilot with a colleague. The colleague asks which data Copilot uses to answer questions when using the Work scope. What should you tell your colleague?","options":[{"key":"A","text":"Copilot provides responses based only on data that the user can access and the general knowledge that Copilot was trained on."},{"key":"B","text":"Copilot provides responses based on all the data in your organization's Microsoft 365 environment and the general knowledge that Copilot was trained on."},{"key":"C","text":"Copilot provides responses based only on data that the user can access."},{"key":"D","text":"Copilot provides responses based only on the general knowledge that Copilot was trained on."}],"correct":["A"],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **A**\n\n#### 💡 Giải thích (từ v1)\n\nỞ phạm vi Work, Copilot kết hợp dữ liệu Microsoft Graph mà NGƯỜI DÙNG có quyền truy cập với kiến thức chung của LLM. Nó tôn trọng phân quyền hiện có (không phải toàn bộ dữ liệu tổ chức).\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — How Microsoft 365 Copilot uses data (Work scope)\n\n#### 🔎 Độ tin cậy: **Cao (H)**"},{"topic":1,"num":12,"question":"HOTSPOT - For each of the following statements, select Yes if the statement is true. Otherwise, select No. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **Yes, No, Yes**\n\n#### 💡 Giải thích (từ v1)\n\nCopilot dùng Microsoft Graph nên truy cập được chat Teams (1-Yes) và tóm tắt/hỏi đáp về cuộc họp Teams (3-Yes). Copilot chỉ SOẠN NHÁP email — nó không tự lên lịch và gửi email theo điều kiện (2-No; đó là việc của agent/automation).\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — M365 Copilot in Teams & Graph grounding\n\n#### 🔎 Độ tin cậy: **Cao (H)**","kind":"yesno","statements":[{"text":"Microsoft 365 Copilot can surface data from Microsoft Teams chats.","ans":"Y"},{"text":"Microsoft 365 Copilot can schedule, draft, and send emails based on certain conditions.","ans":"N"},{"text":"Microsoft 365 Copilot can summarize, draft, and answer questions about content from Microsoft Teams meetings.","ans":"Y"}]},{"topic":1,"num":13,"question":"HOTSPOT - For each of the following statements, select Yes if the statement is true. Otherwise, select No. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **No, Yes, Yes**\n\n#### 💡 Giải thích (từ v1)\n\nCopilot KHÔNG huấn luyện trên dữ liệu của bạn (1-No). Nó tôn trọng phân quyền M365 hiện có: tóm tắt được hộp thư chia sẻ mà bạn có quyền (2-Yes) và dựa trên khung bảo mật M365 (3-Yes).\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Data, privacy & security for Microsoft 365 Copilot\n\n#### 🔎 Độ tin cậy: **Cao (H)**","kind":"yesno","statements":[{"text":"Microsoft 365 Copilot is trained on your organization's business data.","ans":"N"},{"text":"Microsoft 365 Copilot can summarize emails in mailboxes that were shared with you.","ans":"Y"},{"text":"Microsoft 365 Copilot leverages the security framework defined in Microsoft 365 to provide you with access to emails, documents, and other enterprise data.","ans":"Y"}]},{"topic":1,"num":14,"question":"HOTSPOT - You use Microsoft 365 Copilot. For each of the following statements, select Yes if the statement is true. Otherwise, select No. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **No, No, Yes**\n\n#### 💡 Giải thích (từ v1)\n\nNgười dùng tự xóa hội thoại của mình, không cần admin cho phép (1-No). Xóa hội thoại KHÔNG xóa file gốc trên SharePoint (2-No). Gỡ agent không xóa các hội thoại đã có (3-Yes).\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Manage Copilot conversations & data\n\n#### 🔎 Độ tin cậy: **Trung bình (M)**","kind":"yesno","statements":[{"text":"You can delete your conversation history only if your administrator allows you to do so.","ans":"N"},{"text":"When you delete a conversation, the associated files stored in Microsoft SharePoint are also deleted.","ans":"N"},{"text":"When you uninstall a Copilot agent, all the conversations associated with the agent are retained.","ans":"Y"}]},{"topic":1,"num":15,"question":"HOTSPOT - For each of the following statements, select Yes if the statement is true. Otherwise, select No. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **No, No, Yes**\n\n#### 💡 Giải thích (từ v1)\n\nCopilot không huấn luyện trên dữ liệu của bạn (1-No) và không tự gán quyền (2-No). Nó dùng đúng cơ chế phân quyền M365 hiện có (3-Yes).\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Data security for Microsoft 365 Copilot\n\n#### 🔎 Độ tin cậy: **Cao (H)**","kind":"yesno","statements":[{"text":"Microsoft 365 Copilot uses your business data to train underlying AI models.","ans":"N"},{"text":"Microsoft 365 Copilot automatically assigns permissions to resources, so that users can find information more easily.","ans":"N"},{"text":"Microsoft 365 Copilot uses the same underlying data access controls as other Microsoft 365 services to ensure that users are presented with only information to which they have access.","ans":"Y"}]},{"topic":1,"num":16,"question":"HOTSPOT - For each of the following statements, select Yes if the statement is true. Otherwise, select No. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **Yes, Yes, Yes**\n\n#### 💡 Giải thích (từ v1)\n\nCả ba đều đúng: prompt injection có thể gây lộ dữ liệu/hành vi ngoài ý muốn, nhúng chỉ dẫn độc hại, và là rủi ro đặc thù của hệ thống genAI diễn giải ngôn ngữ tự nhiên.\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Responsible AI: prompt injection\n\n#### 🔎 Độ tin cậy: **Trung bình (M)**","kind":"yesno","statements":[{"text":"Prompt injection can cause data exposure and unintended system behavior.","ans":"Y"},{"text":"Prompt injection can be used to embed malicious or harmful instructions.","ans":"Y"},{"text":"Prompt injection is a security vulnerability unique to generative AI systems that interpret and respond to natural language inputs.","ans":"Y"}]},{"topic":1,"num":17,"question":"HOTSPOT - You have a Microsoft 365 subscription. You do NOT have a Microsoft 365 Copilot license. For each of the following statements, select Yes if the statement is true. Otherwise, select No. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **Yes, Yes, No**\n\n#### 💡 Giải thích (từ v1)\n\nCopilot Chat (miễn phí) cho tải file cục bộ (1-Yes) và có sẵn với các gói M365 thương mại như Business Standard (2-Yes). Không có license Copilot, agent chỉ grounded ở web/file tải lên — không truy cập dữ liệu tổ chức trên SharePoint (3-No).\n\n#### 📚 Nguồn tham khảo\n\nsupport.microsoft.com — Copilot Chat with/without a license\n\n#### 🔎 Độ tin cậy: **Trung bình (M)**","kind":"yesno","statements":[{"text":"Microsoft 365 Copilot Chat lets you upload documents from your local computer.","ans":"Y"},{"text":"Microsoft 365 Copilot Chat is included with Microsoft 365 Business Standard.","ans":"Y"},{"text":"Microsoft 365 Copilot Chat lets you create and use agents that can access Microsoft SharePoint folders.","ans":"N"}]},{"topic":1,"num":18,"question":"You open Microsoft 356 Copilot as shown in the following exhibit. \n![exhibit](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA2EAAALICAYAAAD2aPitAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsIAAA7CARUoSoAAAAGHaVRYdFhNTDpjb20uYWRvYmUueG1wAAAAAAA8P3hwYWNrZXQgYmVnaW49J++7vycgaWQ9J1c1TTBNcENlaGlIenJlU3pOVGN6a2M5ZCc/Pg0KPHg6eG1wbWV0YSB4bWxuczp4PSJhZG9iZTpuczptZXRhLyI+PHJkZjpSREYgeG1sbnM6cmRmPSJodHRwOi8vd3d3LnczLm9yZy8xOTk5LzAyLzIyLXJkZi1zeW50YXgtbnMjIj48cmRmOkRlc2NyaXB0aW9uIHJkZjphYm91dD0idXVpZDpmYWY1YmRkNS1iYTNkLTExZGEtYWQzMS1kMzNkNzUxODJmMWIiIHhtbG5zOnRpZmY9Imh0dHA6Ly9ucy5hZG9iZS5jb20vdGlmZi8xLjAvIj48dGlmZjpPcmllbnRhdGlvbj4xPC90aWZmOk9yaWVudGF0aW9uPjwvcmRmOkRlc2NyaXB0aW9uPjwvcmRmOlJERj48L3g6eG1wbWV0YT4NCjw/eHBhY2tldCBlbmQ9J3cnPz4slJgLAAD+EklEQVR4Xuz9ebAd153fCX7Oycx779sfHnYQC0GAIECKEkWJFCVRVdpKW9nV4y67 question":"HOTSPOT - Select the answer that correctly completes the sentence.","options":[],"correct":[],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **Enterprise data protection (EDP)**\n\n#### 💡 Giải thích (từ v1)\n\nEnterprise data protection (EDP) là cam kết giữ dữ liệu trong tenant M365 và không dùng để huấn luyện model.\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Enterprise data protection (EDP) for Copilot\n\n#### 🔎 Độ tin cậy: **Cao (H)**","kind":"drop","parts":[{"pre":"_____ in Microsoft 365 Copilot ensures that business data stays within a Microsoft 365 tenant and is NOT used to train AI models.","choices":["The Common Data Model","Enterprise data protection (EDP)","Sensitivity labels","Zero Trust"],"ans":1}]},{"topic":1,"num":20,"question":"HOTSPOT - Select the answer that correctly completes the sentence.","options":[],"correct":[],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **all the Microsoft 365 Copilot activity.**\n\n#### 💡 Giải thích (từ v1)\n\n'Delete history' trong My Account xóa toàn bộ hoạt động Copilot.\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Delete Copilot activity history\n\n#### 🔎 Độ tin cậy: **Trung bình (M)**","kind":"drop","parts":[{"pre":"From the Microsoft 365 My Account portal, if you select Delete history for the Copilot activity history, you can delete _____","choices":["a specific conversation.","a specific date range of activity.","all the Microsoft 365 Copilot activity.","all conversations with a specific agent."],"ans":2}]},{"topic":1,"num":21,"question":"You use Microsoft 365 Copilot to generate a training plan. You need to check if there are any existing training plans in your organization that are similar to the new training plan. What should you use in Copilot?","options":[{"key":"A","text":"Search"},{"key":"B","text":"Designer"},{"key":"C","text":"Apps"},{"key":"D","text":"Pages"}],"correct":["A"],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **A**\n\n#### 💡 Giải thích (từ v1)\n\nDùng Search của Microsoft 365 Copilot để tìm nội dung hiện có trong tổ chức (theo phân quyền của bạn).\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Microsoft 365 Copilot Search\n\n#### 🔎 Độ tin cậy: **Cao (H)**"},{"topic":1,"num":22,"question":"You use the Researcher agent in Microsoft 365 Copilot to generate a report. What can you use to verify whether the report was generated by using valid sources?","options":[{"key":"A","text":"citations"},{"key":"B","text":"instructions"},{"key":"C","text":"memory"},{"key":"D","text":"capabilities"}],"correct":["A"],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **A**\n\n#### 💡 Giải thích (từ v1)\n\nTrích dẫn (citations) cho biết nguồn mà báo cáo dựa vào, giúp bạn kiểm chứng tính hợp lệ.\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Researcher agent citations\n\n#### 🔎 Độ tin cậy: **Cao (H)**"},{"topic":1,"num":23,"question":"HOTSPOT - Select the answer that correctly completes the sentence.","options":[],"correct":[],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **users accept the AI-generated output without verifying its accuracy.**\n\n#### 💡 Giải thích (từ v1)\n\nOverreliance = chấp nhận kết quả AI mà không kiểm chứng. (Các phương án khác mô tả prompt injection hoặc fabrication.)\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Responsible AI risks (overreliance)\n\n#### 🔎 Độ tin cậy: **Cao (H)**","kind":"drop","parts":[{"pre":"Overreliance is a common risk associated with generative AI, where _____","choices":["users exploit vulnerabilities to elicit unauthorized behavior.","the model is tricked into exposing confidential information.","the model generates misleading, inaccurate, or irrelevant content.","users accept the AI-generated output without verifying its accuracy."],"ans":3}]},{"topic":1,"num":24,"question":"You ask Microsoft 365 Copilot to create a report based on information from the web. You verify the response and discover that some information is fictional. What is this an example of?","options":[{"key":"A","text":"deepfake"},{"key":"B","text":"fabrication"},{"key":"C","text":"overreliance"},{"key":"D","text":"prompt injection"},{"key":"E","text":"bias"}],"correct":["B"],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **B**\n\n#### 💡 Giải thích (từ v1)\n\nAI tạo ra thông tin sai/hư cấu nhưng trông hợp lý gọi là 'fabrication' (ảo giác/hallucination).\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Responsible AI: fabrication/hallucination\n\n#### 🔎 Độ tin cậy: **Cao (H)**"},{"topic":1,"num":25,"question":"HOTSPOT - For each of the following statements, select Yes if the statement is true. Otherwise, select No. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **No, Yes, No**\n\n#### 💡 Giải thích (từ v1)\n\nAgent không tự động chia sẻ (1-No; bạn chủ động chia sẻ). Có thể dùng agent trong Teams (2-Yes). Người được chia sẻ chỉ dùng, không sửa được instructions (3-No).\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Build & share agents (Agent Builder)\n\n#### 🔎 Độ tin cậy: **Trung bình (M)**","kind":"yesno","statements":[{"text":"Agents that you create in the Microsoft 365 Copilot app are shared automatically with users in your organization.","ans":"N"},{"text":"If you create an agent in the Microsoft 365 Copilot app, you can interact with the agent by using Microsoft Teams.","ans":"Y"},{"text":"If you create an agent in the Microsoft 365 Copilot app and share the agent with a user, the user can modify the agent instructions.","ans":"N"}]},{"topic":2,"num":1,"question":"HOTSPOT - Select the answer that correctly completes the sentence.","options":[],"correct":[],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **deleted immediately.**\n\n#### 💡 Giải thích (từ v1)\n\nTemporary chat không được lưu vào lịch sử; khi rời đi, nội dung bị xóa (không lưu). Trong các lựa chọn, 'deleted immediately' là phù hợp nhất.\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Temporary chat in Copilot\n\n#### 🔎 Độ tin cậy: **Trung bình (M)**","kind":"drop","parts":[{"pre":"If you start a temporary chat in Microsoft 365 Copilot, and then start a new chat, all the prompts and responses from the temporary chat will be _____","choices":["deleted immediately.","deleted after one hour.","moved to a private notebook.","moved to your Microsoft OneDrive."],"ans":0}]},{"topic":2,"num":2,"question":"You are using Microsoft 365 Copilot to plan a trip and have asked Copilot to remember several details about the trip. You cancel the trip plans. You need to ensure that Copilot forgets the details. What should you do?","options":[{"key":"A","text":"From the My Account portal, delete the Copilot activity history."},{"key":"B","text":"From Copilot, delete memories."},{"key":"C","text":"From Copilot, delete custom instructions."},{"key":"D","text":"From Copilot, delete all the conversation about the trip."}],"correct":["B"],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **B**\n\n#### 💡 Giải thích (từ v1)\n\nCác chi tiết được Copilot 'ghi nhớ' nằm trong Copilot Memory; xóa các memory tương ứng để Copilot quên. Xóa hội thoại không xóa nội dung đã lưu vào memory.\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Copilot Memory (manage/delete memories)\n\n#### 🔎 Độ tin cậy: **Cao (H)**"},{"topic":2,"num":3,"question":"You are a marketing assistant preparing for a budget meeting with your manager. You need to evaluate key spending and performance trends from the last year to understand which marketing channels deliver the best return on investment (ROI). What should you use in Microsoft 365 Copilot to achieve the goal? More than one answer choice may achieve the goal. Select the BEST answer.","options":[{"key":"A","text":"the Analyst agent"},{"key":"B","text":"Chat"},{"key":"C","text":"the Researcher agent"},{"key":"D","text":"a notebook"}],"correct":["A"],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **A**\n\n#### 💡 Giải thích (từ v1)\n\nAnalyst agent chuyên phân tích dữ liệu (chạy phân tích trên dữ liệu của bạn, kể cả code). Researcher agent thiên về nghiên cứu đa nguồn/web.\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Analyst agent in Microsoft 365 Copilot\n\n#### 🔎 Độ tin cậy: **Cao (H)**"},{"topic":2,"num":4,"question":"You have several pages in Microsoft 365 Copilot related to the research you are doing for a new product. You need to simplify your ability to have many different Copilot conversations about the pages. What should you do first?","options":[{"key":"A","text":"Create a story."},{"key":"B","text":"Add the pages to a notebook."},{"key":"C","text":"Add the pages to a conversation."},{"key":"D","text":"Download the pages locally."}],"correct":["B"],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **B**\n\n#### 💡 Giải thích (từ v1)\n\nNotebook cho phép gom các tài liệu tham chiếu (gồm các page) để trò chuyện với Copilot nhiều lần dựa trên cùng nguồn.\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Copilot Notebooks\n\n#### 🔎 Độ tin cậy: **Cao (H)**"},{"topic":2,"num":5,"question":"You are creating a custom analytics agent in the Microsoft 365 Copilot app. The agent will use Microsoft Excel files that contain sales data as knowledge. You need to ensure that the agent can create visualizations, perform mathematical operations, create aggregations, and analyze the data in the files. What should you add to the agent?","options":[{"key":"A","text":"a suggested prompt"},{"key":"B","text":"code interpreter"},{"key":"C","text":"image generator"},{"key":"D","text":"a template"}],"correct":["B"],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **B**\n\n#### 💡 Giải thích (từ v1)\n\nCode interpreter cho phép agent chạy code (Python) để phân tích dữ liệu và tạo biểu đồ/visualization. Image generator chỉ tạo hình ảnh nghệ thuật.\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Agent capabilities: code interpreter\n\n#### 🔎 Độ tin cậy: **Cao (H)**"},{"topic":2,"num":6,"question":"You create a prompt in Microsoft 365 Copilot to help you create a draft project report. You need the prompt to be available in the Copilot Prompt Gallery. What should you do first?","options":[{"key":"A","text":"Create a notebook."},{"key":"B","text":"Add an agent."},{"key":"C","text":"Create a page."},{"key":"D","text":"Run the prompt."}],"correct":["D"],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **D**\n\n#### 💡 Giải thích (từ v1)\n\nQuy trình: chạy prompt trước, sau đó mới lưu prompt vào Prompt Gallery. Vì vậy bước đầu tiên là chạy prompt.\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Saving prompts to the Prompt Gallery\n\n#### 🔎 Độ tin cậy: **Trung bình (M)**"},{"topic":2,"num":7,"question":"You create a Microsoft 365 Copilot notebook and add a file named Process.docx from a local folder. Yesterday, you updated Process.docx in the local folder. What will occur when you chat in the notebook?","options":[{"key":"A","text":"The chat will reference the most recent version of Process.docx."},{"key":"B","text":"The chat will reference both versions of Process.docx."},{"key":"C","text":"The chat will reference only the original version of Process.docx."}],"correct":["C"],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **C**\n\n#### 💡 Giải thích (từ v1)\n\nFile tải lên từ máy cục bộ là bản chụp tại thời điểm thêm vào — cập nhật cục bộ sau đó không đồng bộ. Notebook vẫn dùng bản gốc đã upload.\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Notebooks: local file vs SharePoint reference\n\n#### 🔎 Độ tin cậy: **Cao (H)**"},{"topic":2,"num":8,"question":"You have several separate Microsoft 365 Copilot conversations. You need to gather the conversations so that you can find them more easily, and the conversations can share the same reference material. What is the best solution to achieve the goal? More than one answer choice may achieve the goal. Select the BEST answer.","options":[{"key":"A","text":"a notebook"},{"key":"B","text":"an agent"},{"key":"C","text":"an app"},{"key":"D","text":"a page"}],"correct":["A"],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **A**\n\n#### 💡 Giải thích (từ v1)\n\nNotebook là nơi gom nhiều hội thoại liên quan và chia sẻ cùng nguồn tài liệu tham chiếu.\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Copilot Notebooks purpose\n\n#### 🔎 Độ tin cậy: **Cao (H)**"},{"topic":2,"num":9,"question":"You plan to use a notebook in Microsoft 365 Copilot. What is the purpose of a notebook?","options":[{"key":"A","text":"to create a transcript of a conversation that you can easily email to other users"},{"key":"B","text":"to provide a private location that can be used to organize reference materials across related conversations"},{"key":"C","text":"to generate a summary of all the interactions you had with Copilot during a specific conversation"}],"correct":["B"],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **B**\n\n#### 💡 Giải thích (từ v1)\n\nNotebook là không gian riêng để gom và tổ chức tài liệu tham chiếu, dùng chung cho nhiều hội thoại liên quan.\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Copilot Notebooks\n\n#### 🔎 Độ tin cậy: **Cao (H)**"},{"topic":2,"num":10,"question":"You have a Microsoft Excel workbook open that contains a table. The table contains sales data and the following columns: • OrderDate • OrderNumber • Amount You plan to use Microsoft Copilot in Excel to generate a monthly summary of the sales data in the table. What should you include in the prompt to generate an effective summary? More than one answer choice may achieve the goal. Select the BEST answer.","options":[{"key":"A","text":"the desired format of the response"},{"key":"B","text":"a specific cell range from the worksheet"},{"key":"C","text":"the file name of the workbook"},{"key":"D","text":"the clear goal of the summary"},{"key":"E","text":"a formula to calculate monthly totals"}],"correct":["D"],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **D**\n\n#### 💡 Giải thích (từ v1)\n\nCopilot cần một mục tiêu rõ ràng cho phần tóm tắt để đưa ra kết quả hữu ích; nó tự hiểu dữ liệu trong bảng nên không cần bạn cung cấp vùng ô hay công thức.\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Prompting best practices (clear goal)\n\n#### 🔎 Độ tin cậy: **Cao (H)**"},{"topic":2,"num":11,"question":"You are creating a prompt in Microsoft 365 Copilot to get information about a proposal. You need to ensure that the response is grounded in the proposal's information. What is the best approach to achieve the goal? More than one answer choice may achieve the goal. Select the BEST answer.","options":[{"key":"A","text":"Add context about the intended audience."},{"key":"B","text":"Instruct Copilot to rely on its training data to infer proposal details."},{"key":"C","text":"Reference the proposal content in the prompt."},{"key":"D","text":"Add a specific goal that you want Copilot to accomplish."}],"correct":["C"],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **C**\n\n#### 💡 Giải thích (từ v1)\n\nĐể phản hồi bám sát tài liệu, hãy tham chiếu trực tiếp nội dung/đề xuất (đính kèm file, dùng /) để Copilot 'ground' câu trả lời vào đó.\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Grounding prompts with references\n\n#### 🔎 Độ tin cậy: **Cao (H)**"},{"topic":2,"num":12,"question":"You need to improve prompt-grounding during a Microsoft 365 Copilot conversation. What is the best approach to achieve the goal? More than one answer choice may achieve the goal. Select the BEST answer.","options":[{"key":"A","text":"Use shorter prompts."},{"key":"B","text":"Provide the desired output format."},{"key":"C","text":"Avoid technical jargon."},{"key":"D","text":"Reference specific files."}],"correct":["D"],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **D**\n\n#### 💡 Giải thích (từ v1)\n\nGrounding tốt nhất đạt được khi tham chiếu các file cụ thể để Copilot dựa vào nội dung thật thay vì suy đoán.\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Grounding & referencing files\n\n#### 🔎 Độ tin cậy: **Cao (H)**"},{"topic":2,"num":13,"question":"You create a Microsoft 365 Copilot notebook and add a file named Process.docx from a Microsoft SharePoint site as a reference. Yesterday, a user updated Process.docx in the SharePoint site. What will occur when you chat in the notebook?","options":[{"key":"A","text":"The chat will reference only the original version of Process.docx."},{"key":"B","text":"The chat will reference the most recent version of Process.docx."},{"key":"C","text":"The chat will reference both versions of Process.docx."}],"correct":["B"],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **B**\n\n#### 💡 Giải thích (từ v1)\n\nFile tham chiếu từ SharePoint là liên kết động — notebook luôn dùng phiên bản mới nhất trên SharePoint (khác với file upload cục bộ).\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Notebooks: SharePoint references stay current\n\n#### 🔎 Độ tin cậy: **Cao (H)**"},{"topic":2,"num":14,"question":"You use Microsoft 365 Copilot. You discover that you had a conversation that used a knowledge source that contains confidential information. You need to delete the conversation data without requiring administrative approval. You must retain your other conversations, if possible. What should you use?","options":[{"key":"A","text":"the Microsoft 365 admin center"},{"key":"B","text":"the My Account portal in Microsoft 365 Copilot"},{"key":"C","text":"the Microsoft Purview compliance portal"},{"key":"D","text":"the Microsoft 365 Copilot app"}],"correct":["D"],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **D**\n\n#### 💡 Giải thích (từ v1)\n\nNgười dùng có thể tự xóa hội thoại của mình ngay trong app M365 Copilot mà không cần quyền admin. Các lựa chọn còn lại cần quyền quản trị.\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Delete your Copilot conversations\n\n#### 🔎 Độ tin cậy: **Trung bình (M)**"},{"topic":2,"num":15,"question":"You have an open Microsoft 365 Copilot conversation. You need to chat with an agent named Agent1 during the conversation. What should you enter to call Agent1?","options":[{"key":"A","text":"[Agent1]"},{"key":"B","text":"#Agent1"},{"key":"C","text":"/Agent1"},{"key":"D","text":"@Agent1"}],"correct":["D"],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **D**\n\n#### 💡 Giải thích (từ v1)\n\nDùng ký hiệu @ để gọi/mention một agent trong hội thoại: @Agent1.\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Mentioning agents with @ in Copilot\n\n#### 🔎 Độ tin cậy: **Cao (H)**"},{"topic":2,"num":16,"question":"You use Microsoft 365 Copilot. You regularly upload the same five files to Copilot chats. You need to simplify referencing the files in the chats. What are two ways to achieve the goal? Each correct answer presents a complete solution. NOTE: Each correct selection is worth one point.","options":[{"key":"A","text":"Create an agent that has a knowledge source."},{"key":"B","text":"Send a prompt that includes the files, and then save the prompt."},{"key":"C","text":"Create a notebook that references the files."},{"key":"D","text":"Ask the data engineers to create a fine-tuned model."},{"key":"E","text":"Zip the documents and upload the ZIP file to the chats."}],"correct":["A","C"],"multi":true,"explanation":"#### 🎯 Đáp án đúng: **A, C**\n\n#### 💡 Giải thích (từ v1)\n\nTạo agent với knowledge source (A) hoặc notebook tham chiếu các file (C) để tái sử dụng nguồn mà không phải upload lại mỗi lần.\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Agents knowledge & Notebooks\n\n#### 🔎 Độ tin cậy: **Cao (H)**"},{"topic":2,"num":17,"question":"You have a Microsoft 365 subscription. You do NOT have a Microsoft 365 Copilot license. When you send a prompt in Microsoft 365 Copilot Chat, which three sources does Copilot Chat use to respond? Each correct answer presents part of the solution. NOTE: Each correct selection is worth one point.","options":[{"key":"A","text":"chat data in Microsoft Teams"},{"key":"B","text":"your organization's databases"},{"key":"C","text":"the prompt context"},{"key":"D","text":"organizational data in Microsoft 365"},{"key":"E","text":"internet search data"},{"key":"F","text":"the conversation history"}],"correct":["C","E","F"],"multi":true,"explanation":"#### 🎯 Đáp án đúng: **C, E, F**\n\n#### 💡 Giải thích (từ v1)\n\nKhông có license, Copilot Chat chỉ 'ground' vào web + prompt + lịch sử hội thoại (C, E, F). Nó KHÔNG truy cập dữ liệu tổ chức qua Microsoft Graph.\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Copilot Chat with/without a license (web-grounded only)\n\n#### 🔎 Độ tin cậy: **Cao (H)**"},{"topic":2,"num":18,"question":"You are a project coordinator for a small consulting firm. You are responsible for tracking client communications, managing project timelines, and preparing weekly status updates for internal stakeholders. You have a Microsoft 365 Copilot license. You create an agent to help you monitor project milestones, follow up on client emails, and generate weekly summary reports. With whom can you share the agent?","options":[{"key":"A","text":"only the people in your organization"},{"key":"B","text":"the people in your organization and people that have personal Microsoft accounts"},{"key":"C","text":"only Microsoft Teams channel members"},{"key":"D","text":"any person who has a valid email address"}],"correct":["A"],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **A**\n\n#### 💡 Giải thích (từ v1)\n\nPrompt chia sẻ bị giới hạn trong ranh giới tổ chức/tenant — chỉ người trong tổ chức mới dùng được.\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Sharing prompts (organization boundary)\n\n#### 🔎 Độ tin cậy: **Trung bình (M)**"},{"topic":2,"num":19,"question":"HOTSPOT - From Microsoft 365 Copilot, you add custom instructions. For each of the following statements, select Yes if the statement is true. Otherwise, select No. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **Yes, No, No**\n\n#### 💡 Giải thích (từ v1)\n\nCustom instructions áp dụng cho hội thoại Copilot chat mới (1-Yes), không áp dụng cho các agent chuyên biệt như Researcher/Analyst (2-No) và không hồi tố phản hồi cũ (3-No).\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Custom instructions in Copilot\n\n#### 🔎 Độ tin cậy: **Trung bình (M)**","kind":"yesno","statements":[{"text":"The instructions will apply to new chat conversations.","ans":"Y"},{"text":"The instructions will apply to new conversations with the Researcher agent and the Analyst agent.","ans":"N"},{"text":"The instructions will apply to previous responses in existing conversation.","ans":"N"}]},{"topic":2,"num":20,"question":"HOTSPOT - You create an agent in the Microsoft 365 Copilot app by using a template. For each of the following statements, select Yes if the statement is true. Otherwise, select No. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **No, Yes, Yes**\n\n#### 💡 Giải thích (từ v1)\n\nAgent không chia sẻ ra ngoài tổ chức (1-No). Bạn chọn được knowledge sources (2-Yes) và chia sẻ nội bộ tổ chức (3-Yes).\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Agent Builder: knowledge & sharing\n\n#### 🔎 Độ tin cậy: **Cao (H)**","kind":"yesno","statements":[{"text":"You can share the agent with external users.","ans":"N"},{"text":"You can choose which knowledge sources the agent can use.","ans":"Y"},{"text":"You can share the agent with users in your organization.","ans":"Y"}]},{"topic":2,"num":21,"question":"HOTSPOT - For each of the following statements, select Yes if the statement is true. Otherwise, select No. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **Yes, No, Yes**\n\n#### 💡 Giải thích (từ v1)\n\nXem lịch sử từ My Account (1-Yes) và xóa toàn bộ lịch sử gồm prompt/phản hồi (3-Yes). Xóa lịch sử KHÔNG xóa notebook/page (2-No).\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Manage Copilot activity in My Account\n\n#### 🔎 Độ tin cậy: **Cao (H)**","kind":"yesno","statements":[{"text":"You can review the Microsoft 365 Copilot activity history from the My Account portal.","ans":"Y"},{"text":"When you delete the Microsoft 365 Copilot activity history, you also immediately delete all the associated notebooks and pages.","ans":"N"},{"text":"Users can delete their entire Microsoft 365 Copilot activity history, including their prompts and the responses Copilot returns.","ans":"Y"}]},{"topic":2,"num":22,"question":"HOTSPOT - For each of the following statements, select Yes if the statement is true. Otherwise, select No. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **No, No, No**\n\n#### 💡 Giải thích (từ v1)\n\nLLM có tính ngẫu nhiên (non-deterministic) nên cùng một prompt có thể cho phản hồi khác nhau — cả ba đều No.\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — How Copilot works (probabilistic outputs)\n\n#### 🔎 Độ tin cậy: **Cao (H)**","kind":"yesno","statements":[{"text":"When you submit the same prompt to Microsoft 365 Copilot multiple times, and you are grounded in the web, the response will always be identical.","ans":"N"},{"text":"When you submit the same prompt to Microsoft 365 Copilot multiple times, and you are grounded in your own data, the response will always be identical.","ans":"N"},{"text":"When you submit the same prompt to Microsoft 365 Copilot multiple times, and you are grounded only in the model's knowledge, the response will always be identical.","ans":"N"}]},{"topic":2,"num":23,"question":"HOTSPOT - For each of the following statements, select Yes if the statement is true. Otherwise, select No. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **Yes, No, Yes**\n\n#### 💡 Giải thích (từ v1)\n\nCopilot dùng ngữ cảnh tổ chức để gợi ý prompt (1-Yes) và bổ sung prompt trước khi gửi tới LLM — đây là grounding/RAG (3-Yes). Ngữ
