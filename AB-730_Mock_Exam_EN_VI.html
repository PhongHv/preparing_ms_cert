ạnh chữ 'Copilot' có biểu tượng nhãn nhạy cảm (icon màu đỏ) — cho biết Document1.docx đang gắn sensitivity label. Copilot vẫn tóm tắt được nên tệp hợp lệ và truy cập được (loại C, D sai); không có dấu hiệu nó nằm trong notebook (loại A).\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com/purview — Copilot hiển thị nhãn nhạy cảm của nguồn trong references\n\n#### 🔎 Độ tin cậy: **Trung bình (M)**","kind":"drop","parts":[{"pre":"Document1.docx [answer choice]","choices":["is in a notebook.","has a sensitivity label applied.","is NOT a supported file type.","is NOT accessible outside of your organization."],"ans":1}]},{"topic":2,"num":34,"question":"HOTSPOT - You are creating an agent in the Microsoft 365 Copilot app. For each of the following statements, select Yes if the statement is true. Otherwise, select No. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **No, Yes, No**\n\n#### 💡 Giải thích (từ v1)\n\nAgent Builder dùng ngôn ngữ tự nhiên để tạo agent (2-Yes). Nguồn kiến thức là SharePoint/OneDrive/website/Teams chat/file... — không phải hộp thư chia sẻ (1-No) hay một agent khác (3-No).\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Add knowledge sources to a declarative agent\n\n#### 🔎 Độ tin cậy: **Trung bình (M)**","kind":"yesno","statements":[{"text":"You can configure the agent to search shared mailboxes.","ans":"N"},{"text":"You can use natural language prompts to create the agent.","ans":"Y"},{"text":"You can configure the agent to use another agent as a knowledge source.","ans":"N"}]},{"topic":2,"num":35,"question":"HOTSPOT - You plan to create an agent by using the Microsoft 365 Copilot app. For each of the following statements, select Yes if the statement is true. Otherwise, select No. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **No, Yes, No**\n\n#### 💡 Giải thích (từ v1)\n\nAgent tạo bằng Agent Builder chạy trong app Copilot/Teams, không có trong Word (1-No); chia sẻ nội bộ được (2-Yes). Quy trình phức tạp với connector bên thứ ba là phạm vi Copilot Studio, không phải declarative agent đơn giản (3-No).\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Agent Builder vs Copilot Studio\n\n#### 🔎 Độ tin cậy: **Trung bình (M)**","kind":"yesno","statements":[{"text":"The agent will be available in Microsoft Word.","ans":"N"},{"text":"The agent can be shared to other users in your organization.","ans":"Y"},{"text":"The agent can contain complex workflows that use third-party connectors.","ans":"N"}]},{"topic":2,"num":36,"question":"You create a prompt and add several files from your Microsoft OneDrive. You share the prompt to a user by using email. What occurs when the user uses the prompt?","options":[{"key":"A","text":"The user is granted access to the files automatically and can run the prompt."},{"key":"B","text":"The files are removed from the shared prompt, and the user must add the files manually before they can run the prompt."},{"key":"C","text":"The user is prompted to request access to the files when they attempt to run the prompt."},{"key":"D","text":"The user can run the prompt successfully only if they have access to the files in your OneDrive."}],"correct":["D"],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **D**\n\n#### 💡 Giải thích (từ v1)\n\nChia sẻ prompt không cấp quyền file. Người nhận chỉ chạy được đầy đủ nếu bản thân họ đã có quyền truy cập các file OneDrive được tham chiếu.\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Sharing prompts & file permissions\n\n#### 🔎 Độ tin cậy: **Cao (H)**"},{"topic":2,"num":37,"question":"In Microsoft 365 Copilot, you save a prompt. Which two actions can you perform for the saved prompt? Each correct answer presents a complete the solution. NOTE: Each correct selection is worth one point.","options":[{"key":"A","text":"Modify the saved prompt text."},{"key":"B","text":"Remove the saved prompt from the Copilot Prompt Gallery."},{"key":"C","text":"Update the title of the saved prompt."},{"key":"D","text":"Schedule the saved prompt to run daily."},{"key":"E","text":"Share the saved prompt to a Microsoft Teams team."}],"correct":["B","E"],"multi":true,"explanation":"#### 🎯 Đáp án đúng: **B, E**\n\n#### 💡 Giải thích (từ v1)\n\nVới prompt đã lưu, bạn có thể gỡ khỏi Prompt Gallery (B) và chia sẻ tới team trong Teams (E). Chỉnh sửa nội dung/tiêu đề không được hỗ trợ trực tiếp; lên lịch là tính năng riêng. (Độ tin cậy Trung bình.)\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Managing saved prompts (community-verified)\n\n#### 🔎 Độ tin cậy: **Trung bình (M)**"},{"topic":2,"num":38,"question":"HOTSPOT - For each of the following statements, select Yes if the statement is true. Otherwise, select No. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **No, No, Yes**\n\n#### 💡 Giải thích (từ v1)\n\nKhông giới hạn 20 hội thoại (1-No) và có thể xóa hội thoại (2-No). Hội thoại đồng bộ theo tài khoản nên tiếp tục được trên web ở máy khác (3-Yes).\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Copilot conversations sync across apps\n\n#### 🔎 Độ tin cậy: **Trung bình (M)**","kind":"yesno","statements":[{"text":"From the Microsoft 365 Copilot desktop app, you can see only the last 20 conversations.","ans":"N"},{"text":"From the Microsoft 365 Copilot desktop app, you can hide conversations, but you cannot delete them.","ans":"N"},{"text":"If you start a conversation in the Microsoft 365 Copilot desktop app, you can continue the conversation when you sign in to Copilot by using a web browser on a different computer.","ans":"Y"}]},{"topic":2,"num":39,"question":"HOTSPOT - For each of the following statements, select Yes if the statement is true. Otherwise, select No. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **Yes, Yes, Yes**\n\n#### 💡 Giải thích (từ v1, đã hiệu chỉnh ý 3)\n\nNotebook nhóm được các hội thoại (1-Yes) và (theo bản cập nhật 2026) hỗ trợ chia sẻ/cộng tác với đồng nghiệp & M365 Groups (2-Yes). Notebook không có tính năng 'instructions' để chỉ dẫn cách trả lời (3-No; đó là custom instructions của agent).\n\n#### 📚 Nguồn tham khảo\n\ntechcommunity.microsoft.com — Copilot Notebooks collaboration enhancements\n\n#### 🔎 Độ tin cậy: **Cao (H)**\n\n#### ✅ Kết quả kiểm chứng lại (07/2026, link còn sống)\n\nSỬA ý 3 từ No → **Yes**: trang hỗ trợ chính thức của Microsoft (cập nhật 02/2026) hướng dẫn thêm **Copilot instructions** cho notebook — \"ask Copilot to format responses how you want, focus on a topic, use a specific tone, and more\". Ý 2 (cộng tác) cũng được xác nhận: \"Sharing your notebook lets others join in, view your instructions, and make edits together in real time\".\n\n- Link sống 1 (instructions): https://support.microsoft.com/en-us/topic/provide-custom-instructions-for-your-microsoft-365-copilot-notebook-763a9536-d459-4f90-8835-c411863d91ce\n- Link sống 2 (share/cộng tác): https://support.microsoft.com/en-US/Microsoft-365-Copilot/share-a-microsoft-365-copilot-notebook","kind":"yesno","statements":[{"text":"You can group conversations into a Microsoft 365 Copilot notebook.","ans":"Y"},{"text":"You can use a Microsoft 365 Copilot notebook to collaborate with users in your organization.","ans":"Y"},{"text":"You can add instructions to a Microsoft 365 Copilot notebook to tell Copilot how to respond.","ans":"Y"}]},{"topic":2,"num":40,"question":"HOTSPOT - For each of the following statements, select Yes if the statement is true. Otherwise, select No. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **Yes, Yes, Yes**\n\n#### 💡 Giải thích (từ v1)\n\nScheduled prompts trong Copilot Chat: (1) có thể web-grounded; (2) chạy tối đa 1 lần/ngày; (3) tối đa 15 lần — cả 3 đều Yes theo tài liệu Microsoft.\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com\n\n#### 🔎 Độ tin cậy: **Thấp (L)**","kind":"yesno","statements":[{"text":"Scheduled prompts can be web-grounded.","ans":"Y"},{"text":"Scheduled prompts can run a maximum of once per day.","ans":"Y"},{"text":"Scheduled prompts can run up to a maximum of 15 times.","ans":"Y"}]},{"topic":3,"num":1,"question":"HOTSPOT - For each of the following statements, select Yes if the statement is true. Otherwise, select No. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **Yes, Yes, Yes**\n\n#### 💡 Giải thích (từ v1)\n\nCả ba đều đúng: Copilot kết hợp kiến thức model, dữ liệu doanh nghiệp (Graph) và thông tin web để tăng độ cụ thể của phản hồi.\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — How Copilot grounds responses\n\n#### 🔎 Độ tin cậy: **Cao (H)**","kind":"yesno","statements":[{"text":"Microsoft 365 Copilot can use its own model knowledge to make the response of a prompt more specific.","ans":"Y"},{"text":"Microsoft 365 Copilot can use business data that will provide additional context to make the response of a prompt more specific.","ans":"Y"},{"text":"Microsoft 365 Copilot can use the latest information from the web that will provide additional context to make a prompt more specific.","ans":"Y"}]},{"topic":3,"num":2,"question":"HOTSPOT - Select the answer that correctly completes the sentence.","options":[],"correct":[],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **suggested prompts**\n\n#### 💡 Giải thích (từ v1)\n\nSuggested prompts là các câu gợi ý mẫu hiển thị cho người dùng khi bắt đầu tương tác với agent — giúp người dùng biết cách đặt câu hỏi và sử dụng agent hiệu quả hơn. Instructions kiểm soát hành vi và tính cách của agent (dành cho người tạo agent). Capabilities định nghĩa các tác vụ agent thực hiện được. Agent settings là cài đặt chung.\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Create and configure agents in Microsoft 365 Copilot\n\n#### 🔎 Độ tin cậy: **Cao (H)**","kind":"drop","parts":[{"pre":"From Microsoft 365 Copilot, you can use _____ to help users begin conversations with an agent and guide the users to use the agent more effectively.","choices":["agent settings","capabilities","instructions","suggested prompts"],"ans":3}]},{"topic":3,"num":3,"question":"You plan to summarize a proposal for a partnership between your company and another company. You need to use Microsoft 365 Copilot to summarize the information in the proposal as a bulleted list of three to five key points for a project kickoff meeting. Each bullet point must be concise and simply worded. Which two details should you include in the prompt? Each correct answer presents part of the solution. NOTE: Each correct selection is worth one point.","options":[{"key":"A","text":"a list of contact details for key stakeholders of the partnership"},{"key":"B","text":"profiles of both companies generated by using the Researcher agent"},{"key":"C","text":"a specific knowledge source to ground the response"},{"key":"D","text":"concise instructions for what to do with the proposal"}],"correct":["C","D"],"multi":true,"explanation":"#### 🎯 Đáp án đúng: **C, D**\n\n#### 💡 Giải thích (từ v1)\n\nPrompt tốt cần nguồn cụ thể để bám sát (C, chính là đề xuất) và chỉ dẫn rõ ràng về việc cần làm/định dạng (D — danh sách 3 ý).\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Prompting: goal + grounding source\n\n#### 🔎 Độ tin cậy: **Cao (H)**"},{"topic":3,"num":4,"question":"In a Microsoft 365 Copilot conversation, you generate a report, and then edit the report in a page. You need to collaborate with a colleague on the report. What are two ways to achieve the goal? Each correct answer presents a complete the solution. NOTE: Each correct selection is worth one point.","options":[{"key":"A","text":"Mention the colleague in the page."},{"key":"B","text":"Open the page in Microsoft Word."},{"key":"C","text":"Share the page link."},{"key":"D","text":"Add the page to a notebook."}],"correct":["A","C"],"multi":true,"explanation":"#### 🎯 Đáp án đúng: **A, C**\n\n#### 💡 Giải thích (từ v1)\n\nCopilot Pages hỗ trợ cộng tác thời gian thực: @mention đồng nghiệp (A) và chia sẻ link page (C). Mở trong Word hay thêm vào notebook không phục vụ cộng tác trực tiếp.\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Collaborate with Copilot Pages\n\n#### 🔎 Độ tin cậy: **Cao (H)**"},{"topic":3,"num":5,"question":"You attend many Microsoft Teams meetings. You want to ensure that you can catch up on key points and next steps after each meeting. Which Microsoft 365 Copilot feature should you use after the meetings?","options":[{"key":"A","text":"Recap"},{"key":"B","text":"Meeting Whiteboard"},{"key":"C","text":"Meeting info"},{"key":"D","text":"Thread summaries"}],"correct":["A"],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **A**\n\n#### 💡 Giải thích (từ v1)\n\nIntelligent Recap tổng hợp điểm chính, quyết định và action item sau cuộc họp.\n\n#### 📚 Nguồn tham khảo\n\nsupport.microsoft.com — Intelligent meeting recap in Teams\n\n#### 🔎 Độ tin cậy: **Cao (H)**"},{"topic":3,"num":6,"question":"You are creating a custom agent in the Microsoft 365 Copilot app for the marketing team at your company. The agent will be used to produce marketing collateral, including copy, logos and artwork. What should you add to the agent? More than one answer choice may achieve the goal. Select the BEST answer.","options":[{"key":"A","text":"code interpreter"},{"key":"B","text":"image generator"},{"key":"C","text":"a suggested prompt"},{"key":"D","text":"a template"}],"correct":["B"],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **B**\n\n#### 💡 Giải thích (từ v1)\n\nImage generator cho phép agent tạo logo/artwork/hình ảnh. Code interpreter phục vụ phân tích dữ liệu, không tạo hình.\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Agent capabilities: image generator\n\n#### 🔎 Độ tin cậy: **Cao (H)**"},{"topic":3,"num":7,"question":"You use Microsoft 365 Copilot to create a proposal in Microsoft Word based on a document in a Microsoft SharePoint library. You need to ensure that the information cited in the proposal is accurate. What is the best approach to achieve the goal? More than one answer choice may achieve the goal. Select the BEST answer.","options":[{"key":"A","text":"Manually verify the citations in the generated content."},{"key":"B","text":"Use Copilot in Word to verify the citations."},{"key":"C","text":"Create an agent that contains your organization's editorial standards and use the agent to verify the citations."},{"key":"D","text":"Create a notebook that contains all the reference material and use the notebook to verify the citations."}],"correct":["A"],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **A**\n\n#### 💡 Giải thích (từ v1)\n\nCon người phải tự kiểm chứng trích dẫn/độ chính xác — đây là nguyên tắc sử dụng AI có trách nhiệm; Copilot không tự đảm bảo tính đúng.\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Responsible AI: verify Copilot output\n\n#### 🔎 Độ tin cậy: **Cao (H)**"},{"topic":3,"num":8,"question":"HOTSPOT - You are a business user who uses Microsoft 365 apps and services, including Microsoft Teams. You have a work account. You want to use Microsoft 365 Copilot to help with meetings. For each of the following statements, select Yes if the statement is true. Otherwise, select No. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **No, Yes, Yes**\n\n#### 💡 Giải thích (từ v1)\n\nCopilot tôn trọng phân quyền: không truy cập cuộc họp bạn không được mời (1-No). Nó tóm tắt/hỏi đáp về chat, channel, cuộc họp (2-Yes) và các cuộc họp sắp tới bạn được mời (3-Yes).\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Copilot in Teams (respects access)\n\n#### 🔎 Độ tin cậy: **Trung bình (M)**","kind":"yesno","statements":[{"text":"Copilot can answer questions about Teams meetings that you are NOT invited to.","ans":"N"},{"text":"Copilot can provide summaries and answer questions about chat messages, channel posts, and Teams meetings.","ans":"Y"},{"text":"Copilot can provide a summary of all the upcoming Teams meeting details you are invited to next week.","ans":"Y"}]},{"topic":3,"num":9,"question":"You sign in to the Microsoft 365 Copilot app by using your work account as shown in the following exhibit. \n![exhibit](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA1UAAAJ3CAYAAAB87HtPAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsIAAA7CARUoSoAAAAGHaVRYdFhNTDpjb20uYWRvYmUueG1wAAAAAAA8P3hwYWNrZXQgYmVnaW49J++7vycgaWQ9J1c1TTBNcENlaGlIenJlU3pOVGN6a2M5ZCc/Pg0KPHg6eG1wbWV0YSB4bWxuczp4PSJhZG9iZTpuczptZXRhLyI+PHJkZjpSREYgeG1sbnM6cmRmPSJodHRwOi8vd3d3LnczLm9yZy8xOTk5LzAyLzIyLXJkZi1zeW50YXgtbnMjIj48cmRmOkRlc2NyaXB0aW9uIHJkZjphYm91dD0idXVpZDpmYWY1YmRkNS1iYTNkLTExZGEtYWQzMS1kMzNkNzUxODJmMWIiIHhtbG5zOnRpZmY9Imh0dHA6Ly9ucy5hZG9iZS5jb20vdGlmZi8xLjAvIj48dGlmZjpPcmllbnRhdGlvbj4xPC90aWZmOk9yaWVudGF0aW9uPjwvcmRmOkRlc2NyaXB0aW9uPjwvcmRmOlJERj48L3g6eG1wbWV0YT4NCjw/eHBhY2tldCBlbmQ9J3cnPz4slJgLAAD+EklEQVR4Xuz9Z7ccSZqYCT5m7h4RV0NrZCaQSGQidWV1VVd3FVtsky1Jnh3ucrnkzlDNGZ79Bzxnuj70D5j9AdzZWZ7DbTbZ7OHhNNlstqjqLi0yKysrJZAAElqLi6tDuZvtBzNzN/fwiBsXuAAukPYAcSPctHR7Xzfh4vTp03r7jh1MTU2htc4/WZYhhEBIiQA0oLUGBAIgNwWE+RYCQBt7LUBrlNZoBQKJQIKQCClQWoFSSKERaIRQQApCo3UEOjHfQpigTArQKBOX1CYJaMh/mpTZROW/bIpyt+bbph0QQpTcu9hwuRXOjfNe+DVlMhyB8EIbRAgTvitXnaexiHMcXLbMH2HrYjMx6RqWE611UUbe70E2njaNRrs6Xif8YeYbpVqv44Tr0uU+rh8pZdosNhwpJVLK3EwpNRC+64cIkKJw69JVdb8evvtq3kZRdevH7z7GwnYh7feeMtbav3OMoMaVvf+UumrgkSLMbX1ds0Hzmvp8Aily8QD5eQCvgUGq9yjHRu+RnzfqxhI37vhmw8px/DH/wVkv/IedlkcZfhnfzNRX4daOhdrYmfosy1dmjLb3YVvfg72lalJNRzlMrV3bMXJZ7sq5McnIZWfnx4/HpL/if4yUkGfXSBnVMvPryLlzfoRLk0WjrXwOWpkylUIWaVYqzye2HJ37ImiTWVfOQkrEhQsX9OzsLEmjUUqQE/SECQm0ERKdm1wFsAoVWpvKy+2MMpbHrjVKKFCaqAe6kUAsAYUQVhiVEhCoviJSJoRUKZQN11SCAgFaGj+mYGy+ca1H5CO6KRJP+MMqVHmBeHh5M5VSCMm5vRN2KxVoM27c25wbZaASh/XnylJrIziXKrsSviN3PwRXyVV/m4a2zbAmeL9t+L+rb ps://support.microsoft.com/en-US/Microsoft-365-Copilot/get-started-with-researcher-in-microsoft-365-copilot"},{"topic":3,"num":10,"question":"HOTSPOT - Select the answer that correctly completes the sentence.","options":[],"correct":[],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **the Describe tab**\n\n#### 💡 Giải thích (từ v1)\n\nTab 'Describe' cho phép mô tả bằng ngôn ngữ tự nhiên để AI dựng agent; tab 'Configure' là thiết lập thủ công.\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Agent Builder: Describe vs Configure\n\n#### 🔎 Độ tin cậy: **Trung bình (M)**","kind":"drop","parts":[{"pre":"When you are creating an agent in Microsoft 365 Copilot, you can leverage generative AI to build the agent by using _____","choices":["the Configure tab","a Copilot notebook","a Copilot page","the Describe tab"],"ans":3}]},{"topic":3,"num":11,"question":"HOTSPOT - What are two limitations of prompt scheduling in Microsoft 365 Copilot? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **Once per day · 15 times**\n\n#### 💡 Giải thích (từ v1)\n\nĐáp án theo bộ đề cộng đồng (tần suất tối đa 1 lần/ngày; tối đa 15 lần). LƯU Ý: tài liệu Microsoft KHÔNG công bố chính thức các con số này — độ tin cậy THẤP, cần kiểm chứng thêm.\n\n#### 📚 Nguồn tham khảo\n\nsupport.microsoft.com — Schedule Copilot prompts (số giới hạn chưa công bố)\n\n#### 🔎 Độ tin cậy: **Thấp (L)**","kind":"drop","parts":[{"pre":"You can schedule the prompt to run as often as:","choices":["Once per hour","Once per day","Once per week"],"ans":1},{"pre":"The maximum number of times that a scheduled prompt can run is:","choices":["15 times","365 times","Unlimited"],"ans":0}]},{"topic":3,"num":12,"question":"HOTSPOT - You have a Microsoft 365 Copilot license. You plan to run several prompts. What should you use to ensure that Copilot generates the best response for each prompt? More than one answer choice may achieve the goal. To answer, select the Best options in the answer area. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **The Researcher agent · The Analyst agent · Chat**\n\n#### 💡 Giải thích (từ v1)\n\nPrompt 1 = so sánh có nguồn/trích dẫn đa nguồn → Researcher agent. Prompt 2 = pivot table + phân tích số liệu Excel → Analyst agent. Prompt 3 = tổng hợp từ nội dung chat đã có → Chat.\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Analyst vs Researcher agents; Copilot Chat\n\n#### 🔎 Độ tin cậy: **Cao (H)**","kind":"drop","parts":[{"pre":"Prompt 1: Explain the differences between Contoso, Ltd, and Litware, Inc. Include sources and a table of the differences. Provide insights into why the differences exist.","choices":["The Analyst agent","Chat","The Researcher agent"],"ans":2},{"pre":"Prompt 2: From /Sales_2022.xlsx /Sales_2023.xlsx /Sales_2024.xlsx, create a pivot table of revenue by region and product, highlight MoM changes > 10%, and recommend 3 follow-up analyses.","choices":["The Analyst agent","Chat","The Researcher agent"],"ans":0},{"pre":"Prompt 3: Generate a structured action plan from an ongoing meeting chat, grouping tasks by functional area, identifying owners where mentioned, and including any implied deadlines or dependencies.","choices":["The Analyst agent","Chat","The Researcher agent"],"ans":1}]},{"topic":3,"num":13,"question":"HOTSPOT - Select the answer that correctly completes the sentence.","options":[],"correct":[],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **generate a recap of what was discussed during the meeting**\n\n#### 💡 Giải thích (internet 07/2026 — v1 không có câu này)\n\nCopilot chỉ có thể tạo recap (tóm tắt lại nội dung đã THẢO LUẬN) sau cuộc họp nếu cuộc họp được transcribe (hoặc record). Các hành động khác — lên lịch họp tiếp theo, tóm tắt đoạn chat, xác định file đính kèm — không phụ thuộc transcript. (v1 không có câu này do bị trùng câu khác.)\n\n#### 📚 Nguồn tham khảo\n\nsupport.microsoft.com — Meeting recap in Microsoft Teams; Use Copilot in Microsoft Teams meetings (recap yêu cầu transcription/recording)\n\n#### 🔎 Độ tin cậy: **Cao (H)**","kind":"drop","parts":[{"pre":"You are using Microsoft 365 Copilot during a Microsoft Teams meeting. After the meeting, you can only _____ if the meeting was transcribed.","choices":["schedule a follow-up meeting","create a summary of the meeting chat","identify content that was attached to the meeting","generate a recap of what was discussed during the meeting"],"ans":3}]},{"topic":3,"num":14,"question":"HOTSPOT - Select the answer that correctly completes the sentence.","options":[],"correct":[],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **a page**\n\n#### 💡 Giải thích (từ v1)\n\nCopilot Pages dùng để lưu, chỉnh sửa và cộng tác trên nội dung do Copilot tạo.\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Copilot Pages (save & edit)\n\n#### 🔎 Độ tin cậy: **Cao (H)**","kind":"drop","parts":[{"pre":"You generate a report by using the Researcher agent in Microsoft 365 Copilot. You can use _____ to save and edit the response.","choices":["an agent","a conversation","a notebook","a page"],"ans":3}]},{"topic":3,"num":15,"question":"HOTSPOT - For each of the following statements, select Yes if the statement is true. Otherwise, select No. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"multi":false,"explanation":"#### 🎯 Đáp án đúng: **Yes, No, No**\n\n#### 💡 Giải thích (từ v1)\n\nAgent Builder hỗ trợ tối đa 5 URL chat Teams làm nguồn kiến thức (1-Yes). Hội thoại Copilot (2-No) và file ảnh JPG (3-No) không phải nguồn kiến thức được hỗ trợ (chỉ tài liệu như PDF/DOCX/PPTX, SharePoint/OneDrive, website...).\n\n#### 📚 Nguồn tham khảo\n\nlearn.microsoft.com — Add knowledge sources to a declarative agent\n\n#### 🔎 Độ tin cậy: **Cao (H)**","kind":"yesno","statements":[{"text":"You can add a Microsoft Teams chat as a /* =================== Markdown-lite renderer for explanations =================== */
function mdLite(s){
  if(!s) return "";
  // extract images first and replace with placeholders to avoid HTML escaping issues
  const imgs = [];
  s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (m,alt,src)=>{
    imgs.push({alt:alt||'image',src:src});
    return `__IMG_${imgs.length-1}__`;
  });
  // escape
  s = s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  // restore images
  s = s.replace(/__IMG_(\d+)__/g, (m,i)=>{
    const img = imgs[+i];
    return `<img src="${img.src}" alt="${img.alt}" style="max-width:100%;height:auto;margin:8px 0;border-radius:4px;">`;
  });
  // headings ####
  s = s.replace(/^####\s+(.+)$/gm,'<h4>$1</h4>');
  // inline code
  s = s.replace(/`([^`]+)`/g,'<code>$1</code>');
  // bold
  s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  // build lists + paragraphs
  const lines = s.split("\n");
  let out=[], inList=false;
  for(let ln of lines){
    const li = ln.match(/^\s*[-*]\s+(.+)$/);
    if(li){ if(!inList){out.push("<ul>");inList=true;} out.push(`<li>${li[1]}</li>`); continue; }
    if(inList){out.push("</ul>");inList=false;}
    if(ln.startsWith("<h4>")){ out.push(ln); continue; }
    if(ln.trim()==="") continue;
    out.push(`<p>${ln}</p>`);
  }
  if(inList) out.push("</ul>");
  return out.join("");
}

/* =================== STUDY MODE =================== */
function filteredStudy(){
  const tp=document.getElementById("studyTopic").value;
  const ty=document.getElementById("studyType").value;
  const q =document.getElementById("studySearch").value.trim().toLowerCase();
  return QUESTIONS.filter(it=>{
    if(tp!=="all" && it.topic!=+tp) return false;
    if(ty==="single" && it.multi) return false;
    if(ty==="multi" && !it.multi) return false;
    if(q){
      const extra=it.kind==="yesno"?it.statements.map(s=>s.text).join(" ")
        :it.kind==="drop"?it.parts.map(p=>p.pre+" "+p.choices.join(" ")).join(" ")
        :it.options.map(o=>o.text).join(" ");
      const hay=(it.question.replace(/!\[[^\]]*\]\([^)]*\)/g," ")+" "+extra).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}
function renderStudy(){
  const list=filteredStudy();
  const box=document.getElementById("studyList");
  if(!list.length){ box.innerHTML=`<div class="empty">${t("empty")}</div>`; return; }
  box.innerHTML = list.map(q=>studyCard(q)).join("");
}
function studyCard(q){
  const id="s"+q.topic+"_"+q.num;
  const sel=studyAnswers[id]||[];
  const revealed=studyRevealed[id]||false;
  let multiBadge="";
  if(q.kind==="yesno") multiBadge=`<span class="chip multi">${t("kindYesNo")}</span>`;
  else if(q.kind==="drop") multiBadge=`<span class="chip multi">${t("kindDrop")}</span>`;
  else if(q.multi) multiBadge=`<span class="chip multi">${t("chooseN")(q.correct.length)}</span>`;
  let body;
  if(q.kind==="yesno") body=ynBody(q,sel,revealed,`studyYN('${id}'`);
  else if(q.kind==="drop") body=dropBody(q,sel,revealed,`studyDrop('${id}'`);
  else{
    const opts=q.options.map(o=>{
      let cls="opt";
      if(revealed){
        cls+=" disabled";
        if(q.correct.includes(o.key)) cls+=" correct";
        else if(sel.includes(o.key)) cls+=" wrong";
      }else if(sel.includes(o.key)){
        cls+=" sel";
      }
      return `<div class="${cls}" onclick="studyPick('${id}','${o.key}',${q.multi})"><span class="key">${o.key}</span><span class="otext">${escWithImages(o.text)}</span></div>`;
    }).join("");
    body=`<div class="opts">${opts}</div>`;
  }
  // verdict (only meaningful once revealed AND the learner picked something)
  let verdict="";
  const answered=q.kind?answeredAny(sel):sel.length>0;
  if(revealed && answered){
    const ok=q.kind?kindCorrect(q,sel):arrEq(sel,q.correct);
    verdict=ok?`<span class="verdict ok">${t("correctVerdict")}</span>`
              :`<span class="verdict no">${t("wrongVerdict")}</span>`;
  }
  const ansTxt=q.kind?kindAnswerText(q):q.correct.join(", ");
  return `<div class="qcard" data-card="${id}">
    <div class="qmeta">
      <span class="chip">${t("topic")} #${q.topic}</span>
      <span class="chip q">#${q.num}</span>${multiBadge}
    </div>
    <p class="qtext">${escWithImages(q.question)}</p>
    ${body}
    <div class="qactions">
      <button class="btn ghost" onclick="toggleExplain('${id}')" id="btn_${id}">${revealed?t("hideAnswer"):t("showAnswer")}</button>
      ${verdict}
      <span class="ans-line ${revealed?'':'hidden'}" id="ans_${id}">${t("correctAnswer")}: ${ansTxt}</span>
    </div>
    <div class="explain ${revealed?'show':''}" id="${id}">${mdLite(q.explanation)}</div>
  </div>`;
}
function studyPick(id,key,multi){
  if(studyRevealed[id]) return;          // locked once checked
  const q=QUESTIONS.find(x=>("s"+x.topic+"_"+x.num)===id);
  let cur=studyAnswers[id]||[];
  if(multi){
    if(cur.includes(key)) cur=cur.filter(k=>k!==key);
    else if(q&&q.correct.length&&cur.length>=q.correct.length) return; // limit "Choose N"
    else cur=[...cur,key];
  }
  else{ cur=[key]; }
  studyAnswers[id]=cur;
  rerenderStudyCard(id);
}
function rerenderStudyCard(id){
  const q=QUESTIONS.find(x=>("s"+x.topic+"_"+x.num)===id);
  if(!q) return;
  const card=document.querySelector(`[data-card="${id}"]`);
  if(card) card.outerHTML=studyCard(q);
}
function toggleExplain(id){
  studyRevealed[id]=!studyRevealed[id];   // reveal = check this question now
  rerenderStudyCard(id);
}
function toggleAllExplain(){
  studyExplainAll=!studyExplainAll;
  document.querySelectorAll("#studyList .qcard").forEach(c=>{
    const id=c.getAttribute("data-card");
    studyRevealed[id]=studyExplainAll;
  });
  renderStudy();
}


/* =================== Yes/No & Dropdown (hotspot) =================== */
function answeredAny(a){ return Array.isArray(a)&&a.some(v=>v!=null); }
function kindCorrect(q,g){
  if(!Array.isArray(g)) return false;
  if(q.kind==="yesno") return q.statements.every((s,i)=>g[i]===s.ans);
  if(q.kind==="drop") return q.parts.every((p,i)=>g[i]===p.ans);
  return false;
}
function kindAnswerText(q){
  if(q.kind==="yesno") return q.statements.map(s=>s.ans==="Y"?"Yes":"No").join(", ");
  if(q.kind==="drop") return q.parts.map(p=>p.choices[p.ans]).join(" · ");
  return "";
}
function kindGivenText(q,g){
  g=g||[];
  if(q.kind==="yesno") return q.statements.map((s,i)=>g[i]==="Y"?"Yes":g[i]==="N"?"No":"—").join(", ");
  if(q.kind==="drop") return q.parts.map((p,i)=>g[i]!=null?p.choices[g[i]]:"—").join(" · ");
  return "";
}
function ynBody(q,sel,revealed,pickFn){
  return `<div class="ynwrap">`+q.statements.map((s,i)=>{
    const v=sel?sel[i]:null;
    let yCls="ynbtn",nCls="ynbtn";
    if(revealed){
      if(s.ans==="Y") yCls+=" correct"; else nCls+=" correct";
      if(v==="Y"&&s.ans!=="Y") yCls+=" wrong";
      if(v==="N"&&s.ans!=="N") nCls+=" wrong";
    }else{
      if(v==="Y") yCls+=" sel";
      if(v==="N") nCls+=" sel";
    }
    return `<div class="ynrow${revealed?' disabled':''}">
      <span class="stext">${esc(s.text)}</span>
      <button class="${yCls}" onclick="${pickFn},${i},'Y')">Yes</button>
      <button class="${nCls}" onclick="${pickFn},${i},'N')">No</button>
    </div>`;
  }).join("")+`</div>`;
}
function dropBody(q,sel,revealed,pickFn){
  return `<div class="dropwrap">`+q.parts.map((p,i)=>{
    const v=(sel&&sel[i]!=null)?sel[i]:-1;
    let cls="";
    if(revealed) cls=v===p.ans?"correct":"wrong";
    const opts=`<option value="-1" ${v<0?"selected":""} disabled hidden>${t("pickOne")}</option>`+
      p.choices.map((c,ci)=>`<option value="${ci}" ${ci===v?"selected":""}>${esc(c)}</option>`).join("");
    const ansLine=revealed?`<div class="drop-ans">✓ ${esc(p.choices[p.ans])}</div>`:"";
    return `<div class="droppart"><div class="ptext">${esc(p.pre)}</div>
      <select ${revealed?"disabled":""} class="${cls}" onchange="${pickFn},${i},this.value)">${opts}</select>${ansLine}</div>`;
  }).join("")+`</div>`;
}
function studyYN(id,si,val){ if(studyRevealed[id])return; const cur=studyAnswers[id]||[]; cur[si]=val; studyAnswers[id]=cur; rerenderStudyCard(id); }
function studyDrop(id,pi,val){ if(studyRevealed[id])return; const cur=studyAnswers[id]||[]; cur[pi]=+val; studyAnswers[id]=cur; rerenderStudyCard(id); }
function examYNpick(qi,si,val){ const cur=exam.answers[qi]||[]; cur[si]=val; exam.answers[qi]=cur; renderExamCard(); }
function examDropPick(qi,pi,val){ const cur=exam.answers[qi]||[]; cur[pi]=+val; exam.answers[qi]=cur; renderExamCard(); }

/* =================== EXAM MODE ==================== */
let exam={list:[],answers:{},pos:0,started:0,duration:0,timerId:null};

function pool(){
  const tp=document.getElementById("cfgTopic").value;
  return tp==="all"?QUESTIONS:QUESTIONS.filter(q=>q.topic===+tp);
}
function updatePool(){
  const p=pool().length;
  document.getElementById("poolInfo").textContent=t("poolInfo")(p);
  const ci=document.getElementById("cfgCount");
  if(+ci.value>p) ci.value=p;
  ci.max=p;
}
document.addEventListener("change",e=>{ if(e.target.id==="cfgTopic") updatePool(); });

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function startExam(){
  const p=pool();
  let count=Math.max(1,Math.min(+document.getElementById("cfgCount").value||1,p.length));
  const shuf=document.getElementById("cfgShuffle").value==="yes";
  exam.list=shuffle(p).slice(0,count).map(q=>{
    const o=shuf?shuffle(q.options):q.options;
    return {...q,options:o};
  });
  exam.answers={}; exam.pos=0;
  exam.duration=(+document.getElementById("cfgTime").value||0)*60;
  exam.started=Date.now();
  document.getElementById("examSetup").classList.add("hidden");
  document.getElementById("examResult").classList.add("hidden");
  document.getElementById("examRun").classList.remove("hidden");
  document.getElementById("examLen").textContent=exam.list.length;
  startTimer();
  renderExamCard();
  buildPalette();
  window.scrollTo({top:0,behavior:"smooth"});
}
function buildPalette(){
  document.getElementById("examPalette").innerHTML=exam.list.map((q,i)=>
    `<button class="pdot" id="pdot${i}" onclick="examGo(${i})">${i+1}</button>`).join("");
  refreshPalette();
}
function refreshPalette(){
  exam.list.forEach((q,i)=>{
    const d=document.getElementById("pdot"+i); if(!d)return;
    d.classList.toggle("answered",answeredAny(exam.answers[i]));
    d.classList.toggle("current",i===exam.pos);
  });
}
function renderExamCard(){
  const q=exam.list[exam.pos]; if(!q)return;
  const sel=exam.answers[exam.pos]||[];
  let multiBadge;
  if(q.kind==="yesno") multiBadge=`<span class="chip multi">${t("kindYesNo")}</span>`;
  else if(q.kind==="drop") multiBadge=`<span class="chip multi">${t("kindDrop")}</span>`;
  else multiBadge=q.multi?`<span class="chip multi">${t("chooseN")(q.correct.length)}</span>`:`<span class="chip">${t("chooseOne")}</span>`;
  let body;
  if(q.kind==="yesno") body=ynBody(q,sel,false,`examYNpick(${exam.pos}`);
  else if(q.kind==="drop") body=dropBody(q,sel,false,`examDropPick(${exam.pos}`);
  else{
    const opts=q.options.map(o=>{
      const on=sel.includes(o.key)?"opt sel":"opt";
      return `<div class="${on}" onclick="pick(${exam.pos},'${o.key}',${q.multi})"><span class="key">${o.key}</span><span class="otext">${escWithImages(o.text)}</span></div>`;
    }).join("");
    body=`<div class="opts">${opts}</div>`;
  }
  document.getElementById("examCard").innerHTML=`<div class="qcard">
    <div class="qmeta"><span class="chip q">#${exam.pos+1}</span><span class="chip">${t("topic")} #${q.topic}</span>${multiBadge}</div>
    <p class="qtext">${escWithImages(q.question)}</p>
    ${body}
  </div>`;
  document.getElementById("examPos").textContent=exam.pos+1;
  document.getElementById("examBar").style.width=((exam.pos+1)/exam.list.length*100)+"%";
  refreshPalette();
}
function pick(qi,key,multi){
  const q=exam.list[qi];
  let cur=exam.answers[qi]||[];
  if(multi){
    if(cur.includes(key)) cur=cur.filter(k=>k!==key);
    else if(q&&q.correct.length&&cur.length>=q.correct.length) return; // limit "Choose N"
    else cur=[...cur,key];
  }
  else{ cur=[key]; }
  exam.answers[qi]=cur;
  renderExamCard();
}
function examGo(i){ exam.pos=Math.max(0,Math.min(i,exam.list.length-1)); renderExamCard(); window.scrollTo({top:0,behavior:"smooth"}); }
function examPrev(){ examGo(exam.pos-1); }
function examNext(){ examGo(exam.pos+1); }

/* ---- Timer ---- */
function startTimer(){
  stopTimer();
  if(!exam.duration){ document.getElementById("examTimer").textContent="∞"; return; }
  const tick=()=>{
    const left=exam.duration-Math.floor((Date.now()-exam.started)/1000);
    if(left<=0){ document.getElementById("examTimer").textContent="00:00"; stopTimer(); alert(t("timeUp")); gradeExam(); return; }
    const m=String(Math.floor(left/60)).padStart(2,"0"),s=String(left%60).padStart(2,"0");
    document.getElementById("examTimer").textContent=`${m}:${s}`;
  };
  tick(); exam.timerId=setInterval(tick,1000);
}
function stopTimer(){ if(exam.timerId){clearInterval(exam.timerId);exam.timerId=null;} }

function submitExam(){ if(confirm(t("confirmSubmit"))) gradeExam(); }

function arrEq(a,b){ a=[...a].sort();b=[...b].sort(); return a.length===b.length&&a.every((x,i)=>x===b[i]); }

let lastResult=null;
function gradeExam(){
  stopTimer();
  let correct=0;
  const detail=exam.list.map((q,i)=>{
    const given=exam.answers[i]||[];
    const ok=q.kind?kindCorrect(q,given):arrEq(given,q.correct);
    if(ok)correct++;
    return {q,given,ok};
  });
  const total=exam.list.length;
  const pct=Math.round(correct/total*100);
  const used=Math.floor((Date.now()-exam.started)/1000);
  lastResult={detail,correct,total,pct,used};
  // render result
  document.getElementById("examRun").classList.add("hidden");
  document.getElementById("examResult").classList.remove("hidden");
  document.getElementById("scorePct").textContent=pct+"%";
  document.getElementById("statCorrect").textContent=correct;
  document.getElementById("statWrong").textContent=total-correct;
  const m=Math.floor(used/60),s=used%60;
  document.getElementById("statTime").textContent=`${m}:${String(s).padStart(2,"0")}`;
  const pass=pct/100>=PASS;
  document.getElementById("verdictBig").textContent=pass?t("passed"):t("failed");
  // ring
  const ring=document.getElementById("ringFill");
  ring.style.stroke=pass?"var(--green)":"var(--amber)";
  const circ=2*Math.PI*66;
  ring.style.strokeDasharray=circ;
  ring.style.strokeDashoffset=circ*(1-pct/100);
  document.getElementById("reviewList").innerHTML="";
  window.scrollTo({top:0,behavior:"smooth"});
}
function reviewExam(){
  if(!lastResult)return;
  const box=document.getElementById("reviewList");
  if(box.innerHTML){box.innerHTML="";return;}
  box.innerHTML=lastResult.detail.map((d,i)=>{
    const q=d.q;
    let body;
    if(q.kind==="yesno") body=ynBody(q,d.given,true,"void(0");
    else if(q.kind==="drop") body=dropBody(q,d.given,true,"void(0");
    else{
      const opts=q.options.map(o=>{
        let cls="opt disabled";
        const isCorrect=q.correct.includes(o.key);
        const isGiven=d.given.includes(o.key);
        if(isCorrect) cls="opt correct disabled";
        else if(isGiven) cls="opt wrong disabled";
        return `<div class="${cls}"><span class="key">${o.key}</span><span class="otext">${escWithImages(o.text)}</span></div>`;
      }).join("");
      body=`<div class="opts">${opts}</div>`;
    }
    const v=d.ok?`<span class="verdict ok">${t("correctVerdict")}</span>`:`<span class="verdict no">${t("wrongVerdict")}</span>`;
    const yourTxt=q.kind?(answeredAny(d.given)?kindGivenText(q,d.given):t("notAnswered")):(d.given.length?d.given.join(", "):t("notAnswered"));
    const ansTxt=q.kind?kindAnswerText(q):q.correct.join(", ");
    return `<div class="qcard">
      <div class="qmeta"><span class="chip q">#${i+1}</span><span class="chip">${t("topic")} #${q.topic}</span>${v}</div>
      <p class="qtext">${escWithImages(q.question)}</p>
      ${body}
      <div class="qactions">
        <span class="chip">${t("yourAnswer")}: ${yourTxt}</span>
        <span class="ans-line">${t("correctAnswer")}: ${ansTxt}</span>
      </div>
      <div class="explain show">${mdLite(q.explanation)}</div>
    </div>`;
  }).join("");
}

function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function escWithImages(s){
  if(!s) return "";
  // extract images first
  const imgs = [];
  s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (m,alt,src)=>{
    imgs.push({alt:alt||'image',src:src});
    return `__IMG_${imgs.length-1}__`;
  });
  // escape HTML
  s = esc(s);
  // restore images
  s = s.replace(/__IMG_(\d+)__/g, (m,i)=>{
    const img = imgs[+i];
    return `<img src="${img.src}" alt="${img.alt}" style="max-width:100%;height:auto;margin:8px 0;border-radius:4px;">`;
  });
  return s;
}

init();
</script>
