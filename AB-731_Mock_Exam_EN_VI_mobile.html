<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AB-731 Mock Exam — EN/VI · FJP GHC vô địch</title>
<style>
:root{
  --bg:#0d1117; --bg2:#161b22; --bg3:#21262d; --border:#30363d; --border2:#3d444d;
  --txt:#e6edf3; --txt2:#9da7b3; --muted:#7d8590;
  --accent:#2f81f7; --accent2:#1f6feb;
  --green:#2ea043; --greenbg:#0f2f1a; --red:#f85149; --redbg:#3a1417;
  --yellow:#d29922; --vi:#58a6ff; --vibg:#0d2137; --vibd:#1f4d7a;
  --chip:#21262d; --shadow:rgba(1,4,9,.6);
  --H:#2ea043; --M:#d29922; --L:#f85149;
}
[data-theme="light"]{
  --bg:#ffffff; --bg2:#f6f8fa; --bg3:#eaeef2; --border:#d0d7de; --border2:#afb8c1;
  --txt:#1f2328; --txt2:#57606a; --muted:#6e7781;
  --accent:#0969da; --accent2:#0860ca;
  --green:#1a7f37; --greenbg:#dafbe1; --red:#cf222e; --redbg:#ffebe9;
  --yellow:#9a6700; --vi:#0969da; --vibg:#ddf4ff; --vibd:#54aeff;
  --chip:#eaeef2; --shadow:rgba(140,149,159,.2);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.55;font-size:15px}
body.lang-en .vi{display:none !important}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:960px;margin:0 auto;padding:0 16px 80px}
/* Header */
header{position:sticky;top:0;z-index:50;background:var(--bg2);border-bottom:1px solid var(--border);box-shadow:0 1px 0 var(--shadow)}
.head-in{max-width:960px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand-title{font-size:18px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.badge-brand{background:linear-gradient(135deg,#f78166,#f85149,#a371f7);color:#fff;font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;letter-spacing:.3px;white-space:nowrap;box-shadow:0 2px 6px var(--shadow)}
.head-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
button,select,input{font-family:inherit;font-size:14px}
.btn{background:var(--bg3);color:var(--txt);border:1px solid var(--border2);border-radius:7px;padding:7px 12px;cursor:pointer;transition:.12s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.btn.primary:hover{background:var(--accent2);color:#fff}
.btn.ghost{background:transparent}
.seg{display:inline-flex;border:1px solid var(--border2);border-radius:7px;overflow:hidden}
.seg button{border:0;border-radius:0;background:var(--bg3);padding:7px 14px}
.seg button.active{background:var(--accent);color:#fff}
/* Toolbar / filters */
.panel{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:16px 0}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.field select,.field input{background:var(--bg);color:var(--txt);border:1px solid var(--border2);border-radius:7px;padding:7px 10px;min-width:120px}
.field input.search{min-width:220px}
.count-note{color:var(--muted);font-size:13px;margin:6px 2px}
/* Question card */
.qcard{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:18px;margin:14px 0;scroll-margin-top:70px}
.qtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.qnum{font-weight:700;color:var(--txt)}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:12px;border:1px solid var(--border2);color:var(--txt2)}
.tag.kind{background:var(--bg3)}
.tag.conf-H{background:var(--greenbg);color:var(--H);border-color:var(--H)}
.tag.conf-M{background:#3a2c07;color:var(--M);border-color:var(--M)}
.tag.conf-L{background:var(--redbg);color:var(--L);border-color:var(--L)}
[data-theme="light"] .tag.conf-M{background:#fff8c5}
.tag.multi{background:var(--vibg);color:var(--vi);border-color:var(--vibd)}
.stem{white-space:pre-wrap;margin:2px 0 6px}
.vi{background:var(--vibg);border-left:3px solid var(--vibd);color:var(--vi);padding:6px 10px;border-radius:0 6px 6px 0;margin:6px 0;font-size:14px;white-space:pre-wrap}
/* MCQ */
.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.opt{border:1px solid var(--border2);border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;transition:.1s;background:var(--bg)}
.opt:hover{border-color:var(--accent)}
.opt .mk{flex:0 0 22px;height:22px;border:2px solid var(--border2);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-top:1px}
.opt.multi .mk{border-radius:5px}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.opt.sel .mk{background:var(--accent);border-color:var(--accent);color:#fff}
.opt .ktxt{font-weight:700;margin-right:2px}
.opt.correct{border-color:var(--green);background:var(--greenbg)}
.opt.correct .mk{background:var(--green);border-color:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--redbg)}
.opt.wrong .mk{background:var(--red);border-color:var(--red);color:#fff}
.opt .obody{flex:1}
.opt.disabled{cursor:default;opacity:.95}
/* Yes/No */
.yn-row{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--border)}
.yn-row:first-child{border-top:0}
.yn-txt{flex:1}
.yn-btns{display:flex;gap:6px;flex:0 0 auto}
.yn-btns button{min-width:52px;padding:6px 10px;border:1px solid var(--border2);background:var(--bg);border-radius:7px;cursor:pointer;color:var(--txt)}
.yn-btns button.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.yn-row.ok .yn-txt{color:var(--green)}
.yn-row.bad .yn-txt{color:var(--red)}
.yn-btns button.ansmark{outline:2px solid var(--green);outline-offset:1px}
.yn-btns button.sel.wrongsel{background:var(--red);border-color:var(--red)}
/* Dropdown */
.drop-part{margin:12px 0}
.drop-line{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.drop-line select{background:var(--bg);color:var(--txt);border:1px solid var(--border2);border-radius:7px;padding:7px 8px;max-width:100%}
.drop-line select.ok{border-color:var(--green);background:var(--greenbg)}
.drop-line select.bad{border-color:var(--red);background:var(--redbg)}
.drop-correct{font-size:13px;color:var(--green);margin-top:4px}
/* Drag drop */
.drag-wrap{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px}
.pool{flex:1;min-width:200px}
.pool-title,.tgt-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px}
.chips{display:flex;flex-direction:column;gap:8px}
.chip{border:1px solid var(--border2);background:var(--chip);border-radius:8px;padding:9px 11px;cursor:grab;user-select:none;transition:.1s}
.chip:hover{border-color:var(--accent)}
.chip.selected{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 15%,transparent);box-shadow:0 0 0 2px var(--accent) inset}
.chip.used{opacity:.45}
.targets{flex:2;min-width:260px;display:flex;flex-direction:column;gap:10px}
.target{display:flex;gap:10px;align-items:stretch}
.drop-slot{flex:0 0 190px;min-height:44px;border:2px dashed var(--border2);border-radius:8px;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;cursor:pointer;color:var(--muted);font-size:13px}
.drop-slot.filled{border-style:solid;color:var(--txt);background:var(--bg3)}
.drop-slot.dragover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.drop-slot.ok{border-color:var(--green);background:var(--greenbg);color:var(--txt)}
.drop-slot.bad{border-color:var(--red);background:var(--redbg);color:var(--txt)}
.tgt-label{flex:1;display:flex;align-items:center}
.tgt-correct{font-size:12px;color:var(--green);margin-top:3px}
/* Reveal */
.qactions{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.reveal{margin-top:14px;border-top:1px dashed var(--border2);padding-top:12px;display:none}
.reveal.show{display:block}
.verdict{font-weight:700;margin-bottom:6px}
.verdict.correct{color:var(--green)}
.verdict.incorrect{color:var(--red)}
.exp{background:var(--bg3);border-radius:8px;padding:10px 12px;margin:8px 0}
.exp-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.meta{font-size:13px;color:var(--txt2);display:flex;flex-direction:column;gap:3px;margin-top:6px}
.meta b{color:var(--txt)}
/* Exam */
.exam-bar{position:sticky;top:52px;z-index:40;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin:14px 0;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.timer{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;padding:2px 10px;border-radius:7px;background:var(--bg3)}
.timer.warn{color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.5}}
.progress{flex:1;min-width:120px;height:8px;background:var(--bg3);border-radius:6px;overflow:hidden}
.progress > div{height:100%;background:var(--accent);width:0;transition:width .3s}
.palette{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.palette button{width:34px;height:34px;border-radius:7px;border:1px solid var(--border2);background:var(--bg);color:var(--txt);cursor:pointer;font-size:12px;font-weight:600}
.palette button.answered{background:var(--accent);color:#fff;border-color:var(--accent)}
.palette button.correct{background:var(--green);color:#fff;border-color:var(--green)}
.palette button.incorrect{background:var(--red);color:#fff;border-color:var(--red)}
.scorebox{text-align:center;padding:26px 16px}
.score-num{font-size:52px;font-weight:800;line-height:1}
.score-pass{color:var(--green)}.score-fail{color:var(--red)}
.score-sub{color:var(--txt2);margin-top:8px}
.hidden{display:none !important}
footer{border-top:1px solid var(--border);background:var(--bg2);padding:20px 16px;text-align:center;color:var(--muted);font-size:13px;margin-top:40px}
footer .copy{font-weight:700;color:var(--txt)}
.intro{color:var(--txt2);font-size:14px}
.kbd{font-size:12px;background:var(--bg3);border:1px solid var(--border2);border-radius:5px;padding:1px 6px}
/* ===== Mobile ===== */
@media(hover:none){
  .opt:hover,.chip:hover{border-color:var(--border2)}
  .btn:hover{border-color:var(--border2);color:var(--txt)}
  .btn.primary:hover{background:var(--accent);color:#fff}
  button,.opt,.chip{-webkit-tap-highlight-color:transparent}
}
@media(max-width:768px){
  .wrap{padding:0 10px 90px}
  /* Header: compact, single purpose rows */
  .head-in{padding:8px 10px;gap:8px}
  .brand-title{font-size:15px;gap:8px}
  .badge-brand{font-size:10px;padding:2px 7px}
  .head-actions{width:100%;margin-left:0;gap:6px}
  .head-actions .seg{flex:1;display:flex}
  .head-actions .seg button{flex:1;padding:8px 6px;font-size:13px}
  .btn{padding:8px 10px;min-height:40px}
  /* Filters stack full-width */
  .panel{padding:12px;margin:12px 0;border-radius:9px}
  .filters{gap:10px}
  .field{flex:1 1 calc(50% - 10px);min-width:calc(50% - 10px)}
  .field select,.field input{min-width:0;width:100%;font-size:16px;padding:9px 10px}
  .field input.search{min-width:0}
  .field:has(.btn),.field:has(#startExamBtn){flex:1 1 100%}
  .field .btn{width:100%}
  #eCount,#eTime{width:100% !important}
  /* Question cards */
  .qcard{padding:14px 12px;margin:12px 0;border-radius:9px;scroll-margin-top:12px}
  .stem{font-size:15px}
  .vi{font-size:13.5px;padding:6px 8px}
  /* MCQ options: bigger tap targets */
  .opt{padding:12px 10px;gap:8px}
  .opt .mk{flex-basis:24px;height:24px}
  /* Yes/No stacks */
  .yn-row{flex-direction:column;gap:8px}
  .yn-btns{width:100%}
  .yn-btns button{flex:1;min-height:42px}
  /* Dropdown lines */
  .drop-line select{width:100%;font-size:16px}
  /* Drag & drop stacks */
  .drag-wrap{flex-direction:column;gap:12px}
  .pool,.targets{min-width:0}
  .chip{padding:12px 11px}
  .target{flex-direction:column;gap:6px}
  .drop-slot{flex:none;width:100%;min-height:48px}
  .tgt-label{align-items:flex-start}
  /* Exam: header scrolls away, exam bar sticks at top */
  header{position:static}
  .exam-bar{top:0;border-radius:0;margin:12px -10px;padding:8px 10px;gap:8px;padding-top:calc(8px + env(safe-area-inset-top))}
  .timer{font-size:17px;padding:2px 8px}
  .progress{min-width:60px}
  #progText{font-size:12px}
  #submitBtn,#quitBtn{padding:8px;min-height:36px;font-size:13px}
  .palette button{width:38px;height:38px}
  .score-num{font-size:44px}
  .qactions{position:sticky;bottom:0;background:var(--bg2);margin:14px -12px -14px;padding:10px 12px;border-top:1px solid var(--border);border-radius:0 0 9px 9px}
  .qactions .btn{flex:1}
  footer{padding:16px 10px calc(16px + env(safe-area-inset-bottom));margin-top:24px}
}
@media(max-width:380px){
  .brand-title{font-size:14px}
  .palette button{width:34px;height:34px}
  .field{flex:1 1 100%;min-width:100%}
}
</style>
</head>
<body data-theme="dark" class="lang-both">
<header>
  <div class="head-in">
    <div class="brand-title">
      <a href="./index.html">Back to List</a>
      <span>AB-731 · Mock Exam</span>
      <!-- Static branding badge (header) — always present even if JS fails -->
      <span class="badge-brand">FJP GHC vô địch</span>
    </div>
    <div class="head-actions">
      <div class="seg" id="modeSeg">
        <button data-mode="study" class="active">📚 Học tập</button>

      <button class="btn ghost" id="themeBtn" title="Giao diện">🌙</button>

</header>

<div class="wrap">

          <select id="fTopic"><option value="">Tất cả</option><option value="1">Topic 1 (31)</option><option value="2">Topic 2 (38)</option><option value="3">Topic 3 (31)</option></select>
        </div>
        <div class="field"><label>Loại câu / Type</label>
          <select id="fKind"><option value="">Tất cả</option><option value="mcq">Trắc nghiệm (MCQ)</option><option value="yesno">Yes/No</option><option value="drop">Dropdown</option><option value="drag">Drag &amp; Drop</option></select>
        </div>
        <div class="field"><label>Độ tin cậy / Conf.</label>
          <select id="fConf"><option value="">Tất cả</option><option value="H">H — Cao</option><option value="M">M — Trung bình</option><option value="L">L — Thấp</option></select>

  <!-- EXAM SETUP -->
  <section id="examSetup" class="hidden">

      <div class="filters">
        <div class="field"><label>Phạm vi / Scope</label>
          <select id="eScope"><option value="">Toàn bộ (100 câu)</option><option value="1">Chỉ Topic 1</option><option value="2">Chỉ Topic 2</option><option value="3">Chỉ Topic 3</option></select>
        </div>
        <div class="field"><label>Số câu</label>
          <input id="eCount" type="number" min="1" max="100" value="40" style="width:100px">
        </div>
        <div class="field"><label>Thời gian (phút)</label>
          <input id="eTime" type="number" min="1" max="240" value="45" style="width:100px">
        </div>
        <div class="field"><label>&nbsp;</label>
          <button class="btn primary" id="startExamBtn">Bắt đầu thi ▶</button>
        </div>
      </div>
    </div>
  </section>

  <!-- EXAM RUN -->
  <section id="examRun" class="hidden">
    <div class="exam-bar">
      <span class="timer" id="timer">00:00</span>
      <div class="progress"><div id="progFill"></div></div>
      <span id="progText" class="count-note" style="margin:0"></span>
      <button class="btn primary" id="submitBtn">Nộp bài</button>
      <button class="btn ghost" id="quitBtn">Thoát</button>

    <div id="examList"></div>
    <div style="text-align:center;margin:20px 0">
      <button class="btn primary" id="submitBtn2">Nộp bài &amp; chấm điểm</button>

  <!-- EXAM RESULT -->
  <section id="examResult" class="hidden">
    <div class="panel scorebox" id="scoreBox"></div>
    <div class="palette" id="palette2"></div>
    <div id="reviewList"></div>
    <div style="text-align:center;margin:24px 0">
      <button class="btn primary" id="retryBtn">Làm bài mới</button>
    </div>
  </section>
</div>

<footer>
  <div>Bộ đề luyện thi Microsoft <b>AB-731</b> · Song ngữ EN/VI · 100 câu hỏi · Chạy offline</div>
  <!-- Static branding (footer) — always present even if JS fails -->
  <div style="margin-top:6px"><span class="copy">© FJP GHC vô địch</span></div>
</footer>

<script>
"use strict";
const DATA = [{"id":"1-1","t":1,"n":1,"kind":"mcq","multi":1,"stem":"Your company plans to build a generative AI solution based on internal data.\nYou recommend using Microsoft Foundry as a starting point to develop and manage the solution.\nWhat is a key benefit of using Microsoft Foundry for this project?","opts":[{"k":"A","en":"Provides a scalable platform for developing and deploying generative AI solutions."},{"k":"B","en":"Removes the need to select or configure the underlying AI model."},{"k":"C","en":"Enables business users to build generative AI solutions."},{"k":"D","en":"Offers a low-code platform for developing generative AI solutions."}],"answer":["A"],"suggested":"A","vote":"A","votepct":"11/11 votes, 100%","vi":"Công ty của bạn dự định xây dựng một giải pháp AI tạo sinh (generative AI) dựa trên dữ liệu nội bộ. Bạn đề xuất sử dụng Microsoft Foundry làm điểm khởi đầu để phát triển và quản lý giải pháp. Đâu là lợi ích chính khi sử dụng Microsoft Foundry cho dự án này?","opts_vi":["Cung cấp nền tảng có khả năng mở rộng để phát triển và triển khai các giải pháp generative AI.","Loại bỏ nhu cầu lựa chọn hoặc cấu hình mô hình AI nền tảng.","Cho phép người dùng nghiệp vụ xây dựng các giải pháp generative AI.","Cung cấp nền tảng low-code để phát triển các giải pháp generative AI."],"exp":"Microsoft Foundry là nền tảng cấp doanh nghiệp giúp phát triển, tùy chỉnh, đánh giá và triển khai giải pháp generative AI ở quy mô lớn, nên A đúng. B sai vì Foundry vẫn yêu cầu bạn chọn và cấu hình mô hình nền tảng. C và D sai vì Foundry hướng đến nhà phát triển và chuyên gia dữ liệu chứ không phải nền tảng low-code dành cho người dùng nghiệp vụ (đó là Copilot Studio).","cite":"https://learn.microsoft.com/en-us/azure/ai-foundry/what-is-azure-ai-foundry","conf":"H"},{"id":"1-2","t":1,"n":2,"kind":"yesno","stem":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.","statements":[{"text":"Microsoft Foundry helps organizations securely build and manage generative AI solutions in a governed environment.","ans":"Y"},{"text":"Microsoft Foundry provides built-in scalability to enable organizations to expand AI workloads as usage increases.","ans":"Y"},{"text":"Microsoft Foundry can be used for image recognition and computer vision tasks.","ans":"Y"}],"suggested":"Yes, Yes, Yes (Community comment - 2 upvotes)","vote":"Not available","votepct":"","vi":"Với mỗi phát biểu sau, chọn Yes nếu phát biểu đúng, ngược lại chọn No. LƯU Ý: Mỗi lựa chọn đúng được một điểm.","statements_vi":["Microsoft Foundry giúp các tổ chức xây dựng và quản lý an toàn các giải pháp generative AI trong môi trường được quản trị.","Microsoft Foundry cung cấp khả năng mở rộng tích hợp sẵn để tổ chức có thể mở rộng khối lượng công việc AI khi nhu cầu sử dụng tăng lên.","Microsoft Foundry có thể được dùng cho các tác vụ nhận dạng hình ảnh và computer vision."],"exp":"Cả ba đều Yes. Foundry cung cấp môi trường được quản trị, an toàn để xây dựng giải pháp generative AI (câu 1) và có khả năng mở rộng theo nhu cầu (câu 2). Foundry tích hợp các dịch vụ Azure AI, bao gồm Azure Vision, nên cũng hỗ trợ nhận dạng hình ảnh và computer vision (câu 3).","cite":"https://learn.microsoft.com/en-us/azure/ai-foundry/what-is-azure-ai-foundry","conf":"H"},{"id":"1-3","t":1,"n":3,"kind":"drop","stem":"Select the answer that correctly completes the sentence.","parts":[{"pre":"You use","post":"to train a model that will forecast product demand based on historical sales data.","choices":["Azure Machine Learning","Azure AI Search","Azure OpenAI","Microsoft Foundry"],"ans":0}],"suggested":"Azure Machine Learning (Community comment - 2 upvotes)","vote":"Not available","votepct":"","vi":"Chọn đáp án hoàn thành đúng câu.","parts_vi":[{"pre_vi":"Bạn sử dụng","post_vi":"để huấn luyện một mô hình dự báo nhu cầu sản phẩm dựa trên dữ liệu bán hàng lịch sử.","choices_vi":["Azure Machine Learning","Azure AI Search","Azure OpenAI","Microsoft Foundry"]}],"exp":"Azure Machine Learning là dịch vụ phù hợp để huấn luyện mô hình dự đoán/dự báo (predictive) tùy chỉnh dựa trên dữ liệu lịch sử. Azure AI Search dùng để lập chỉ mục và tìm kiếm, Azure OpenAI cung cấp mô hình generative, còn Microsoft Foundry là nền tảng tổng thể chứ không phải công cụ huấn luyện mô hình dự báo chuyên biệt.","cite":"https://learn.microsoft.com/en-us/azure/machine-learning/overview-what-is-azure-machine-learning","conf":"H"},{"id":"1-4","t":1,"n":4,"kind":"mcq","multi":1,"stem":"Which business requirement most closely relates to grounding a generative AI model?","opts":[{"k":"A","en":"supporting multiple languages"},{"k":"B","en":"measuring the number of user interactions per day"},{"k":"C","en":"enabling users to interact by using natural language queries"},{"k":"D","en":"ensuring that verified company data sources are used for response generation"}],"answer":["D"],"suggested":"D","vote":"D","votepct":"6/6 votes, 100%","vi":"Yêu cầu nghiệp vụ nào liên quan chặt chẽ nhất đến việc grounding (neo dữ liệu) cho một mô hình generative AI?","opts_vi":["hỗ trợ nhiều ngôn ngữ","đo lường số lượng tương tác của người dùng mỗi ngày","cho phép người dùng tương tác bằng các truy vấn ngôn ngữ tự nhiên","đảm bảo rằng các nguồn dữ liệu đã được xác minh của công ty được sử dụng để tạo phản hồi"],"exp":"Grounding nghĩa là neo phản hồi của mô hình vào các nguồn dữ liệu cụ thể, đáng tin cậy, nên D đúng. A, B và C mô tả các tính năng khác (đa ngôn ngữ, đo lường, giao diện ngôn ngữ tự nhiên) và không liên quan đến việc dựa vào nguồn dữ liệu đã xác minh.","cite":"https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/retrieval-augmented-generation","conf":"H"},{"id":"1-5","t":1,"n":5,"kind":"mcq","multi":1,"stem":"You need to create a custom Azure Machine Learning model. The data used to train the model is consistent and uniform.\nWhat should you do first?","opts":[{"k":"A","en":"Prepare the training data."},{"k":"B","en":"Evaluate the model."},{"k":"C","en":"Train the model."},{"k":"D","en":"Tune hyperparameters."},{"k":"E","en":"Deploy the model."}],"answer":["A"],"suggested":"A","vote":"A","votepct":"8/8 votes, 100%","vi":"Bạn cần tạo một mô hình Azure Machine Learning tùy chỉnh. Dữ liệu dùng để huấn luyện mô hình là nhất quán và đồng đều. Bạn nên làm gì đầu tiên?","opts_vi":["Chuẩn bị dữ liệu huấn luyện.","Đánh giá mô hình.","Huấn luyện mô hình.","Điều chỉnh siêu tham số (hyperparameters).","Triển khai mô hình."],"exp":"Trong quy trình machine learning, bước đầu tiên luôn là chuẩn bị dữ liệu huấn luyện, nên A đúng. Việc huấn luyện, điều chỉnh siêu tham số, đánh giá và triển khai chỉ diễn ra sau khi dữ liệu đã sẵn sàng, do đó các lựa chọn còn lại không phải là bước đầu tiên.","cite":"https://learn.microsoft.com/en-us/azure/machine-learning/overview-what-is-azure-machine-learning","conf":"H"},{"id":"1-6","t":1,"n":6,"kind":"mcq","multi":1,"stem":"Your company uses a non-reasoning generative AI model to create textual content.\nYou discover that the model's responses are inconsistent and do NOT meet expectations.\nYou need to improve the prompts.\nWhat should you do? More than one answer choice may achieve the goal. Select the BEST answer.","opts":[{"k":"A","en":"Provide the prompts with extensive examples of the expected output."},{"k":"B","en":"Add the context, sources, and expectations to the prompts."},{"k":"C","en":"Use technical terms in the prompts to enhance AI comprehension."},{"k":"D","en":"Add only a single concise requirement to the prompts."}],"answer":["B"],"suggested":"B","vote":"B","votepct":"5/5 votes, 100%","vi":"Công ty của bạn dùng một mô hình generative AI không suy luận (non-reasoning) để tạo nội dung văn bản. Bạn phát hiện phản hồi của mô hình thiếu nhất quán và KHÔNG đáp ứng kỳ vọng. Bạn cần cải thiện các prompt. Bạn nên làm gì? Nhiều đáp án có thể đạt mục tiêu. Chọn đáp án TỐT NHẤT.","opts_vi":["Cung cấp cho prompt nhiều ví dụ mở rộng về kết quả mong đợi.","Thêm ngữ cảnh, nguồn tham chiếu và kỳ vọng vào prompt.","Dùng thuật ngữ kỹ thuật trong prompt để tăng khả năng hiểu của AI.","Chỉ thêm một yêu cầu ngắn gọn duy nhất vào prompt."],"exp":"Cách tốt nhất để cải thiện chất lượng phản hồi là bổ sung ngữ cảnh, nguồn và kỳ vọng rõ ràng vào prompt (prompt engineering), nên B đúng. A (chỉ đưa ví dụ) có ích nhưng không toàn diện bằng; C dùng thuật ngữ kỹ thuật không đảm bảo tính nhất quán; D quá đơn giản, thiếu ngữ cảnh nên không giải quyết được vấn đề.","cite":"https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/prompt-engineering","conf":"H"},{"id":"1-7","t":1,"n":7,"kind":"yesno","stem":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.","statements":[{"text":"A generative AI model guarantees factually accurate responses if the model is trained on a large dataset.","ans":"N"},{"text":"Content filtering and responsible AI safeguards help a generative AI model generate safe and inoffensive content.","ans":"Y"},{"text":"A generative AI model always produces fair and unbiased results when the training data has been properly prepared and reviewed for fairness.","ans":"N"}],"suggested":"No, Yes, No (Community comment - 2 upvotes)","vote":"Not available","votepct":"","vi":"Với mỗi phát biểu sau, chọn Yes nếu phát biểu đúng, ngược lại chọn No. LƯU Ý: Mỗi lựa chọn đúng được một điểm.","statements_vi":["Một mô hình generative AI đảm bảo phản hồi chính xác về mặt sự thật nếu mô hình được huấn luyện trên tập dữ liệu lớn.","Lọc nội dung (content filtering) và các biện pháp bảo vệ AI có trách nhiệm giúp mô hình generative AI tạo ra nội dung an toàn và không gây phản cảm.","Một mô hình generative AI luôn tạo ra kết quả công bằng và không thiên lệch khi dữ liệu huấn luyện đã được chuẩn bị và rà soát về tính công bằng."],"exp":"No, Yes, No. Câu 1 sai vì tập dữ liệu lớn không đảm bảo tính chính xác, mô hình vẫn có thể tạo thông tin sai (hallucination). Câu 2 đúng vì content filtering và các biện pháp responsible AI giúp nội dung an toàn hơn. Câu 3 sai vì ngay cả khi dữ liệu được rà soát kỹ, mô hình vẫn không thể luôn đảm bảo hoàn toàn công bằng và không thiên lệch.","cite":"https://learn.microsoft.com/en-us/azure/ai-foundry/responsible-ai/openai/overview","conf":"H"},{"id":"1-8","t":1,"n":8,"kind":"drop","stem":"Select the answer that correctly completes the sentence.","parts":[{"pre":"A","post":"AI solution recognizes patterns in large and complex datasets to create new and original content.","choices":["prescriptive","predictive","generative"],"ans":2}],"suggested":"generative (Community comment - 4 upvotes)","vote":"Not available","votepct":"","vi":"Chọn đáp án hoàn thành đúng câu.","parts_vi":[{"pre_vi":"Một giải pháp AI","post_vi":"nhận diện các mẫu (pattern) trong các tập dữ liệu lớn và phức tạp để tạo ra nội dung mới và độc đáo.","choices_vi":["quy chuẩn (prescriptive)","dự đoán (predictive)","tạo sinh (generative)"]}],"exp":"Generative AI là loại AI nhận diện các mẫu trong dữ liệu để tạo ra nội dung mới và độc đáo, nên đáp án là generative. Predictive AI dùng để dự đoán kết quả dựa trên dữ liệu lịch sử, còn prescriptive AI đưa ra khuyến nghị hành động, cả hai đều không tạo nội dung mới.","cite":"https://learn.microsoft.com/en-us/azure/ai-foundry/openai/overview","conf":"H"},{"id":"1-9","t":1,"n":9,"kind":"mcq","multi":1,"stem":"Your company plans to use generative AI to help project managers and engineers work with construction blueprints stored as PDF files.\nYou need to recommend a generative AI solution that meets the following business requirements:\nProcesses both images and text\nSummarizes the design of a building\nAnswers user questions about a building's design\nExtracts information from blueprints, such as the location of electrical, heating, and plumbing systems\nWhat should you recommend?","opts":[{"k":"A","en":"a multi-modal solution"},{"k":"B","en":"an optical character recognition (OCR) solution"},{"k":"C","en":"a text completion solution"},{"k":"D","en":"a document summarization solution"}],"answer":["A"],"suggested":"A","vote":"A","votepct":"9/9 votes, 100%","vi":"Công ty của bạn dự định dùng generative AI để hỗ trợ quản lý dự án và kỹ sư làm việc với bản vẽ thiết kế xây dựng lưu dưới dạng file PDF. Bạn cần đề xuất một giải pháp generative AI đáp ứng các yêu cầu: xử lý cả hình ảnh và văn bản; tóm tắt thiết kế của tòa nhà; trả lời câu hỏi của người dùng về thiết kế tòa nhà; trích xuất thông tin từ bản vẽ như vị trí hệ thống điện, sưởi và ống nước. Bạn nên đề xuất gì?","opts_vi":["giải pháp đa phương thức (multi-modal)","giải pháp nhận dạng ký tự quang học (OCR)","giải pháp hoàn thành văn bản (text completion)","giải pháp tóm tắt tài liệu"],"exp":"Vì giải pháp phải xử lý cả hình ảnh lẫn văn bản, tóm tắt, trả lời câu hỏi và trích xuất thông tin, cần một giải pháp multi-modal (A). OCR chỉ trích xuất văn bản từ ảnh, text completion chỉ tạo văn bản, còn tóm tắt tài liệu chỉ đáp ứng một phần yêu cầu, nên đều không đủ.","cite":"https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/models-featured","conf":"H"},{"id":"1-10","t":1,"n":10,"kind":"mcq","multi":1,"stem":"In which scenario is Azure Machine Learning most likely to deliver strategic value for an organization?","opts":[{"k":"A","en":"Using historical sales data to forecast demand across product categories."},{"k":"B","en":"Digitizing a paper-based process to reduce errors."},{"k":"C","en":"Entering customer feedback into a spreadsheet to understand sentiment."},{"k":"D","en":"Sending personalized emails to customers based on the customer location."}],"answer":["A"],"suggested":"A","vote":"Not available","votepct":"","vi":"Trong tình huống nào Azure Machine Learning có khả năng mang lại giá trị chiến lược cao nhất cho một tổ chức?","opts_vi":["Dùng dữ liệu bán hàng lịch sử để dự báo nhu cầu theo các nhóm sản phẩm.","Số hóa một quy trình dựa trên giấy tờ để giảm sai sót.","Nhập phản hồi của khách hàng vào bảng tính để hiểu cảm xúc (sentiment).","Gửi email cá nhân hóa cho khách hàng dựa trên vị trí của khách hàng."],"exp":"Azure Machine Learning phát huy giá trị chiến lược nhất khi xây dựng mô hình dự đoán/dự báo từ dữ liệu lịch sử, ví dụ dự báo nhu cầu sản phẩm, nên A đúng. B là số hóa quy trình, C là nhập liệu thủ công, D là quy tắc đơn giản dựa trên vị trí, đều không yêu cầu năng lực machine learning nâng cao.","cite":"https://learn.microsoft.com/en-us/azure/machine-learning/overview-what-is-azure-machine-learning","conf":"H"},{"id":"1-11","t":1,"n":11,"kind":"drop","stem":"Select the answer that correctly completes the sentence.","parts":[{"pre":"The primary goal of generative AI is","post":"","choices":["to analyze trends and classify data sources.","to create new content, such as text, images, or code.","to make predictions based on historical data."],"ans":1}],"suggested":"to create new content, such as text, images, or code. (Community comment - 2 upvotes)","vote":"Not available","votepct":"","vi":"Chọn đáp án hoàn thành đúng câu.","parts_vi":[{"pre_vi":"Mục tiêu chính của generative AI là","post_vi":"","choices_vi":["phân tích xu hướng và phân loại các nguồn dữ liệu.","tạo ra nội dung mới như văn bản, hình ảnh hoặc mã.","đưa ra dự đoán dựa trên dữ liệu lịch sử."]}],"exp":"Mục tiêu chính của generative AI là tạo ra nội dung mới như văn bản, hình ảnh hoặc mã. Việc phân tích/phân loại và dự đoán dựa trên dữ liệu lịch sử là đặc trưng của predictive AI, không phải generative AI.","cite":"https://learn.microsoft.com/en-us/azure/ai-foundry/openai/overview","conf":"H"},{"id":"1-12","t":1,"n":12,"kind":"drop","stem":"Select the answer that correctly completes the sentence.","parts":[{"pre":"Using high-quality grounding data in a generative AI solution","post":"","choices":["ensures that all responses are factually accurate.","increases performance of an AI model.","improves the accuracy and reliability of the predictions and outputs of AI.","increases the amount of storage required to host an AI model."],"ans":2}],"suggested":"improves the accuracy and reliability of the predictions and outputs of AI. (Community comment - 4 upvotes)","vote":"Not available","votepct":"","vi":"Chọn đáp án hoàn thành đúng câu.","parts_vi":[{"pre_vi":"Việc sử dụng dữ liệu grounding chất lượng cao trong một giải pháp generative AI","post_vi":"","choices_vi":["đảm bảo tất cả phản hồi đều chính xác về mặt sự thật.","tăng hiệu năng của mô hình AI.","cải thiện độ chính xác và độ tin cậy của các dự đoán và đầu ra của AI.","tăng dung lượng lưu trữ cần thiết để lưu trữ mô hình AI."]}],"exp":"Dữ liệu grounding chất lượng cao giúp cải thiện độ chính xác và độ tin cậy của đầu ra AI. Lựa chọn 'đảm bảo tất cả phản hồi đều chính xác' quá tuyệt đối và sai; grounding không nhằm tăng hiệu năng hay dung lượng lưu trữ.","cite":"https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/retrieval-augmented-generation","conf":"H"},{"id":"1-13","t":1,"n":13,"kind":"drop","stem":"Select the answer that correctly completes the sentence.","parts":[{"pre":"Prompt engineering is the process of","post":"","choices":["integrating AI-powered tools into business workflows.","identifying and fixing errors in AI-generated content.","designing, developing, and training generative AI models to produce contextually relevant content.","crafting clear instructions to guide generative AI solutions in generating context-appropriate content."],"ans":3}],"suggested":"crafting clear instructions to guide generative AI solutions in generating context-appropriate content. (Community comment - 4 upvotes)","vote":"Not available","votepct":"","vi":"Chọn đáp án hoàn thành đúng câu.","parts_vi":[{"pre_vi":"Prompt engineering là quá trình","post_vi":"","choices_vi":["tích hợp các công cụ dùng AI vào quy trình nghiệp vụ.","phát hiện và sửa lỗi trong nội dung do AI tạo ra.","thiết kế, phát triển và huấn luyện các mô hình generative AI để tạo nội dung phù hợp ngữ cảnh.","tạo ra các chỉ dẫn rõ ràng để hướng dẫn giải pháp generative AI tạo nội dung phù hợp ngữ cảnh."]}],"exp":"Prompt engineering là việc tạo ra các chỉ dẫn (prompt) rõ ràng để hướng dẫn mô hình tạo nội dung phù hợp ngữ cảnh, nên đáp án cuối đúng. Nó không phải tích hợp công cụ, sửa lỗi, và cũng không phải là việc thiết kế/huấn luyện mô hình (đó là phát triển mô hình).","cite":"https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/prompt-engineering","conf":"H"},{"id":"1-14","t":1,"n":14,"kind":"drop","stem":"Select the answer that correctly completes the sentence.","parts":[{"pre":"When a generative AI model produces output that seems realistic but contains incorrect information, the behavior is known as","post":"","choices":["data leakage.","model inaccuracy.","overreliance.","prompt injection."],"ans":1}],"suggested":"model inaccuracy. (Community comment - 3 upvotes)","vote":"Not available","votepct":"","vi":"Chọn đáp án hoàn thành đúng câu.","parts_vi":[{"pre_vi":"Khi một mô hình generative AI tạo ra kết quả trông có vẻ thực tế nhưng chứa thông tin sai, hành vi đó được gọi là","post_vi":"","choices_vi":["rò rỉ dữ liệu (data leakage).","sự thiếu chính xác của mô hình (model inaccuracy).","phụ thuộc quá mức (overreliance).","tấn công tiêm prompt (prompt injection)."]}],"exp":"Trong danh sách lựa chọn, hành vi mô hình tạo nội dung trông thực tế nhưng sai được mô tả gần nhất bằng 'model inaccuracy' (thuật ngữ chuyên môn thường gọi là hallucination). Data leakage là rò rỉ dữ liệu huấn luyện, overreliance là người dùng tin tưởng AI quá mức, prompt injection là kiểu tấn công thao túng prompt, đều không phải hiện tượng này.","cite":"https://learn.microsoft.com/en-us/azure/ai-foundry/responsible-ai/openai/overview","conf":"M"},{"id":"1-15","t":1,"n":15,"kind":"mcq","multi":1,"stem":"Your company uses a generative AI solution.\nYou need to improve the quality of responses by using grounding.\nWhich statement accurately describes how grounding improves accuracy and relevancy?","opts":[{"k":"A","en":"references a diverse set of people, disciplines, and perspectives"},{"k":"B","en":"explains how and why AI models generate content"},{"k":"C","en":"anchors the responses in specific data sources"},{"k":"D","en":"specifies the strengths and weaknesses of the AI model"}],"answer":["C"],"suggested":"C","vote":"C","votepct":"5/5 votes, 100%","vi":"Công ty của bạn sử dụng một giải pháp generative AI. Bạn cần cải thiện chất lượng phản hồi bằng cách sử dụng grounding. Phát biểu nào mô tả chính xác cách grounding cải thiện độ chính xác và độ liên quan?","opts_vi":["tham chiếu một tập hợp đa dạng gồm con người, lĩnh vực và quan điểm","giải thích cách thức và lý do các mô hình AI tạo nội dung","neo các phản hồi vào các nguồn dữ liệu cụ thể","chỉ rõ điểm mạnh và điểm yếu của mô hình AI"],"exp":"Grounding cải thiện độ chính xác và liên quan bằng cách neo (anchor) phản hồi vào các nguồn dữ liệu cụ thể, nên C đúng. A liên quan đến tính đa dạng/inclusiveness, B liên quan đến transparency (giải thích), D liên quan đến việc mô tả mô hình, đều không mô tả đúng grounding.","cite":"https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/retrieval-augmented-generation","conf":"H"},{"id":"1-16","t":1,"n":16,"kind":"mcq","multi":1,"stem":"You plan to meet with a group of stakeholders to discuss how generative AI can benefit your company.\nYou need to provide the stakeholders with a relevant description of generative AI during the meeting.\nWhich description should you use?","opts":[{"k":"A","en":"Generative AI is designed to generate responses based on a user's natural language prompts."},{"k":"B","en":"Generative AI is designed to translate documents into other languages."},{"k":"C","en":"Generative AI is designed to predict future trends based on historical data."},{"k":"D","en":"Generative AI is designed to recommend products based on user behavior."}],"answer":["A"],"suggested":"A","vote":"Not available","votepct":"","vi":"Bạn dự định gặp một nhóm các bên liên quan (stakeholders) để thảo luận về cách generative AI có thể mang lại lợi ích cho công ty. Bạn cần cung cấp cho họ một mô tả phù hợp về generative AI trong cuộc họp. Bạn nên dùng mô tả nào?","opts_vi":["Generative AI được thiết kế để tạo ra phản hồi dựa trên các prompt ngôn ngữ tự nhiên của người dùng.","Generative AI được thiết kế để dịch tài liệu sang các ngôn ngữ khác.","Generative AI được thiết kế để dự đoán xu hướng tương lai dựa trên dữ liệu lịch sử.","Generative AI được thiết kế để đề xuất sản phẩm dựa trên hành vi người dùng."],"exp":"Generative AI được thiết kế để tạo phản hồi/nội dung mới dựa trên prompt ngôn ngữ tự nhiên của người dùng, nên A là mô tả đúng và phù hợp nhất. Dịch thuật (B) là một tính năng cụ thể, dự đoán xu hướng (C) là predictive AI, còn đề xuất sản phẩm (D) là recommendation engine.","cite":"https://learn.microsoft.com/en-us/azure/ai-foundry/openai/overview","conf":"H"},{"id":"1-17","t":1,"n":17,"kind":"yesno","stem":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.","statements":[{"text":"A generative AI solution is well-suited to predict next-quarter sales trends.","ans":"N"},{"text":"A generative AI solution can summarize lengthy policy documents.","ans":"Y"},{"text":"A generative AI solution can create product descriptions from product specifications.","ans":"Y"}],"suggested":"No, Yes, Yes (Community comment - 3 upvotes)","vote":"Not available","votepct":"","vi":"Với mỗi phát biểu sau đây, chọn Yes nếu phát biểu đúng. Ngược lại, chọn No.\nLƯU Ý: Mỗi lựa chọn đúng được một điểm.","statements_vi":["Một giải pháp generative AI phù hợp để dự đoán xu hướng doanh số của quý tiếp theo.","Một giải pháp generative AI có thể tóm tắt các tài liệu chính sách dài.","Một giải pháp generative AI có thể tạo mô tả sản phẩm từ thông số kỹ thuật sản phẩm."],"exp":"Dự đoán xu hướng doanh số dựa trên dữ liệu lịch sử là bài toán của predictive AI (ví dụ machine learning), không phải thế mạnh của generative AI, nên phát biểu đầu là No. Generative AI vượt trội ở việc tạo nội dung mới như tóm tắt tài liệu và soạn mô tả sản phẩm, nên hai phát biểu sau là Yes.","cite":"https://learn.microsoft.com/en-us/training/modules/fundamentals-generative-ai/","conf":"H"},{"id":"1-18","t":1,"n":18,"kind":"mcq","multi":1,"stem":"Which statement accurately describes the difference between a pretrained generative AI model and a fine-tuned generative AI model?","opts":[{"k":"A","en":"A pretrained model requires labeled data, while a fine-tuned model does not."},{"k":"B","en":"A pretrained model is faster to train than a fine-tuned model because the pretrained model uses fewer parameters."},{"k":"C","en":"A pretrained model is trained on broad datasets, while a fine-tuned model is adapted to perform well on a narrower, domain-specific dataset."},{"k":"D","en":"A pretrained model is optimized for a specific task, while a fine-tuned model is designed for general-purpose use."}],"answer":["C"],"suggested":"C","vote":"C","votepct":"6/6 votes, 100%","vi":"Phát biểu nào mô tả chính xác sự khác biệt giữa một mô hình generative AI đã được pretrained (huấn luyện trước) và một mô hình generative AI đã được fine-tuned (tinh chỉnh)?","opts_vi":["Mô hình pretrained cần dữ liệu đã gán nhãn, còn mô hình fine-tuned thì không.","Mô hình pretrained huấn luyện nhanh hơn mô hình fine-tuned vì nó dùng ít tham số hơn.","Mô hình pretrained được huấn luyện trên tập dữ liệu rộng, còn mô hình fine-tuned được điều chỉnh để hoạt động tốt trên một tập dữ liệu hẹp, chuyên biệt theo lĩnh vực.","Mô hình pretrained được tối ưu cho một tác vụ cụ thể, còn mô hình fine-tuned được thiết kế cho mục đích sử dụng tổng quát."],"exp":"Mô hình pretrained học kiến thức tổng quát từ tập dữ liệu lớn và rộng, trong khi fine-tuning điều chỉnh mô hình đó trên dữ liệu hẹp, chuyên biệt theo lĩnh vực để cải thiện hiệu quả cho tác vụ cụ thể, nên đáp án C đúng. Đáp án D bị đảo ngược khái niệm, còn A và B mô tả sai về nhu cầu dữ liệu và số tham số.","cite":"https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/fine-tuning-overview","conf":"H"},{"id":"1-19","t":1,"n":19,"kind":"yesno","stem":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.","statements":[{"text":"Retrieval Augmented Generation (RAG) requires model fine-tuning.","ans":"N"},{"text":"Retrieval Augmented Generation (RAG) is helpful when you need a generative AI solution that can access current, verifiable information.","ans":"Y"},{"text":"Retrieval Augmented Generation (RAG) enables you to get more relevant responses based on your organization's documents without retraining the base model.","ans":"Y"}],"suggested":"No, Yes, Yes (Community comment - 2 upvotes)","vote":"Not available","votepct":"","vi":"Với mỗi phát biểu sau đây, chọn Yes nếu phát biểu đúng. Ngược lại, chọn No.\nLƯU Ý: Mỗi lựa chọn đúng được một điểm.","statements_vi":["Retrieval Augmented Generation (RAG) đòi hỏi phải fine-tuning mô hình.","Retrieval Augmented Generation (RAG) hữu ích khi bạn cần một giải pháp generative AI có thể truy cập thông tin hiện hành, có thể kiểm chứng.","Retrieval Augmented Generation (RAG) cho phép bạn nhận được các phản hồi phù hợp hơn dựa trên tài liệu của tổ chức mà không cần huấn luyện lại mô hình nền."],"exp":"RAG bổ sung tri thức bằng cách truy xuất dữ liệu từ nguồn bên ngoài tại thời điểm truy vấn, nên không đòi hỏi fine-tuning hay huấn luyện lại mô hình nền (phát biểu 1 là No). RAG cho phép mô hình truy cập thông tin cập nhật, có thể kiểm chứng từ tài liệu của tổ chức, nên phát biểu 2 và 3 là Yes.","cite":"https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/retrieval-augmented-generation","conf":"H"},{"id":"1-20","t":1,"n":20,"kind":"yesno","stem":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.","statements":[{"text":"Lack of trust in the security and accuracy of AI solutions is a common barrier to AI adoption.","ans":"Y"},{"text":"AI adoption efforts often fail when organizations overlook the importance of high-quality data.","ans":"Y"},{"text":"AI adoption is most successful when implemented with business and compliance stakeholders.","ans":"Y"}],"suggested":"Yes, Yes, Yes (Community comment - 2 upvotes)","vote":"Not available","votepct":"","vi":"Với mỗi phát biểu sau đây, chọn Yes nếu phát biểu đúng. Ngược lại, chọn No.\nLƯU Ý: Mỗi lựa chọn đúng được một điểm.","statements_vi":["Thiếu niềm tin vào tính bảo mật và độ chính xác của các giải pháp AI là một rào cản phổ biến đối với việc áp dụng AI.","Nỗ lực áp dụng AI thường thất bại khi các tổ chức bỏ qua tầm quan trọng của dữ liệu chất lượng cao.","Việc áp dụng AI thành công nhất khi được triển khai cùng với các bên liên quan về nghiệp vụ và tuân thủ."],"exp":"Cả ba phát biểu đều mô tả đúng các yếu tố thực tiễn trong việc áp dụng AI: thiếu niềm tin là rào cản, dữ liệu chất lượng thấp gây thất bại, và sự tham gia của các bên liên quan về nghiệp vụ lẫn tuân thủ giúp tăng khả năng thành công. Do đó tất cả đều là Yes.","cite":"https://learn.microsoft.com/en-us/training/modules/plan-ai-adoption/","conf":"H"},{"id":"1-21","t":1,"n":21,"kind":"mcq","multi":1,"stem":"Your company creates a custom Azure Machine Learning model that uses a generative AI assistant.\nThe model initially delivers strong results. However, six months later, the model predictions become noticeably less accurate.\nWhat is a possible cause of the issue?","opts":[{"k":"A","en":"The model requires additional compute resources."},{"k":"B","en":"The input data changed over time."},{"k":"C","en":"The model was trained incorrectly."}],"answer":["B"],"suggested":"B","vote":"Not available","votepct":"","vi":"Công ty của bạn tạo một mô hình Azure Machine Learning tùy chỉnh sử dụng trợ lý generative AI.\nBan đầu mô hình cho kết quả tốt. Tuy nhiên, sáu tháng sau, dự đoán của mô hình trở nên kém chính xác rõ rệt.\nĐâu là nguyên nhân có thể gây ra vấn đề này?","opts_vi":["Mô hình cần thêm tài nguyên tính toán.","Dữ liệu đầu vào thay đổi theo thời gian.","Mô hình đã được huấn luyện sai."],"exp":"Khi một mô hình hoạt động tốt lúc đầu nhưng suy giảm độ chính xác theo thời gian, nguyên nhân điển hình là data drift, tức đặc tính của dữ liệu đầu vào thay đổi so với dữ liệu huấn luyện, nên đáp án B đúng. Nếu mô hình huấn luyện sai thì kết quả sẽ kém ngay từ đầu, và thiếu tài nguyên tính toán ảnh hưởng tốc độ chứ không phải độ chính xác.","cite":"https://learn.microsoft.com/en-us/azure/machine-learning/how-to-monitor-datasets","conf":"H"},{"id":"1-22","t":1,"n":22,"kind":"yesno","stem":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.","statements":[{"text":"Generative AI can be used in the automation of complex workflows.","ans":"Y"},{"text":"Generative AI can be used to generate new content, such as text, images, and music.","ans":"Y"},{"text":"Generative AI is best suited to perform mathematical calculations and solve equations.","ans":"N"}],"suggested":"Yes, Yes, No (Community comment - 3 upvotes)","vote":"Not available","votepct":"","vi":"Với mỗi phát biểu sau đây, chọn Yes nếu phát biểu đúng. Ngược lại, chọn No.\nLƯU Ý: Mỗi lựa chọn đúng được một điểm.","statements_vi":["Generative AI có thể được dùng để tự động hóa các quy trình làm việc phức tạp.","Generative AI có thể được dùng để tạo nội dung mới như văn bản, hình ảnh và âm nhạc.","Generative AI phù hợp nhất để thực hiện các phép tính toán học và giải phương trình."],"exp":"Generative AI mạnh về tự động hóa quy trình và tạo nội dung mới (văn bản, hình ảnh, âm nhạc), nên hai phát biểu đầu là Yes. Tuy nhiên nó không phải công cụ đáng tin cậy cho tính toán chính xác vì hoạt động theo xác suất ngôn ngữ chứ không phải logic toán học tất định, nên phát biểu cuối là No.","cite":"https://learn.microsoft.com/en-us/training/modules/fundamentals-generative-ai/","conf":"H"},{"id":"1-23","t":1,"n":23,"kind":"yesno","stem":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.","statements":[{"text":"Retrieval Augmented Generation (RAG) architectures require that a large language model (LLM) be retrained on proprietary data.","ans":"N"},{"text":"Retrieval-Augmented Generation (RAG) grounds a language model to produce more factual and context-relevant responses.","ans":"Y"},{"text":"Retrieval Augmented Generation (RAG) retrieves information from external knowledge sources at runtime instead of relying solely on the knowledge of a generative AI model.","ans":"Y"}],"suggested":"No, Yes, Yes (Community comment - 2 upvotes)","vote":"Not available","votepct":"","vi":"Với mỗi phát biểu sau đây, chọn Yes nếu phát biểu đúng. Ngược lại, chọn No.\nLƯU Ý: Mỗi lựa chọn đúng được một điểm.","statements_vi":["Kiến trúc Retrieval Augmented Generation (RAG) đòi hỏi phải huấn luyện lại một large language model (LLM) trên dữ liệu độc quyền.","Retrieval-Augmented Generation (RAG) neo (grounds) mô hình ngôn ngữ để tạo ra phản hồi thực tế và phù hợp ngữ cảnh hơn.","Retrieval Augmented Generation (RAG) truy xuất thông tin từ các nguồn tri thức bên ngoài tại thời điểm chạy thay vì chỉ dựa vào tri thức của mô hình generative AI."],"exp":"RAG không huấn luyện lại LLM mà truy xuất dữ liệu liên quan tại thời điểm chạy để grounding phản hồi, nên phát biểu 1 là No còn phát biểu 2 và 3 là Yes. Cơ chế này giúp câu trả lời chính xác và phù hợp ngữ cảnh hơn mà vẫn giữ nguyên mô hình nền.","cite":"https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/retrieval-augmented-generation","conf":"H"},{"id":"1-24","t":1,"n":24,"kind":"yesno","stem":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.","statements":[{"text":"A text-to-image generator can be used to translate content into other languages.","ans":"N"},{"text":"A predictive analytics model can generate new marketing content for a company's online ads.","ans":"N"},{"text":"A generative AI chatbot can engage customers in personalized conversations and recommend products.","ans":"Y"}],"suggested":"No, No, Yes (Community comment - 4 upvotes)","vote":"Not available","votepct":"","vi":"Với mỗi phát biểu sau đây, chọn Yes nếu phát biểu đúng. Ngược lại, chọn No.\nLƯU Ý: Mỗi lựa chọn đúng được một điểm.","statements_vi":["Một bộ tạo ảnh từ văn bản (text-to-image) có thể được dùng để dịch nội dung sang các ngôn ngữ khác.","Một mô hình phân tích dự đoán (predictive analytics) có thể tạo nội dung tiếp thị mới cho quảng cáo trực tuyến của công ty.","Một chatbot generative AI có thể tương tác với khách hàng trong các cuộc trò chuyện cá nhân hóa và gợi ý sản phẩm."],"exp":"Bộ tạo ảnh từ văn bản sinh ra hình ảnh chứ không dịch ngôn ngữ, và mô hình phân tích dự đoán dùng để dự đoán chứ không tạo nội dung tiếp thị mới, nên hai phát biểu đầu là No. Chatbot generative AI đúng là có thể trò chuyện cá nhân hóa và gợi ý sản phẩm, nên phát biểu cuối là Yes.","cite":"https://learn.microsoft.com/en-us/training/modules/fundamentals-generative-ai/","conf":"H"},{"id":"1-25","t":1,"n":25,"kind":"mcq","multi":1,"stem":"You have a large language model (LLM) that was pretrained by using public data.\nYou want the LLM to generate responses that incorporate frequently updated proprietary content, such as internal documents and knowledge bases.\nYou need to recommend a solution to ensure that the LLM uses the most current information without retraining the model.\nWhat should you include in the recommendation?","opts":[{"k":"A","en":"Retrieval Augmented Generation (RAG)"},{"k":"B","en":"prompt engineering"},{"k":"C","en":"content filtering"},{"k":"D","en":"model fine-tuning"}],"answer":["A"],"suggested":"A","vote":"Not available","votepct":"","vi":"Bạn có một large language model (LLM) đã được pretrained bằng dữ liệu công khai.\nBạn muốn LLM tạo ra phản hồi tích hợp nội dung độc quyền được cập nhật thường xuyên, chẳng hạn tài liệu nội bộ và cơ sở tri thức.\nBạn cần đề xuất một giải pháp để bảo đảm LLM sử dụng thông tin mới nhất mà không huấn luyện lại mô hình.\nBạn nên đưa gì vào đề xuất?","opts_vi":["Retrieval Augmented Generation (RAG)","prompt engineering","content filtering (lọc nội dung)","model fine-tuning (tinh chỉnh mô hình)"],"exp":"RAG truy xuất nội dung độc quyền được cập nhật thường xuyên tại thời điểm chạy và đưa vào ngữ cảnh, giúp LLM dùng thông tin mới nhất mà không cần huấn luyện lại, nên đáp án A đúng. Fine-tuning đòi hỏi huấn luyện lại và không phù hợp với dữ liệu thay đổi liên tục; prompt engineering và content filtering không cung cấp khả năng truy cập tri thức cập nhật.","cite":"https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/retrieval-augmented-generation","conf":"H"},{"id":"1-26","t":1,"n":26,"kind":"yesno","stem":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.","statements":[{"text":"Prompt engineering changes how a generative AI model was trained.","ans":"N"},{"text":"Prompt engineering focuses on designing clear, concise, and context-rich instructions.","ans":"Y"},{"text":"Effective prompt engineering involves maximizing the number of tokens used in each request.","ans":"N"}],"suggested":"No, Yes, No (Community comment - 2 upvotes)","vote":"Not available","votepct":"","vi":"Với mỗi phát biểu sau đây, chọn Yes nếu phát biểu đúng. Ngược lại, chọn No.\nLƯU Ý: Mỗi lựa chọn đúng được một điểm.","statements_vi":["Prompt engineering thay đổi cách mô hình generative AI được huấn luyện.","Prompt engineering tập trung vào việc thiết kế các chỉ dẫn rõ ràng, súc tích và giàu ngữ cảnh.","Prompt engineering hiệu quả nghĩa là tối đa hóa số lượng token dùng trong mỗi yêu cầu."],"exp":"Prompt engineering chỉ định hình cách bạn đặt câu hỏi/hướng dẫn cho mô hình, không thay đổi quá trình huấn luyện của mô hình (phát biểu 1 là No). Trọng tâm là tạo chỉ dẫn rõ ràng, súc tích, giàu ngữ cảnh (phát biểu 2 là Yes), chứ không phải tối đa hóa số token (phát biểu 3 là No).","cite":"https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/prompt-engineering","conf":"H"},{"id":"1-27","t":1,"n":27,"kind":"drop","stem":"Select the answer that correctly completes the sentence.","parts":[{"pre":"Effective prompt engineering increases the","post":"","choices":["storage capacity required for AI data.","training time required for generative AI models.","accuracy and relevance of AI-generated responses."],"ans":2}],"suggested":"accuracy and relevance of AI-generated responses. (Community comment - 2 upvotes)","vote":"Not available","votepct":"","vi":"Chọn câu trả lời hoàn thành đúng câu sau.","parts_vi":[{"pre_vi":"Prompt engineering hiệu quả làm tăng","post_vi":"","choices_vi":["dung lượng lưu trữ cần thiết cho dữ liệu AI.","thời gian huấn luyện cần thiết cho các mô hình generative AI.","độ chính xác và mức độ liên quan của các phản hồi do AI tạo ra."]}],"exp":"Prompt engineering hiệu quả giúp mô hình hiểu rõ ý định hơn, từ đó nâng cao độ chính xác và mức độ liên quan của phản hồi, nên đáp án thứ ba đúng. Nó không liên quan đến dung lượng lưu trữ hay thời gian huấn luyện vì nó tác động ở khâu suy luận (inference), không phải khâu huấn luyện.","cite":"https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/prompt-engineering","conf":"H"},{"id":"1-28","t":1,"n":28,"kind":"yesno","stem":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.","statements":[{"text":"Prompt engineering involves specifying guidelines that help a generative AI model generate useful and accurate responses.","ans":"Y"},{"text":"The instruction is the part of the prompt that includes examples to show the AI what its response should look like.","ans":"N"},{"text":"The context is the part of the prompt that helps a generative AI model understand which information to use when generating a response.","ans":"Y"}],"suggested":"Yes, No, Yes (Community comment - 3 upvotes)","vote":"Not available","votepct":"","vi":"Với mỗi phát biểu sau đây, chọn Yes nếu phát biểu đúng. Ngược lại, chọn No.\nLƯU Ý: Mỗi lựa chọn đúng được một điểm.","statements_vi":["Prompt engineering bao gồm việc chỉ định các hướng dẫn giúp mô hình generative AI tạo ra phản hồi hữu ích và chính xác.","Instruction (chỉ thị) là phần của prompt bao gồm các ví dụ để cho AI thấy phản hồi của nó nên trông như thế nào.","Context (ngữ cảnh) là phần của prompt giúp mô hình generative AI hiểu nên dùng thông tin nào khi tạo phản hồi."],"exp":"Prompt engineering đúng là chỉ định hướng dẫn để có phản hồi hữu ích, chính xác (phát biểu 1 là Yes), và context là phần cung cấp thông tin nền để mô hình biết dựa vào đâu (phát biểu 3 là Yes). Phần chứa các ví dụ minh họa được gọi là examples chứ không phải instruction, nên phát biểu 2 là No.","cite":"https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/prompt-engineering","conf":"H"},{"id":"1-29","t":1,"n":29,"kind":"mcq","multi":1,"stem":"Your company plans to use generative AI to help build a website that will showcase various existing products.\nWhich capability best describes a benefit of using generative AI for this project? More than one answer choice may achieve the goal. Select the BEST answer.","opts":[{"k":"A","en":"creating product descriptions based on product specifications"},{"k":"B","en":"designing a new product based on customer requirements"},{"k":"C","en":"translating product descriptions into a different language"},{"k":"D","en":"analyzing product sales to identify patterns and trends"}],"answer":["A"],"suggested":"A","vote":"A","votepct":"6/6 votes, 100%","vi":"Công ty của bạn dự định dùng generative AI để giúp xây dựng một trang web trưng bày nhiều sản phẩm hiện có.\nKhả năng nào mô tả tốt nhất một lợi ích của việc dùng generative AI cho dự án này? Có thể có nhiều lựa chọn đạt được mục tiêu. Hãy chọn đáp án TỐT NHẤT.","opts_vi":["tạo mô tả sản phẩm dựa trên thông số kỹ thuật sản phẩm","thiết kế một sản phẩm mới dựa trên yêu cầu của khách hàng","dịch mô tả sản phẩm sang một ngôn ngữ khác","phân tích doanh số sản phẩm để nhận diện các mẫu hình và xu hướng"],"exp":"Với mục tiêu trưng bày các sản phẩm hiện có trên website, việc generative AI tạo mô tả sản phẩm từ thông số kỹ thuật là lợi ích trực tiếp và phù hợp nhất, nên đáp án A đúng. Thiết kế sản phẩm mới nằm ngoài phạm vi trang trưng bày, dịch thuật chỉ là phụ trợ, còn phân tích doanh số thuộc predictive analytics chứ không phải trọng tâm ở đây.","cite":"https://learn.microsoft.com/en-us/training/modules/fundamentals-generative-ai/","conf":"H"},{"id":"1-30","t":1,"n":30,"kind":"drop","stem":"Select the answer that correctly completes the sentence.","parts":[{"pre":"The main difference between generative AI and predictive AI is that generative AI","post":"","choices":["uses a smaller dataset.","produces more accurate results.","can produce new and original content."],"ans":2}],"suggested":"can produce new and original content. (Community comment - 3 upvotes)","vote":"Not available","votepct":"","vi":"Chọn câu trả lời hoàn thành đúng câu sau.","parts_vi":[{"pre_vi":"Khác biệt chính giữa generative AI và predictive AI là generative AI","post_vi":"","choices_vi":["sử dụng tập dữ liệu nhỏ hơn.","tạo ra kết quả chính xác hơn.","có thể tạo ra nội dung mới và nguyên bản."]}],"exp":"Generative AI khác biệt ở khả năng tạo ra nội dung mới và nguyên bản (văn bản, hình ảnh, mã), trong khi predictive AI tập trung dự đoán dựa trên dữ liệu lịch sử, nên đáp án thứ ba đúng. Kích thước dữ liệu và độ chính xác không phải là điểm khác biệt định danh giữa hai loại.","cite":"https://learn.microsoft.com/en-us/training/modules/fundamentals-generative-ai/","conf":"H"},{"id":"1-31","t":1,"n":31,"kind":"mcq","multi":1,"stem":"Your company sells hiking and camping gear online.\nYou need a generative AI solution that can interact with customers, ask questions about their needs, and escalate to a human agent if necessary.\nWhat solution should you use?","opts":[{"k":"A","en":"a chatbot"},{"k":"B","en":"predictive AI"},{"k":"C","en":"a recommendation engine"},{"k":"D","en":"computer vision"}],"answer":["A"],"suggested":"A","vote":"Not available","votepct":"","vi":"Công ty của bạn bán đồ dùng leo núi và cắm trại trực tuyến.\nBạn cần một giải pháp generative AI có thể tương tác với khách hàng, đặt câu hỏi về nhu cầu của họ, và chuyển cho nhân viên trực tiếp khi cần thiết.\nBạn nên dùng giải pháp nào?","opts_vi":["một chatbot","predictive AI","một công cụ gợi ý (recommendation engine)","computer vision (thị giác máy tính)"],"exp":"Chatbot generative AI có thể trò chuyện bằng ngôn ngữ tự nhiên, hỏi về nhu cầu khách hàng và chuyển tiếp (escalate) sang nhân viên trực tiếp khi cần, nên đáp án A đúng. Predictive AI dùng để dự đoán, recommendation engine chỉ gợi ý sản phẩm, và computer vision xử lý hình ảnh nên đều không phù hợp với tương tác hội thoại.","cite":"https://learn.microsoft.com/en-us/microsoft-copilot-studio/fundamentals-what-is-copilot-studio","conf":"H"},{"id":"2-1","t":2,"n":1,"kind":"mcq","multi":1,"stem":"Your company receives thousands of scanned invoices each month.\nYou need to recommend an AI solution that can automatically extract key details, such as invoice numbers, vendor names, and total amounts.\nWhat is the best solution to recommend? More than one answer choice may achieve the goal. Select the BEST answer.","opts":[{"k":"A","en":"Azure Document Intelligence in Foundry Tools"},{"k":"B","en":"Azure Vision in Foundry Tools"},{"k":"C","en":"Azure AI Search"},{"k":"D","en":"Azure Machine Learning"}],"answer":["A"],"suggested":"A","vote":"A","votepct":"9/9 votes, 100%","vi":"Công ty của bạn nhận hàng nghìn hóa đơn được quét mỗi tháng.\nBạn cần đề xuất một giải pháp AI có thể tự động trích xuất các thông tin quan trọng, chẳng hạn như số hóa đơn, tên nhà cung cấp và tổng số tiền.\nGiải pháp tốt nhất nên đề xuất là gì? Có thể có nhiều lựa chọn đạt được mục tiêu. Hãy chọn câu trả lời TỐT NHẤT.","opts_vi":[{"k":"A","vi":"Azure Document Intelligence trong Foundry Tools"},{"k":"B","vi":"Azure Vision trong Foundry Tools"},{"k":"C","vi":"Azure AI Search"},{"k":"D","vi":"Azure Machine Learning"}],"exp":"Azure Document Intelligence được thiết kế chuyên cho việc trích xuất dữ liệu có cấu trúc từ biểu mẫu và hóa đơn, bao gồm các trường như số hóa đơn, nhà cung cấp và tổng tiền, với các mô hình dựng sẵn (prebuilt invoice model). Azure Vision chỉ đọc chữ chung (OCR) mà không hiểu cấu trúc trường của hóa đơn, Azure AI Search dùng để lập chỉ mục và tìm kiếm, còn Azure Machine Learning đòi hỏi tự huấn luyện mô hình nên không tối ưu.","cite":"https://learn.microsoft.com/en-us/azure/ai-services/document-intelligence/overview","conf":"H"},{"id":"2-2","t":2,"n":2,"kind":"yesno","stem":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.","statements":[{"text":"To use Microsoft 365 Copilot Chat, you must have a Microsoft 365 Copilot license.","ans":"N"},{"text":"Microsoft 365 Copilot Chat provides context-aware assistance in Microsoft 365 apps.","ans":"Y"},{"text":"Microsoft 365 Copilot Chat can only access information in open files and read emails.","ans":"N"}],"suggested":"No, Yes, No (Community comment - 7 upvotes)","vote":"Not available","votepct":"","vi":"Với mỗi phát biểu sau, chọn Yes nếu phát biểu đúng. Nếu không, chọn No.\nLƯU Ý: Mỗi lựa chọn đúng có giá trị một điểm.","statements_vi":["Để sử dụng Microsoft 365 Copilot Chat, bạn phải có giấy phép Microsoft 365 Copilot.","Microsoft 365 Copilot Chat cung cấp hỗ trợ theo ngữ cảnh trong các ứng dụng Microsoft 365.","Microsoft 365 Copilot Chat chỉ có thể truy cập thông tin trong các tệp đang mở và đọc email."],"exp":"Câu 1 sai (No): Copilot Chat có thể được dùng miễn phí với tài khoản công việc mà không cần giấy phép Copilot trả phí (giấy phép chỉ mở thêm truy cập dữ liệu tổ chức qua Graph). Câu 2 đúng (Yes): Copilot Chat cung cấp hỗ trợ theo ngữ cảnh trong các ứng dụng Microsoft 365. Câu 3 sai (No): Copilot Chat không bị giới hạn chỉ trong tệp đang mở và email; phạm vi truy cập rộng hơn tùy theo giấy phép.","cite":"https://learn.microsoft.com/en-us/copilot/microsoft-365/microsoft-365-copilot-chat","conf":"M"},{"id":"2-3","t":2,"n":3,"kind":"drop","stem":"Select the answer that correctly completes the sentence.","parts":[{"pre":"The Analyst agent in Microsoft 365 Copilot","post":"","choices":["compiles background research for a new market or initiative.","enables you to generate audio summaries of select references.","uses a conversational agent to answer employee FAQs.","uses structured data and provides insights by using text, charts, tables, and other visuals."],"ans":3}],"suggested":"uses structured data and provides insights by using text, charts, tables, and other visuals. (Community comment - 2 upvotes)","vote":"Not available","votepct":"","vi":"Chọn câu trả lời hoàn thành đúng câu.","parts_vi":[{"pre_vi":"Analyst agent trong Microsoft 365 Copilot","post_vi":"","choices_vi":["biên soạn nghiên cứu nền tảng cho một thị trường hoặc sáng kiến mới.","cho phép bạn tạo bản tóm tắt âm thanh của các tài liệu tham khảo được chọn.","sử dụng một tác nhân hội thoại để trả lời các câu hỏi thường gặp của nhân viên.","sử dụng dữ liệu có cấu trúc và cung cấp thông tin chi tiết bằng văn bản, biểu đồ, bảng và các hình ảnh trực quan khác."]}],"exp":"Analyst agent chuyên xử lý dữ liệu có cấu trúc (như bảng tính, tập dữ liệu) và tạo ra thông tin chi tiết dưới dạng văn bản, biểu đồ, bảng và trực quan hóa, tương tự vai trò một chuyên viên phân tích dữ liệu. Lựa chọn 'biên soạn nghiên cứu nền tảng' mô tả Researcher agent, còn các lựa chọn về tóm tắt âm thanh và trả lời FAQ không phải chức năng của Analyst.","cite":"https://learn.microsoft.com/en-us/copilot/microsoft-365/agents-overview","conf":"H"},{"id":"2-4","t":2,"n":4,"kind":"mcq","multi":1,"stem":"Your company discovers that several employees use personal ChatGPT accounts to assist with work tasks. You are concerned about proprietary data being shared externally.\nYou need to evaluate the business value of rolling out Microsoft 365 Copilot.\nWhich capability is a key benefit of using Copilot instead of a personal ChatGPT account?","opts":[{"k":"A","en":"analyzing and producing reports based on complex data"},{"k":"B","en":"generating ideas and solving issues"},{"k":"C","en":"drafting documents, emails, presentations, and marketing materials"},{"k":"D","en":"accessing internal data in accordance with existing Microsoft 365 policies"}],"answer":["D"],"suggested":"D","vote":"D","votepct":"5/5 votes, 100%","vi":"Công ty của bạn phát hiện một số nhân viên sử dụng tài khoản ChatGPT cá nhân để hỗ trợ công việc. Bạn lo ngại về việc dữ liệu độc quyền bị chia sẻ ra bên ngoài.\nBạn cần đánh giá giá trị kinh doanh của việc triển khai Microsoft 365 Copilot.\nKhả năng nào là lợi ích chính khi dùng Copilot thay vì tài khoản ChatGPT cá nhân?","opts_vi":[{"k":"A","vi":"phân tích và tạo báo cáo dựa trên dữ liệu phức tạp"},{"k":"B","vi":"tạo ý tưởng và giải quyết vấn đề"},{"k":"C","vi":"soạn thảo tài liệu, email, bản trình bày và tài liệu tiếp thị"},{"k":"D","vi":"truy cập dữ liệu nội bộ theo đúng các chính sách Microsoft 365 hiện có"}],"exp":"Lợi ích cốt lõi so với ChatGPT cá nhân là Microsoft 365 Copilot hoạt động trong ranh giới bảo mật và tuân thủ của tổ chức, kế thừa các chính sách, quyền truy cập và bảo vệ dữ liệu Microsoft 365 hiện có, do đó dữ liệu độc quyền không bị rò rỉ ra ngoài. Các lựa chọn A, B, C là những khả năng tạo sinh mà cả ChatGPT cũng làm được nên không phải điểm khác biệt then chốt trong bối cảnh lo ngại về bảo mật dữ liệu.","cite":"https://learn.microsoft.com/en-us/copilot/microsoft-365/microsoft-365-copilot-overview","conf":"H"},{"id":"2-5","t":2,"n":5,"kind":"drop","stem":"Select the answer that correctly completes the sentence.","parts":[{"pre":"The Researcher agent in Microsoft 365 Copilot","post":"","choices":["creates visual dashboards from structured data in Microsoft Excel and Power BI.","generates a pivot table and performs time series forecasting.","performs complex, multi-step, data analysis and code execution tasks over arbitrary datasets.","uses reasoning capabilities to generate deep insights based on organizational data and the web."],"ans":3}],"suggested":"uses reasoning capabilities to generate deep insights based on organizational data and the web. (Community comment - 3 upvotes)","vote":"Not available","votepct":"","vi":"Chọn câu trả lời hoàn thành đúng câu.","parts_vi":[{"pre_vi":"Researcher agent trong Microsoft 365 Copilot","post_vi":"","choices_vi":["tạo bảng điều khiển trực quan từ dữ liệu có cấu trúc trong Microsoft Excel và Power BI.","tạo bảng tổng hợp (pivot table) và thực hiện dự báo chuỗi thời gian.","thực hiện các tác vụ phân tích dữ liệu nhiều bước phức tạp và thực thi mã trên các tập dữ liệu bất kỳ.","sử dụng khả năng suy luận để tạo ra thông tin chi tiết sâu sắc dựa trên dữ liệu của tổ chức và web."]}],"exp":"Researcher agent sử dụng các mô hình suy luận nâng cao để kết hợp dữ liệu của tổ chức (qua Microsoft Graph) với thông tin từ web nhằm tạo ra nghiên cứu và thông tin chi tiết sâu, đa bước. Các lựa chọn về bảng điều khiển, pivot table và phân tích/thực thi mã trên tập dữ liệu mô tả năng lực của Analyst agent chứ không phải Researcher.","cite":"https://learn.microsoft.com/en-us/copilot/microsoft-365/agents-overview","conf":"H"},{"id":"2-6","t":2,"n":6,"kind":"drop","stem":"What should you use for each task? To answer, select the appropriate options in the answer area.\nNOTE: Each correct selection is worth one point.","parts":[{"pre":"Extracting structured data from forms and invoices:","post":"","choices":["Azure Language in Foundry Tools","Azure Document Intelligence in Foundry Tools","Azure Vision in Foundry Tools"],"ans":1},{"pre":"Summarizing written content from business reports:","post":"","choices":["Azure Language in Foundry Tools","Azure Document Intelligence in Foundry Tools","Azure Vision in Foundry Tools"],"ans":0},{"pre":"Generating descriptive text for uploaded images:","post":"","choices":["Azure Language in Foundry Tools","Azure Document Intelligence in Foundry Tools","Azure Vision in Foundry Tools"],"ans":2}],"suggested":"Document Intelligence; Language; Vision (Community comment - 3 upvotes)","vote":"Not available","votepct":"","vi":"Bạn nên sử dụng gì cho mỗi tác vụ? Để trả lời, hãy chọn các tùy chọn phù hợp trong vùng trả lời.\nLƯU Ý: Mỗi lựa chọn đúng có giá trị một điểm.","parts_vi":[{"pre_vi":"Trích xuất dữ liệu có cấu trúc từ biểu mẫu và hóa đơn:","post_vi":"","choices_vi":["Azure Language trong Foundry Tools","Azure Document Intelligence trong Foundry Tools","Azure Vision trong Foundry Tools"]},{"pre_vi":"Tóm tắt nội dung văn bản từ các báo cáo kinh doanh:","post_vi":"","choices_vi":["Azure Language trong Foundry Tools","Azure Document Intelligence trong Foundry Tools","Azure Vision trong Foundry Tools"]},{"pre_vi":"Tạo văn bản mô tả cho các hình ảnh được tải lên:","post_vi":"","choices_vi":["Azure Language trong Foundry Tools","Azure Document Intelligence trong Foundry Tools","Azure Vision trong Foundry Tools"]}],"exp":"Document Intelligence trích xuất dữ liệu có cấu trúc từ biểu mẫu và hóa đơn; Azure Language xử lý ngôn ngữ tự nhiên nên đảm nhận tóm tắt văn bản (summarization); Azure Vision phân tích hình ảnh và tạo chú thích/mô tả (image captioning) cho ảnh tải lên. Mỗi dịch vụ tương ứng đúng một tác vụ theo đặc thù dữ liệu đầu vào.","cite":"https://learn.microsoft.com/en-us/azure/ai-services/what-are-ai-services","conf":"H"},{"id":"2-7","t":2,"n":7,"kind":"yesno","stem":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.","statements":[{"text":"A manufacturer can use Azure Vision in Foundry Tools to identify product defects on an assembly line.","ans":"Y"},{"text":"A logistics company can use Azure Vision in Foundry Tools to recognize package shipping labels.","ans":"Y"},{"text":"The HR department at your company can only use Azure Vision in Foundry Tools to extract written content from Microsoft Word files.","ans":"N"}],"suggested":"Yes, Yes, No (Community comment - 2 upvotes)","vote":"Not available","votepct":"","vi":"Với mỗi phát biểu sau, chọn Yes nếu phát biểu đúng. Nếu không, chọn No.\nLƯU Ý: Mỗi lựa chọn đúng có giá trị một điểm.","statements_vi":["Một nhà sản xuất có thể dùng Azure Vision trong Foundry Tools để phát hiện lỗi sản phẩm trên dây chuyền lắp ráp.","Một công ty logistics có thể dùng Azure Vision trong Foundry Tools để nhận diện nhãn vận chuyển bưu kiện.","Bộ phận nhân sự của công ty bạn chỉ có thể dùng Azure Vision trong Foundry Tools để trích xuất nội dung văn bản từ các tệp Microsoft Word."],"exp":"Câu 1 và 2 đúng (Yes): Azure Vision phân tích hình ảnh, phù hợp để phát hiện lỗi sản phẩm và nhận diện/đọc nhãn vận chuyển (OCR trên ảnh). Câu 3 sai (No): Azure Vision xử lý hình ảnh, không phải công cụ chỉ để trích xuất văn bản từ tệp Word; hơn nữa nó không bị giới hạn 'chỉ' ở một chức năng duy nhất.","cite":"https://learn.microsoft.com/en-us/azure/ai-services/computer-vision/overview","conf":"H"},{"id":"2-8","t":2,"n":8,"kind":"drop","stem":"Select the answer that correctly completes the sentence.","parts":[{"pre":"When you use Microsoft 365 Copilot connectors to connect external content to","post":", your users can find, summarize, and learn from line-of-business (LOB) data by using natural language prompts.","choices":["Azure AI Search","Microsoft Graph","Microsoft Purview","Microsoft SharePoint"],"ans":1}],"suggested":"Microsoft Graph (Community comment - 3 upvotes)","vote":"Not available","votepct":"","vi":"Chọn câu trả lời hoàn thành đúng câu.","parts_vi":[{"pre_vi":"Khi bạn dùng các Microsoft 365 Copilot connectors để kết nối nội dung bên ngoài với","post_vi":", người dùng có thể tìm kiếm, tóm tắt và học hỏi từ dữ liệu nghiệp vụ (LOB) bằng các câu lệnh ngôn ngữ tự nhiên.","choices_vi":["Azure AI Search","Microsoft Graph","Microsoft Purview","Microsoft SharePoint"]}],"exp":"Microsoft 365 Copilot connectors đưa nội dung bên ngoài vào Microsoft Graph, nhờ đó Copilot có thể suy luận trên dữ liệu nghiệp vụ (LOB) đã được lập chỉ mục qua các câu lệnh ngôn ngữ tự nhiên. Azure AI Search và Purview phục vụ mục đích khác (tìm kiếm tùy chỉnh và quản trị/tuân thủ), còn SharePoint chỉ là một nguồn dữ liệu chứ không phải lớp hợp nhất mà connectors ghi dữ liệu vào.","cite":"https://learn.microsoft.com/en-us/microsoftsearch/connectors-overview","conf":"H"},{"id":"2-9","t":2,"n":9,"kind":"yesno","stem":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.","statements":[{"text":"Microsoft 365 Copilot connectors enable you to index data from multiple sources to make the data available in Copilot.","ans":"Y"},{"text":"You can build a custom Microsoft 365 Copilot connector when the available connectors do NOT meet your data integration requirements.","ans":"Y"},{"text":"To use Microsoft 365 Copilot connectors, you need a Microsoft Copilot Studio license.","ans":"N"}],"suggested":"Yes, Yes, No (Community comment - 2 upvotes)","vote":"Not available","votepct":"","vi":"Với mỗi phát biểu sau, chọn Yes nếu phát biểu đúng. Nếu không, chọn No.\nLƯU Ý: Mỗi lựa chọn đúng có giá trị một điểm.","statements_vi":["Microsoft 365 Copilot connectors cho phép bạn lập chỉ mục dữ liệu từ nhiều nguồn để dữ liệu đó khả dụng trong Copilot.","Bạn có thể xây dựng một Microsoft 365 Copilot connector tùy chỉnh khi các connector có sẵn KHÔNG đáp ứng yêu cầu tích hợp dữ liệu.","Để sử dụng Microsoft 365 Copilot connectors, bạn cần giấy phép Microsoft Copilot Studio."],"exp":"Câu 1 đúng (Yes): connectors lập chỉ mục dữ liệu từ nhiều nguồn để đưa vào Microsoft Graph cho Copilot dùng. Câu 2 đúng (Yes): bạn có thể tạo connector tùy chỉnh khi các connector có sẵn không đủ. Câu 3 sai (No): connectors không yêu cầu giấy phép Copilot Studio; chúng thuộc nền tảng Microsoft Graph/Search.","cite":"https://learn.microsoft.com/en-us/microsoftsearch/connectors-overview","conf":"H"},{"id":"2-10","t":2,"n":10,"kind":"yesno","stem":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.","statements":[{"text":"Microsoft Copilot provides a single AI app that has identical features and experiences across all Microsoft products.","ans":"N"},{"text":"Microsoft 365 Copilot delivers AI capabilities for business users that use Microsoft 365 apps.","ans":"Y"},{"text":"Microsoft Security Copilot helps companies understand risks and the organizational security posture.","ans":"Y"}],"suggested":"No, Yes, Yes (Community comment - 2 upvotes)","vote":"Not available","votepct":"","vi":"Với mỗi phát biểu sau, chọn Yes nếu phát biểu đúng. Nếu không, chọn No.\nLƯU Ý: Mỗi lựa chọn đúng có giá trị một điểm.","statements_vi":["Microsoft Copilot cung cấp một ứng dụng AI duy nhất có tính năng và trải nghiệm giống hệt nhau trên tất cả các sản phẩm Microsoft.","Microsoft 365 Copilot mang lại các khả năng AI cho người dùng nghiệp vụ sử dụng các ứng dụng Microsoft 365.","Microsoft Security Copilot giúp các công ty hiểu rõ rủi ro và tình trạng an ninh của tổ chức."],"exp":"Câu 1 sai (No): Copilot là một họ sản phẩm với các trải nghiệm khác nhau tùy theo sản phẩm (Microsoft 365 Copilot, Security Copilot, Copilot in Azure...), không phải một ứng dụng đồng nhất. Câu 2 đúng (Yes): Microsoft 365 Copilot phục vụ người dùng ng
