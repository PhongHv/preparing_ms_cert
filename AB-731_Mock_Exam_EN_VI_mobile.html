hiệp vụ trong các ứng dụng Microsoft 365. Câu 3 đúng (Yes): Security Copilot giúp đánh giá rủi ro và tình trạng an ninh của tổ chức.","cite":"https://learn.microsoft.com/en-us/copilot/microsoft-365/microsoft-365-copilot-overview","conf":"H"},{"id":"2-11","t":2,"n":11,"kind":"yesno","stem":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.","statements":[{"text":"Azure Vision in Foundry Tools can extract and analyze key phrases from PDF files.","ans":"N"},{"text":"Azure Vision in Foundry Tools can generate images based on natural language descriptions.","ans":"N"},{"text":"Azure Document Intelligence in Foundry Tools can be used to automate the processing of invoices and credit notes.","ans":"Y"}],"suggested":"No, No, Yes (Community comment - 6 upvotes)","vote":"Not available","votepct":"","vi":"Với mỗi phát biểu sau, chọn Yes nếu phát biểu đúng. Nếu không, chọn No.\nLƯU Ý: Mỗi lựa chọn đúng có giá trị một điểm.","statements_vi":["Azure Vision trong Foundry Tools có thể trích xuất và phân tích các cụm từ khóa từ tệp PDF.","Azure Vision trong Foundry Tools có thể tạo hình ảnh dựa trên mô tả ngôn ngữ tự nhiên.","Azure Document Intelligence trong Foundry Tools có thể được dùng để tự động hóa việc xử lý hóa đơn và giấy báo có (credit note)."],"exp":"Câu 1 sai (No): trích xuất và phân tích cụm từ khóa là chức năng của Azure Language, không phải Vision. Câu 2 sai (No): Azure Vision phân tích hình ảnh chứ không tạo sinh hình ảnh (việc tạo ảnh dùng mô hình như DALL-E). Câu 3 đúng (Yes): Document Intelligence lý tưởng để tự động xử lý hóa đơn và giấy báo có.","cite":"https://learn.microsoft.com/en-us/azure/ai-services/computer-vision/overview","conf":"H"},{"id":"2-12","t":2,"n":12,"kind":"mcq","multi":1,"stem":"Your company stores thousands of reports and documents across multiple systems.\nYou recommend using Azure AI Search as part of a new generative AI solution to improve information discovery.\nWhat is a key benefit of using Azure AI Search in this scenario?","opts":[{"k":"A","en":"generates responses to customer questions without referencing the existing data"},{"k":"B","en":"queries and retrieves information from large collections of data by using natural language"},{"k":"C","en":"automates document workflows based on the document content"},{"k":"D","en":"improves model accuracy by fine-tuning organizational data"}],"answer":["B"],"suggested":"B","vote":"B","votepct":"5/5 votes, 100%","vi":"Công ty của bạn lưu trữ hàng nghìn báo cáo và tài liệu trên nhiều hệ thống.\nBạn đề xuất dùng Azure AI Search như một phần của giải pháp AI tạo sinh mới để cải thiện việc khám phá thông tin.\nLợi ích chính của việc dùng Azure AI Search trong kịch bản này là gì?","opts_vi":[{"k":"A","vi":"tạo phản hồi cho các câu hỏi của khách hàng mà không tham chiếu dữ liệu hiện có"},{"k":"B","vi":"truy vấn và truy xuất thông tin từ các tập dữ liệu lớn bằng ngôn ngữ tự nhiên"},{"k":"C","vi":"tự động hóa quy trình tài liệu dựa trên nội dung tài liệu"},{"k":"D","vi":"cải thiện độ chính xác của mô hình bằng cách tinh chỉnh (fine-tune) dữ liệu tổ chức"}],"exp":"Azure AI Search cho phép truy vấn và truy xuất thông tin từ các kho dữ liệu lớn, và là thành phần truy xuất then chốt trong kiến trúc RAG để nền tảng hóa (grounding) câu trả lời của AI. Lựa chọn A sai vì mục đích chính là tham chiếu dữ liệu hiện có, C mô tả tự động hóa quy trình (không phải Search), còn D là fine-tuning không phải chức năng của Azure AI Search.","cite":"https://learn.microsoft.com/en-us/azure/search/search-what-is-azure-search","conf":"H"},{"id":"2-13","t":2,"n":13,"kind":"mcq","multi":1,"stem":"You are exploring how Microsoft 365 Copilot uses Microsoft Graph to deliver AI-powered experiences.\nWhich information in Microsoft Graph can Copilot use by default?","opts":[{"k":"A","en":"emails, files, meetings, and chats in Microsoft 365"},{"k":"B","en":"data stored in a file share"},{"k":"C","en":"social media activity"},{"k":"D","en":"content from public websites"}],"answer":["A"],"suggested":"A","vote":"Not available","votepct":"","vi":"Bạn đang tìm hiểu cách Microsoft 365 Copilot sử dụng Microsoft Graph để cung cấp các trải nghiệm hỗ trợ bởi AI.\nThông tin nào trong Microsoft Graph mà Copilot có thể sử dụng theo mặc định?","opts_vi":[{"k":"A","vi":"email, tệp, cuộc họp và cuộc trò chuyện trong Microsoft 365"},{"k":"B","vi":"dữ liệu lưu trữ trong một file share"},{"k":"C","vi":"hoạt động trên mạng xã hội"},{"k":"D","vi":"nội dung từ các trang web công cộng"}],"exp":"Theo mặc định, Microsoft 365 Copilot sử dụng dữ liệu công việc của người dùng trong Microsoft Graph, gồm email, tệp, cuộc họp và cuộc trò chuyện trong Microsoft 365 (tuân theo quyền truy cập hiện có). File share tại chỗ, mạng xã hội và trang web công cộng không thuộc dữ liệu Graph mặc định (một số cần Copilot connectors để tích hợp).","cite":"https://learn.microsoft.com/en-us/copilot/microsoft-365/microsoft-365-copilot-overview","conf":"H"},{"id":"2-14","t":2,"n":14,"kind":"mcq","multi":1,"stem":"You need to recommend a service that supports indexing information and knowledge mining by extracting insights from documents.\nWhat should you recommend?","opts":[{"k":"A","en":"Microsoft Foundry"},{"k":"B","en":"Azure Vision in Foundry Tools"},{"k":"C","en":"Azure Document Intelligence in Foundry Tools"},{"k":"D","en":"Azure AI Search"}],"answer":["D"],"suggested":"D","vote":"D","votepct":"10/10 votes, 100%","vi":"Bạn cần đề xuất một dịch vụ hỗ trợ lập chỉ mục thông tin và khai thác tri thức (knowledge mining) bằng cách trích xuất thông tin chi tiết từ tài liệu.\nBạn nên đề xuất gì?","opts_vi":[{"k":"A","vi":"Microsoft Foundry"},{"k":"B","vi":"Azure Vision trong Foundry Tools"},{"k":"C","vi":"Azure Document Intelligence trong Foundry Tools"},{"k":"D","vi":"Azure AI Search"}],"exp":"Azure AI Search là dịch vụ dùng để lập chỉ mục thông tin và khai thác tri thức (knowledge mining), trích xuất thông tin chi tiết từ tập tài liệu lớn để phục vụ tìm kiếm. Microsoft Foundry là nền tảng phát triển AI tổng thể, Azure Vision xử lý hình ảnh, còn Document Intelligence trích xuất dữ liệu từ biểu mẫu/hóa đơn chứ không phải công cụ knowledge mining tổng quát.","cite":"https://learn.microsoft.com/en-us/azure/search/search-what-is-azure-search","conf":"H"},{"id":"2-15","t":2,"n":15,"kind":"drag","stem":"Match the business scenario to the appropriate AI solution design approach.\nTo answer, drag the AI solution from the column on the left to its business scenario on the right. Each solution may be used once, more than once, or not at all.\nNOTE: Each correct match is worth one point.","items":["Build with Azure Machine Learning","Build with Microsoft Copilot Studio","Extend with Microsoft 365 Copilot connectors","Use Microsoft 365 Copilot"],"targets":[{"label":"The marketing department at your company wants AI to summarize emails and create presentations.","ans":3},{"label":"The HR department at your company wants a conversational agent for policy questions and leave requests.","ans":1},{"label":"The manufacturing department at your company wants AI to predict maintenance schedules.","ans":0},{"label":"The finance department at your company wants AI-powered access to enterprise resource planning (ERP) data by using familiar productivity tools.","ans":2}],"suggested":"Marketing = Use Microsoft 365 Copilot; HR = Build with Microsoft Copilot Studio; Manufacturing = Build with Azure Machine Learning; Finance = Extend with Microsoft 365 Copilot connectors (Community comment - 16 upvotes)","vote":"Not available","votepct":"","vi":"Ghép kịch bản kinh doanh với phương pháp thiết kế giải pháp AI phù hợp.\nĐể trả lời, kéo giải pháp AI từ cột bên trái sang kịch bản kinh doanh của nó ở bên phải. Mỗi giải pháp có thể được dùng một lần, nhiều lần hoặc không dùng.\nLƯU Ý: Mỗi ghép nối đúng có giá trị một điểm.","items_vi":["Xây dựng bằng Azure Machine Learning","Xây dựng bằng Microsoft Copilot Studio","Mở rộng bằng Microsoft 365 Copilot connectors","Sử dụng Microsoft 365 Copilot"],"targets_vi":["Bộ phận tiếp thị của công ty bạn muốn AI tóm tắt email và tạo bản trình bày.","Bộ phận nhân sự của công ty bạn muốn một tác nhân hội thoại cho các câu hỏi về chính sách và yêu cầu nghỉ phép.","Bộ phận sản xuất của công ty bạn muốn AI dự đoán lịch bảo trì.","Bộ phận tài chính của công ty bạn muốn truy cập dữ liệu ERP bằng AI thông qua các công cụ năng suất quen thuộc."],"exp":"Tiếp thị (tóm tắt email, tạo slide) là năng lực sẵn có của Microsoft 365 Copilot. Nhân sự cần tác nhân hội thoại tùy chỉnh cho FAQ/nghỉ phép nên phù hợp Copilot Studio. Sản xuất cần dự đoán (mô hình dự báo) nên dùng Azure Machine Learning. Tài chính muốn truy cập dữ liệu ERP (nguồn ngoài) qua công cụ quen thuộc nên mở rộng bằng Microsoft 365 Copilot connectors.","cite":"https://learn.microsoft.com/en-us/copilot/microsoft-365/microsoft-365-copilot-overview","conf":"H"},{"id":"2-16","t":2,"n":16,"kind":"drop","stem":"Select the answer that correctly completes the sentence.","parts":[{"pre":"Microsoft 365 Copilot can be used to","post":"","choices":["monitor network traffic and alerts in real time.","create a Microsoft Word document.","create a list in Microsoft SharePoint.","modify administrative permissions for Microsoft SharePoint files."],"ans":1}],"suggested":"create a Microsoft Word document. (Community comment - 2 upvotes)","vote":"Not available","votepct":"","vi":"Chọn câu trả lời hoàn thành đúng câu.","parts_vi":[{"pre_vi":"Microsoft 365 Copilot có thể được dùng để","post_vi":"","choices_vi":["giám sát lưu lượng mạng và cảnh báo theo thời gian thực.","tạo một tài liệu Microsoft Word.","tạo một danh sách trong Microsoft SharePoint.","sửa đổi quyền quản trị cho các tệp Microsoft SharePoint."]}],"exp":"Microsoft 365 Copilot tích hợp trong bộ ứng dụng năng suất và có thể tạo/soạn thảo nội dung như một tài liệu Microsoft Word. Giám sát mạng thuộc lĩnh vực an ninh/vận hành, còn tạo danh sách SharePoint và sửa đổi quyền quản trị là các tác vụ quản trị/cấu hình không thuộc năng lực tạo nội dung của Microsoft 365 Copilot.","cite":"https://learn.microsoft.com/en-us/copilot/microsoft-365/microsoft-365-copilot-overview","conf":"M"},{"id":"2-17","t":2,"n":17,"kind":"yesno","stem":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.","statements":[{"text":"Microsoft Foundry provides a unified platform for developers and data professionals to create custom end-to-end AI solutions.","ans":"Y"},{"text":"Microsoft Foundry provides a unified platform for low-code developers and business users to create custom end-to-end AI solutions.","ans":"N"},{"text":"You need a Microsoft 365 Copilot license to access Microsoft Foundry services.","ans":"N"}],"suggested":"Yes, No, No (Community comment - 9 upvotes)","vote":"Not available","votepct":"","vi":"Với mỗi phát biểu sau, chọn Yes nếu phát biểu đúng. Nếu không, chọn No.\nLƯU Ý: Mỗi lựa chọn đúng có giá trị một điểm.","statements_vi":["Microsoft Foundry cung cấp một nền tảng thống nhất cho các nhà phát triển và chuyên gia dữ liệu để tạo các giải pháp AI đầu-cuối tùy chỉnh.","Microsoft Foundry cung cấp một nền tảng thống nhất cho các nhà phát triển low-code và người dùng nghiệp vụ để tạo các giải pháp AI đầu-cuối tùy chỉnh.","Bạn cần giấy phép Microsoft 365 Copilot để truy cập các dịch vụ của Microsoft Foundry."],"exp":"Câu 1 đúng (Yes): Microsoft Foundry là nền tảng thống nhất dành cho nhà phát triển và chuyên gia dữ liệu xây dựng giải pháp AI đầu-cuối. Câu 2 sai (No): Foundry hướng đến nhà phát triển chuyên nghiệp (pro-code), không phải người dùng low-code/nghiệp vụ (đó là hướng của Copilot Studio/Power Platform). Câu 3 sai (No): Foundry không yêu cầu giấy phép Microsoft 365 Copilot.","cite":"https://learn.microsoft.com/en-us/azure/ai-foundry/what-is-azure-ai-foundry","conf":"H"},{"id":"2-18","t":2,"n":18,"kind":"mcq","multi":1,"stem":"Your company is preparing to adopt Microsoft 365 Copilot and wants to follow Microsoft responsible AI principles.\nAs a business leader, you propose establishing an AI governance council to ensure alignment with the responsible AI principles.\nWhat is the primary purpose of the council? More than one answer choice may achieve the goal. Select the BEST answer.","opts":[{"k":"A","en":"to monitor user behavior and enforce compliance with internal IT policies"},{"k":"B","en":"to train employees on how to use Copilot features effectively"},{"k":"C","en":"to oversee implementation, manage technical performance, and ensure successful AI deployment"},{"k":"D","en":"to guide strategy, provide oversight, and ensure cross-functional alignment for responsible AI adoption"}],"answer":["D"],"suggested":"D","vote":"Not available","votepct":"","vi":"Công ty của bạn đang chuẩn bị áp dụng Microsoft 365 Copilot và muốn tuân theo các nguyên tắc AI có trách nhiệm của Microsoft.\nLà một lãnh đạo doanh nghiệp, bạn đề xuất thành lập một hội đồng quản trị AI (AI governance council) để đảm bảo sự phù hợp với các nguyên tắc AI có trách nhiệm.\nMục đích chính của hội đồng là gì? Có thể có nhiều lựa chọn đạt được mục tiêu. Hãy chọn câu trả lời TỐT NHẤT.","opts_vi":[{"k":"A","vi":"giám sát hành vi người dùng và thực thi việc tuân thủ các chính sách CNTT nội bộ"},{"k":"B","vi":"đào tạo nhân viên cách sử dụng các tính năng Copilot một cách hiệu quả"},{"k":"C","vi":"giám sát việc triển khai, quản lý hiệu năng kỹ thuật và đảm bảo triển khai AI thành công"},{"k":"D","vi":"định hướng chiến lược, cung cấp giám sát và đảm bảo sự phối hợp liên chức năng cho việc áp dụng AI có trách nhiệm"}],"exp":"Mục đích chính của hội đồng quản trị AI là định hướng chiến lược, cung cấp sự giám sát (oversight) và đảm bảo phối hợp liên chức năng để áp dụng AI có trách nhiệm ở cấp tổ chức. Các lựa chọn A, B, C mang tính vận hành/chiến thuật (giám sát người dùng, đào tạo, quản lý kỹ thuật) chứ không phải vai trò định hướng và quản trị cấp cao của hội đồng.","cite":"https://learn.microsoft.com/en-us/azure/cloud-adoption-framework/scenarios/ai/govern","conf":"H"},{"id":"2-19","t":2,"n":19,"kind":"yesno","stem":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.","statements":[{"text":"Microsoft 365 Copilot can amplify existing data governance challenges.","ans":"Y"},{"text":"Implementing Microsoft 365 Copilot reduces data management costs.","ans":"N"},{"text":"Microsoft 365 Copilot can help IT teams manage data risks.","ans":"Y"}],"suggested":"Yes, No, Yes (Community comment - 10 upvotes)","vote":"Not available","votepct":"","vi":"Với mỗi phát biểu sau, chọn Yes nếu phát biểu đúng. Nếu không, chọn No.\nLƯU Ý: Mỗi lựa chọn đúng có giá trị một điểm.","statements_vi":["Microsoft 365 Copilot có thể khuếch đại các thách thức quản trị dữ liệu hiện có.","Việc triển khai Microsoft 365 Copilot làm giảm chi phí quản lý dữ liệu.","Microsoft 365 Copilot có thể giúp các nhóm CNTT quản lý các rủi ro dữ liệu."],"exp":"Câu 1 đúng (Yes): Copilot có thể làm lộ rõ và khuếch đại các vấn đề quản trị dữ liệu sẵn có (ví dụ quyền truy cập quá rộng, dữ liệu phân loại kém). Câu 2 sai (No): Copilot không được thiết kế để giảm chi phí quản lý dữ liệu; thực tế còn đòi hỏi đầu tư vào quản trị. Câu 3 đúng (Yes): kết hợp với các công cụ như Purview, Copilot có thể giúp nhóm CNTT quản lý rủi ro dữ liệu.","cite":"https://learn.microsoft.com/en-us/copilot/microsoft-365/microsoft-365-copilot-privacy","conf":"M"},{"id":"2-20","t":2,"n":20,"kind":"drop","stem":"Select the answer that correctly completes the sentence.","parts":[{"pre":"An organization that runs continuous, large-scale workloads with Azure OpenAI models should choose the","post":"pricing model.","choices":["Batch API","Provisioned (PTUs)","Standard (On-Demand)"],"ans":1}],"suggested":"Provisioned (PTUs) (Community comment - 6 upvotes)","vote":"Not available","votepct":"","vi":"Một tổ chức chạy các workload liên tục, quy mô lớn với các model Azure OpenAI nên chọn mô hình định giá ___.","parts_vi":[{"pre_vi":"Một tổ chức chạy các workload liên tục, quy mô lớn với các model Azure OpenAI nên chọn mô hình định giá","post_vi":".","choices_vi":["Batch API","Provisioned (PTUs)","Standard (On-Demand)"]}],"exp":"Provisioned (PTUs) dành riêng công suất xử lý cố định, mang lại thông lượng ổn định và độ trễ có thể dự đoán cho các workload liên tục, quy mô lớn. Standard (On-Demand) tính phí theo token phù hợp với lưu lượng biến động, còn Batch API tối ưu cho xử lý bất đồng bộ theo lô. Vì vậy PTU là lựa chọn kinh tế và ổn định nhất cho khối lượng lớn liên tục.","cite":"https://learn.microsoft.com/en-us/azure/ai-services/openai/how-to/provisioned-throughput-onboarding","conf":"H"},{"id":"2-21","t":2,"n":21,"kind":"mcq","multi":1,"stem":"Your company sells hiking and camping gear online.\nYou need a generative AI solution that can interact with customers and ask questions about their needs.\nWhat should you include in the solution?","opts":[{"k":"A","en":"a chatbot"},{"k":"B","en":"predictive AI"},{"k":"C","en":"computer vision"},{"k":"D","en":"a recommendation engine"}],"answer":["A"],"suggested":"A","vote":"Not available","votepct":"","vi":"Công ty của bạn bán đồ leo núi và cắm trại trực tuyến. Bạn cần một giải pháp generative AI có thể tương tác với khách hàng và hỏi về nhu cầu của họ. Bạn nên đưa gì vào giải pháp?","opts_vi":[{"k":"A","vi":"một chatbot"},{"k":"B","vi":"predictive AI"},{"k":"C","vi":"computer vision"},{"k":"D","vi":"một recommendation engine (công cụ đề xuất)"}],"exp":"Chatbot là giải pháp generative AI hội thoại có thể tương tác trực tiếp với khách hàng và đặt câu hỏi về nhu cầu của họ bằng ngôn ngữ tự nhiên. Predictive AI dùng để dự đoán, computer vision xử lý hình ảnh, còn recommendation engine chỉ gợi ý sản phẩm chứ không hội thoại tự nhiên.","cite":"https://learn.microsoft.com/en-us/microsoft-copilot-studio/fundamentals-what-is-copilot-studio","conf":"H"},{"id":"2-22","t":2,"n":22,"kind":"yesno","stem":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.","statements":[{"text":"Content filtering controls can prevent AI-generated responses from exposing confidential and sensitive information.","ans":"Y"},{"text":"AI-generated content can unintentionally reveal sensitive information if the generative AI model has access to unsecured data sources.","ans":"Y"},{"text":"To prevent data exposure, only the prompts used by users must be protected by using policies.","ans":"N"}],"suggested":"Yes, Yes, No (Community comment - 3 upvotes)","vote":"Not available","votepct":"","vi":"Với mỗi phát biểu sau, chọn Yes nếu phát biểu đúng, ngược lại chọn No.","statements_vi":["Các kiểm soát content filtering có thể ngăn phản hồi do AI tạo ra làm lộ thông tin bí mật và nhạy cảm.","Nội dung do AI tạo ra có thể vô tình để lộ thông tin nhạy cảm nếu generative AI model có quyền truy cập vào các nguồn dữ liệu không được bảo mật.","Để ngăn lộ dữ liệu, chỉ cần bảo vệ các prompt mà người dùng sử dụng bằng chính sách là đủ."],"exp":"Content filtering giúp kiểm soát và ngăn phản hồi để lộ nội dung nhạy cảm (Yes), và nếu model truy cập nguồn dữ liệu không bảo mật thì có thể vô tình để lộ thông tin (Yes). Tuy nhiên, bảo vệ dữ liệu không chỉ giới hạn ở prompt của người dùng mà còn phải bảo vệ nguồn dữ liệu, đầu ra và toàn bộ luồng xử lý, nên phát biểu thứ ba là No.","cite":"https://learn.microsoft.com/en-us/azure/ai-services/openai/concepts/content-filter","conf":"H"},{"id":"2-23","t":2,"n":23,"kind":"mcq","multi":1,"stem":"You have a historical dataset that contains 1,000 records.\nYou need an AI solution that can analyze the data to identify patterns and predict future outcomes.\nWhat should you include in the solution?","opts":[{"k":"A","en":"Microsoft Foundry"},{"k":"B","en":"Azure Document Intelligence in Foundry Tools"},{"k":"C","en":"Azure Machine Learning"},{"k":"D","en":"Azure Content Understanding in Foundry Tools"}],"answer":["C"],"suggested":"C","vote":"C","votepct":"5/5 votes, 100%","vi":"Bạn có một tập dữ liệu lịch sử gồm 1.000 bản ghi. Bạn cần một giải pháp AI có thể phân tích dữ liệu để nhận diện mẫu (pattern) và dự đoán kết quả tương lai. Bạn nên đưa gì vào giải pháp?","opts_vi":[{"k":"A","vi":"Microsoft Foundry"},{"k":"B","vi":"Azure Document Intelligence in Foundry Tools"},{"k":"C","vi":"Azure Machine Learning"},{"k":"D","vi":"Azure Content Understanding in Foundry Tools"}],"exp":"Azure Machine Learning là nền tảng phù hợp để huấn luyện model từ dữ liệu lịch sử nhằm nhận diện mẫu và dự đoán kết quả tương lai (predictive analytics). Document Intelligence chỉ trích xuất dữ liệu từ tài liệu, Content Understanding phân tích nội dung đa phương thức, còn Microsoft Foundry là nền tảng tổng thể chứ không phải công cụ dự đoán chuyên biệt.","cite":"https://learn.microsoft.com/en-us/azure/machine-learning/overview-what-is-azure-machine-learning","conf":"H"},{"id":"2-24","t":2,"n":24,"kind":"mcq","multi":1,"stem":"Your company manages an online catalog of office supplies.\nYou plan to use a generative AI solution to create product descriptions for your company's website. The solution must meet the following requirements:\nEnsure that the descriptions can be posted immediately after they are created.\nEnable the selection and inclusion of product details in each description.\nBe fast and simple for non-technical staff to use.\nWhat is the best type of solution to use? More than one answer choice may achieve the goal. Select the BEST answer.","opts":[{"k":"A","en":"custom Azure Machine Learning model"},{"k":"B","en":"the Researcher agent in Microsoft 365 Copilot"},{"k":"C","en":"an interactive AI agent"},{"k":"D","en":"a fine-tuned large language model (LLM)"}],"answer":["C"],"suggested":"C","vote":"C","votepct":"9/9 votes, 100%","vi":"Công ty của bạn quản lý một danh mục văn phòng phẩm trực tuyến. Bạn dự định dùng một giải pháp generative AI để tạo mô tả sản phẩm cho website. Giải pháp phải: đảm bảo mô tả có thể đăng ngay sau khi tạo; cho phép chọn và đưa các chi tiết sản phẩm vào từng mô tả; nhanh và đơn giản cho nhân viên không chuyên kỹ thuật. Loại giải pháp tốt nhất là gì?","opts_vi":[{"k":"A","vi":"custom Azure Machine Learning model (model tùy chỉnh)"},{"k":"B","vi":"Researcher agent trong Microsoft 365 Copilot"},{"k":"C","vi":"một interactive AI agent (tác nhân AI tương tác)"},{"k":"D","vi":"một fine-tuned large language model (LLM)"}],"exp":"Một interactive AI agent cho phép người dùng không chuyên kỹ thuật chọn chi tiết sản phẩm, tạo mô tả nhanh và đăng ngay, đáp ứng cả ba yêu cầu. Custom Azure ML model và fine-tuned LLM đòi hỏi chuyên môn kỹ thuật cao và thời gian phát triển, còn Researcher agent dùng để nghiên cứu thông tin chuyên sâu chứ không phải tạo mô tả sản phẩm hàng loạt.","cite":"https://learn.microsoft.com/en-us/microsoft-copilot-studio/fundamentals-what-is-copilot-studio","conf":"M"},{"id":"2-25","t":2,"n":25,"kind":"mcq","multi":2,"stem":"Your company has an AI solution that uses a prebuilt Azure OpenAI model to generate content.\nYou need to reduce the cost of solution while minimizing the impact on the quality of the generated output.\nWhich two actions should you perform? Each correct answer presents part of the solution.\nNOTE: Each correct selection is worth one point.","opts":[{"k":"A","en":"Switch to an alternate model."},{"k":"B","en":"Apply content moderation."},{"k":"C","en":"Optimize the prompts."},{"k":"D","en":"Decrease the number of hosting hours for the model."},{"k":"E","en":"Fine-tune the existing model."}],"answer":["A","C"],"suggested":"A","vote":"AC","votepct":"5/5 votes, 100%","vi":"Công ty của bạn có một giải pháp AI dùng model Azure OpenAI dựng sẵn để tạo nội dung. Bạn cần giảm chi phí giải pháp trong khi giảm thiểu tác động đến chất lượng đầu ra. Bạn nên thực hiện hai hành động nào?","opts_vi":[{"k":"A","vi":"Chuyển sang một model thay thế."},{"k":"B","vi":"Áp dụng kiểm duyệt nội dung (content moderation)."},{"k":"C","vi":"Tối ưu hóa các prompt."},{"k":"D","vi":"Giảm số giờ hosting cho model."},{"k":"E","vi":"Fine-tune model hiện có."}],"exp":"Chuyển sang một model thay thế (A) rẻ hơn nhưng vẫn đủ năng lực giúp giảm chi phí theo token mà ít ảnh hưởng chất lượng. Tối ưu hóa prompt (C) làm ngắn gọn đầu vào và đầu ra, giảm số token tiêu thụ nên giảm chi phí. Content moderation và fine-tuning làm tăng chi phí, còn model Azure OpenAI trả phí theo token chứ không theo giờ hosting.","cite":"https://learn.microsoft.com/en-us/azure/ai-services/openai/how-to/manage-costs","conf":"M"},{"id":"2-26","t":2,"n":26,"kind":"drop","stem":"You need to recommend an AI solution for each task. The solutions must use prebuilt AI capabilities to reduce development time.\nWhat should you recommend for each task? To answer, select the appropriate options in the answer area.\nNOTE: Each correct selection is worth one point.","parts":[{"pre":"Extract information from invoices and credit notes:","post":"","choices":["Azure AI Search","Azure Document Intelligence in Foundry Tools","Azure Machine Learning"],"ans":1},{"pre":"Identify discussion topics in customer service call recordings:","post":"","choices":["Azure Content Understanding in Foundry Tools","Azure Speech in Foundry Tools","Azure Document Intelligence in Foundry Tools"],"ans":1},{"pre":"Detect customer sentiment and opinions:","post":"","choices":["Azure Language in Foundry Tools","Azure Machine Learning","Azure Document Intelligence in Foundry Tools"],"ans":0}],"suggested":"Document Intelligence; Speech; Language (Community comment - 3 upvotes)","vote":"Not available","votepct":"","vi":"Bạn cần đề xuất một giải pháp AI cho mỗi tác vụ. Các giải pháp phải dùng năng lực AI dựng sẵn để giảm thời gian phát triển. Bạn nên đề xuất gì cho mỗi tác vụ?","parts_vi":[{"pre_vi":"Trích xuất thông tin từ hóa đơn và giấy báo có (credit notes):","post_vi":"","choices_vi":["Azure AI Search","Azure Document Intelligence in Foundry Tools","Azure Machine Learning"]},{"pre_vi":"Nhận diện chủ đề thảo luận trong bản ghi âm cuộc gọi dịch vụ khách hàng:","post_vi":"","choices_vi":["Azure Content Understanding in Foundry Tools","Azure Speech in Foundry Tools","Azure Document Intelligence in Foundry Tools"]},{"pre_vi":"Phát hiện cảm xúc (sentiment) và ý kiến của khách hàng:","post_vi":"","choices_vi":["Azure Language in Foundry Tools","Azure Machine Learning","Azure Document Intelligence in Foundry Tools"]}],"exp":"Azure Document Intelligence trích xuất dữ liệu có cấu trúc từ hóa đơn và giấy báo có. Azure Speech chuyển giọng nói thành văn bản để nhận diện chủ đề trong bản ghi âm cuộc gọi. Azure Language cung cấp phân tích cảm xúc và ý kiến (sentiment analysis / opinion mining) từ văn bản khách hàng.","cite":"https://learn.microsoft.com/en-us/azure/ai-services/document-intelligence/overview","conf":"H"},{"id":"2-27","t":2,"n":27,"kind":"mcq","multi":2,"stem":"Your company purchases Microsoft 365 Copilot for its sales department.\nThe sales department needs to find and summarize information across internal documents quickly.\nFrom which two data sources can the sales department obtain results by default? Each correct answer presents part of the solution.\nNOTE: Each correct selection is worth one point.","opts":[{"k":"A","en":"Microsoft OneDrive"},{"k":"B","en":"an on-premises file share"},{"k":"C","en":"Microsoft SharePoint"},{"k":"D","en":"Microsoft Sway"},{"k":"E","en":"a custom customer relationship management (CRM) system"}],"answer":["A","C"],"suggested":"A","vote":"Not available","votepct":"","vi":"Công ty của bạn mua Microsoft 365 Copilot cho bộ phận bán hàng. Bộ phận này cần nhanh chóng tìm và tóm tắt thông tin trong các tài liệu nội bộ. Theo mặc định, bộ phận bán hàng có thể lấy kết quả từ hai nguồn dữ liệu nào?","opts_vi":[{"k":"A","vi":"Microsoft OneDrive"},{"k":"B","vi":"một file share tại chỗ (on-premises)"},{"k":"C","vi":"Microsoft SharePoint"},{"k":"D","vi":"Microsoft Sway"},{"k":"E","vi":"một hệ thống CRM tùy chỉnh"}],"exp":"Theo mặc định, Microsoft 365 Copilot truy cập dữ liệu trong Microsoft Graph, bao gồm các tệp lưu trên OneDrive (A) và SharePoint (C). File share tại chỗ và hệ thống CRM tùy chỉnh cần Copilot connectors mới truy cập được, còn Sway không phải nguồn dữ liệu mặc định cho việc tìm và tóm tắt tài liệu.","cite":"https://learn.microsoft.com/en-us/microsoft-365-copilot/microsoft-365-copilot-overview","conf":"H"},{"id":"2-28","t":2,"n":28,"kind":"yesno","stem":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.","statements":[{"text":"Microsoft Copilot in Outlook can automatically send follow-up replies to emails.","ans":"N"},{"text":"Microsoft Copilot in Outlook can identify and surface tasks mentioned in your emails.","ans":"Y"},{"text":"Microsoft Copilot in Outlook can summarize long email threads and highlight action items and deadlines.","ans":"Y"}],"suggested":"No, Yes, Yes (Community comment - 4 upvotes)","vote":"Not available","votepct":"","vi":"Với mỗi phát biểu sau, chọn Yes nếu phát biểu đúng, ngược lại chọn No.","statements_vi":["Microsoft Copilot trong Outlook có thể tự động gửi email trả lời tiếp theo (follow-up).","Microsoft Copilot trong Outlook có thể nhận diện và làm nổi bật các tác vụ được đề cập trong email của bạn.","Microsoft Copilot trong Outlook có thể tóm tắt các chuỗi email dài và làm nổi bật các mục hành động (action items) và thời hạn."],"exp":"Copilot trong Outlook hỗ trợ soạn thảo và gợi ý nhưng không tự động gửi email trả lời thay người dùng (No). Nó có thể nhận diện và làm nổi bật các tác vụ được đề cập trong email (Yes) và tóm tắt các chuỗi email dài kèm action items và thời hạn (Yes).","cite":"https://learn.microsoft.com/en-us/copilot/microsoft-365/microsoft-365-copilot-outlook","conf":"H"},{"id":"2-29","t":2,"n":29,"kind":"mcq","multi":1,"stem":"Your company's HR department spends a large amount time answering repetitive questions and updating policy documents.\nYou need a solution that can automate employee interactions, respond to HR-related questions, and connect to internal business data sources.\nWhat solution should you recommend?","opts":[{"k":"A","en":"Microsoft Security Copilot"},{"k":"B","en":"Microsoft Copilot Studio"},{"k":"C","en":"Microsoft 365 Copilot"},{"k":"D","en":"Microsoft Copilot in Azure"}],"answer":["B"],"suggested":"B","vote":"Not available","votepct":"","vi":"Bộ phận HR của công ty bạn tốn nhiều thời gian trả lời các câu hỏi lặp lại và cập nhật tài liệu chính sách. Bạn cần một giải pháp có thể tự động hóa tương tác với nhân viên, trả lời các câu hỏi liên quan HR, và kết nối tới các nguồn dữ liệu nghiệp vụ nội bộ. Bạn nên đề xuất giải pháp nào?","opts_vi":[{"k":"A","vi":"Microsoft Security Copilot"},{"k":"B","vi":"Microsoft Copilot Studio"},{"k":"C","vi":"Microsoft 365 Copilot"},{"k":"D","vi":"Microsoft Copilot in Azure"}],"exp":"Microsoft Copilot Studio cho phép xây dựng các agent hội thoại tùy chỉnh, tự động hóa tương tác với nhân viên và kết nối tới các nguồn dữ liệu nghiệp vụ nội bộ thông qua connector. Security Copilot dành cho an ninh, M365 Copilot là trợ lý dựng sẵn trong ứng dụng, còn Copilot in Azure hỗ trợ quản lý môi trường Azure.","cite":"https://learn.microsoft.com/en-us/microsoft-copilot-studio/fundamentals-what-is-copilot-studio","conf":"H"},{"id":"2-30","t":2,"n":30,"kind":"yesno","stem":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.","statements":[{"text":"Microsoft 365 Copilot helps users create and analyze content in Microsoft 365 apps.","ans":"Y"},{"text":"Microsoft Copilot Studio can only be used to customize Microsoft 365 Copilot.","ans":"N"},{"text":"Microsoft Security Copilot uses AI to assign sensitivity labels to documents.","ans":"N"}],"suggested":"Yes, No, No (Community comment - 4 upvotes)","vote":"Not available","votepct":"","vi":"Với mỗi phát biểu sau, chọn Yes nếu phát biểu đúng, ngược lại chọn No.","statements_vi":["Microsoft 365 Copilot giúp người dùng tạo và phân tích nội dung trong các ứng dụng Microsoft 365.","Microsoft Copilot Studio chỉ có thể dùng để tùy chỉnh Microsoft 365 Copilot.","Microsoft Security Copilot dùng AI để gán nhãn nhạy cảm (sensitivity labels) cho tài liệu."],"exp":"M365 Copilot giúp tạo và phân tích nội dung trong các ứng dụng Microsoft 365 (Yes). Copilot Studio không chỉ để tùy chỉnh M365 Copilot mà còn xây dựng agent độc lập (No). Việc gán nhãn nhạy cảm cho tài liệu thuộc Microsoft Purview chứ không phải Security Copilot (No).","cite":"https://learn.microsoft.com/en-us/microsoft-365-copilot/microsoft-365-copilot-overview","conf":"H"},{"id":"2-31","t":2,"n":31,"kind":"yesno","stem":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.","statements":[{"text":"Microsoft 365 Copilot can help users compose professional emails and summarize conversations.","ans":"Y"},{"text":"When prompted, Microsoft 365 Copilot can autonomously update a spreadsheet that contains sales data.","ans":"N"},{"text":"Microsoft 365 Copilot can summarize recent updates in business documents, spreadsheets, and presentations.","ans":"Y"}],"suggested":"Yes, No, Yes (Community comment - 6 upvotes)","vote":"Not available","votepct":"","vi":"Với mỗi phát biểu sau, chọn Yes nếu phát biểu đúng, ngược lại chọn No.","statements_vi":["Microsoft 365 Copilot có thể giúp người dùng soạn email chuyên nghiệp và tóm tắt các cuộc hội thoại.","Khi được yêu cầu, Microsoft 365 Copilot có thể tự động (autonomously) cập nhật một bảng tính chứa dữ liệu bán hàng.","Microsoft 365 Copilot có thể tóm tắt các cập nhật gần đây trong tài liệu nghiệp vụ, bảng tính và bài trình bày."],"exp":"M365 Copilot hỗ trợ soạn email chuyên nghiệp và tóm tắt hội thoại (Yes), đồng thời tóm tắt các cập nhật gần đây trong tài liệu, bảng tính và bài trình bày (Yes). Tuy nhiên Copilot hỗ trợ người dùng theo yêu cầu chứ không tự động cập nhật bảng tính một cách độc lập (No).","cite":"https://learn.microsoft.com/en-us/microsoft-365-copilot/microsoft-365-copilot-overview","conf":"H"},{"id":"2-32","t":2,"n":32,"kind":"drop","stem":"Select the answer that correctly completes the sentence.","parts":[{"pre":"","post":"can analyze internal documents to detect Personally Identifiable Information (PII) and redact the PII from the output.","choices":["Azure Language in Foundry Tools","Azure AI Search","Azure Vision in Foundry Tools","Azure Document Intelligence in Foundry Tools"],"ans":0}],"suggested":"Azure Language in Foundry Tools (Community comment - 2 upvotes)","vote":"Not available","votepct":"","vi":"Chọn đáp án hoàn thành đúng câu.","parts_vi":[{"pre_vi":"","post_vi":"có thể phân tích tài liệu nội bộ để phát hiện Thông tin nhận dạng cá nhân (PII) và ẩn (redact) PII khỏi đầu ra.","choices_vi":["Azure Language in Foundry Tools","Azure AI Search","Azure Vision in Foundry Tools","Azure Document Intelligence in Foundry Tools"]}],"exp":"Azure Language cung cấp tính năng phát hiện và ẩn Thông tin nhận dạng cá nhân (PII detection and redaction) trong văn bản. Azure AI Search dùng để lập chỉ mục và tìm kiếm, Azure Vision xử lý hình ảnh, còn Document Intelligence chủ yếu trích xuất dữ liệu có cấu trúc từ tài liệu.","cite":"https://learn.microsoft.com/en-us/azure/ai-services/language-service/personally-identifiable-information/overview","conf":"H"},{"id":"2-33","t":2,"n":33,"kind":"mcq","multi":1,"stem":"Your company manages a website that publishes daily news articles.\nYou need to recommend an AI solution that can analyze text and identify the main people, locations, and companies mentioned in the articles.\nWhat should you include in the recommendation?","opts":[{"k":"A","en":"Azure Language in Foundry Tools"},{"k":"B","en":"Azure Vision in Foundry Tools"},{"k":"C","en":"Content Safety in Foundry Control Plane"},{"k":"D","en":"Azure Speech in Foundry Tools"}],"answer":["A"],"suggested":"A","vote":"Not available","votepct":"","vi":"Công ty của bạn quản lý một website đăng tin tức hàng ngày. Bạn cần đề xuất một giải pháp AI có thể phân tích văn bản và nhận diện các nhân vật, địa điểm và công ty chính được đề cập trong các bài báo. Bạn nên đưa gì vào đề xuất?","opts_vi":[{"k":"A","vi":"Azure Language in Foundry Tools"},{"k":"B","vi":"Azure Vision in Foundry Tools"},{"k":"C","vi":"Content Safety in Foundry Control Plane"},{"k":"D","vi":"Azure Speech in Foundry Tools"}],"exp":"Azure Language cung cấp tính năng Named Entity Recognition (NER) để nhận diện các thực thể như con người, địa điểm và tổ chức/công ty trong văn bản. Azure Vision xử lý hình ảnh, Content Safety kiểm duyệt nội dung độc hại, còn Azure Speech xử lý giọng nói.","cite":"https://learn.microsoft.com/en-us/azure/ai-services/language-service/named-entity-recognition/overview","conf":"H"},{"id":"2-34","t":2,"n":34,"kind":"drag","stem":"Match the business processes to the appropriate Microsoft Copilot solutions.\nTo answer, drag the Copilot solution from the column on the left to its business process on the right. Each solution may be used once, more than once, or not at all.\nNOTE: Each correct match is worth one point.","items":["Copilot in Power Automate","GitHub Copilot","Microsoft 365 Copilot","Microsoft Copilot Studio"],"targets":[{"label":"Creating financial summaries and visual reports from Microsoft Excel workbooks.","ans":2},{"label":"Building an autonomous agent by using a low-code approach.","ans":3}],"suggested":"Microsoft 365 Copilot; Microsoft Copilot Studio (Community comment - 3 upvotes)","vote":"Not available","votepct":"","vi":"Ghép các quy trình nghiệp vụ với giải pháp Microsoft Copilot phù hợp. Kéo giải pháp Copilot từ cột bên trái sang quy trình nghiệp vụ tương ứng bên phải. Mỗi giải pháp có thể dùng một lần, nhiều lần hoặc không dùng.","items_vi":["Copilot in Power Automate","GitHub Copilot","Microsoft 365 Copilot","Microsoft Copilot Studio"],"targets_vi":["Tạo bản tóm tắt tài chính và báo cáo trực quan từ các workbook Microsoft Excel.","Xây dựng một autonomous agent (tác nhân tự động) bằng cách tiếp cận low-code."],"exp":"Microsoft 365 Copilot hoạt động trực tiếp trong Excel để tạo tóm tắt tài chính và báo cáo trực quan từ workbook. Microsoft Copilot Studio là nền tảng low-code để xây dựng các autonomous agent tùy chỉnh.","cite":"https://learn.microsoft.com/en-us/microsoft-copilot-studio/fundamentals-what-is-copilot-studio","conf":"H"},{"id":"2-35","t":2,"n":35,"kind":"yesno","stem":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.","statements":[{"text":"Microsoft 365 Copilot enables users to search across emails, files, chats, meetings, and connected apps, by using natural language queries.","ans":"Y"},{"text":"Microsoft 365 Copilot provides data protection, and helps ensure that user prompts and chat data are secure.","ans":"Y"},{"text":"Microsoft 365 Copilot is included in all Microsoft 365 subscriptions.","ans":"N"}],"suggested":"Yes, Yes, No (Community comment - 5 upvotes)","vote":"Not available","votepct":"","vi":"Với mỗi phát biểu sau, chọn Yes nếu phát biểu đúng, ngược lại chọn No.","statements_vi":["Microsoft 365 Copilot cho phép người dùng tìm kiếm qua email, tệp, cuộc trò chuyện, cuộc họp và các ứng dụng được kết nối bằng truy vấn ngôn ngữ tự nhiên.","Microsoft 365 Copilot cung cấp bảo vệ dữ liệu và giúp đảm bảo prompt của người dùng cùng dữ liệu chat được bảo mật.","Microsoft 365 Copilot được bao gồm trong tất cả các gói đăng ký Microsoft 365."],"exp":"M365 Copilot cho phép tìm kiếm bằng ngôn ngữ tự nhiên qua email, tệp, chat, cuộc họp và ứng dụng kết nối (Yes), đồng thời cung cấp bảo vệ dữ liệu cho prompt và dữ liệu chat (Yes). Tuy nhiên M365 Copilot là add-on license riêng, không được bao gồm trong mọi gói đăng ký Microsoft 365 (No).","cite":"https://learn.microsoft.com/en-us/microsoft-365-copilot/microsoft-365-copilot-overview","conf":"H"},{"id":"2-36","t":2,"n":36,"kind":"mcq","multi":2,"stem":"Your company is evaluating the use of Microsoft Copilot Studio to support business process automation and employee self-service.\nWhich two capabilities are directly supported in Copilot Studio? Each correct answer presents a complete solution.\nNOTE: Each correct selection is worth one point.","opts":[{"k":"A","en":"drafting and summarizing files in Microsoft Word and PowerPoint"},{"k":"B","en":"customizing agent behavior and responses"},{"k":"C","en":"using agents to identify and respond to security incidents"},{"k":"D","en":"building agents that connect to business data and automate user interactions"},{"k":"E","en":"configuring document security"}],"answer":["B","D"],"suggested":"B","vote":"BD","votepct":"11/11 votes, 100%","vi":"Công ty của bạn đang đánh giá việc dùng Microsoft Copilot Studio để hỗ trợ tự động hóa quy trình nghiệp vụ và tự phục vụ (self-service) của nhân viên. Hai năng lực nào được Copilot Studio hỗ trợ trực tiếp?","opts_vi":[{"k":"A","vi":"soạn thảo và tóm tắt tệp trong Microsoft Word và PowerPoint"},{"k":"B","vi":"tùy chỉnh hành vi và phản hồi của agent"},{"k":"C","vi":"dùng agent để nhận diện và phản ứng với sự cố an ninh"},{"k":"D","vi":"xây dựng agent kết nối tới dữ liệu nghiệp vụ và tự động hóa tương tác với người dùng"},{"k":"E","vi":"cấu hình bảo mật tài liệu"}],"exp":"Copilot Studio cho phép tùy chỉnh hành vi và phản hồi của agent (B) cũng như xây dựng các agent kết nối tới dữ liệu nghiệp vụ và tự động hóa tương tác với người dùng (D). Soạn thảo tệp Word/PowerPoint là chức năng của M365 Copilot, phản ứng sự cố an ninh thuộc Security Copilot, còn cấu hình bảo mật tài liệu thuộc Microsoft Purview.","cite":"https://learn.microsoft.com/en-us/microsoft-copilot-studio/fundamentals-what-is-copilot-studio","conf":"H"},{"id":"2-37","t":2,"n":37,"kind":"drop","stem":"Select the answer that correctly completes the sentence.","parts":[{"pre":"","post":"is a unified platform for enterprise AI development, where you can build, customize, evaluate, and manage AI apps and models.","choices":["Microsoft Foundry","Microsoft Power Platform","Azure Machine Learning"],"ans":0}],"suggested":"Microsoft Foundry (Community comment - 3 upvotes)","vote":"Not available","votepct":"","vi":"Chọn đáp án hoàn thành đúng câu.","parts_vi":[{"pre_vi":"","post_vi":"là một nền tảng thống nhất cho phát triển AI cấp doanh nghiệp, nơi bạn có thể xây dựng, tùy chỉnh, đánh giá và quản lý các ứng dụng và model AI.","choices_vi":["Microsoft Foundry","Microsoft Power Platform","Azure Machine Learning"]}],"exp":"Microsoft Foundry là nền tảng thống nhất cho phát triển AI cấp doanh nghiệp, hỗ trợ xây dựng, tùy chỉnh, đánh giá và quản lý các ứng dụng và model AI. Power Platform là nền tảng low-code tổng quát, còn Azure Machine Learning tập trung vào vòng đời machine learning chứ không phải nền tảng AI doanh nghiệp toàn diện này.","cite":"https://learn.microsoft.com/en-us/azure/ai-foundry/what-is-azure-ai-foundry","conf":"H"},{"id":"2-38","t":2,"n":38,"kind":"yesno","stem":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.","statements":[{"text":"You can use Azure Language in Foundry Tools to analyze the sentiment of customer reviews.","ans":"Y"},{"text":"You can use Azure Language in Foundry Tools to translate internal reports into multiple languages.","ans":"N"},{"text":"You can use Azure Language in Foundry Tools to extract text from scanned documents.","ans":"N"}],"suggested":"Yes, No, No (Community comment - 5 upvotes)","vote":"Not available","votepct":"","vi":"Với mỗi phát biểu sau, chọn Yes nếu phát biểu đúng, ngược lại chọn No.","statements_vi":["Bạn có thể dùng Azure Language in Foundry Tools để phân tích cảm xúc (sentiment) của các đánh giá khách hàng.","Bạn có thể dùng Azure Language in Foundry Tools để dịch các báo cáo nội bộ sang nhiều ngôn ngữ.","Bạn có thể dùng Azure Language in Foundry Tools để trích xuất văn bản từ các tài liệu được quét (scanned)."],"exp":"Azure Language cung cấp phân tích cảm xúc cho đánh giá khách hàng (Yes). Việc dịch ngôn ngữ do Azure Translator đảm nhận (No), còn trích xuất văn bản từ tài liệu quét (OCR) thuộc Azure Vision hoặc Document Intelligence chứ không phải Azure Language (No).","cite":"https://learn.microsoft.com/en-us/azure/ai-services/language-service/overview","conf":"H"},{"id":"3-1","t":3,"n":1,"kind":"yesno","stem":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.","statements":[{"text":"For a user to access organizational data from a mobile device, the user needs a Microsoft 365 Copilot license.","ans":"N"},{"text":"To reason over your organizational data by using Microsoft Graph, you need a Microsoft 365 Copilot license.","ans":"N"},{"text":"To use the Analyst agent, you need a Microsoft 365 Copilot license.","ans":"Y"}],"suggested":"No, No, Yes (Community comment - 4 upvotes)","vote":"Not available","votepct":"","vi":"Với mỗi phát biểu sau đây, chọn Yes nếu phát biểu đúng. Ngược lại, chọn No.\nLƯU Ý: Mỗi lựa chọn đúng được một điểm.","statements_vi":["Để người dùng truy cập dữ liệu của tổ chức từ thiết bị di động, người dùng cần có giấy phép Microsoft 365 Copilot.","Để suy luận trên dữ liệu tổ chức của bạn thông qua Microsoft Graph, bạn cần có giấy phép Microsoft 365 Copilot.","Để sử dụng Analyst agent, bạn cần có giấy phép Microsoft 365 Copilot."],"exp":"Truy cập dữ liệu tổ chức từ thiết bị di động và suy luận cơ bản trên Microsoft Graph không bắt buộc phải có giấy phép Microsoft 365 Copilot, nên hai phát biểu đầu là No. Ngược lại, các agent chuyên biệt như Analyst agent chỉ khả dụng cho người dùng có giấy phép Microsoft 365 Copilot, nên phát biểu thứ ba là Yes.","cite":"https://learn.microsoft.com/en-us/copilot/microsoft-365/microsoft-365-copilot-licensing","conf":"M"},{"id":"3-2","t":3,"n":2,"kind":"mcq","multi":1,"stem":"Your company plans to adopt AI across multiple business units.\nYou need to ensure that all AI projects align with the company's business strategy and are implemented responsibly.\nWhat is the best approach to achieve the goal? More than one answer choice may achieve the goal. Select the BEST answer.","opts":[{"k":"A","en":"Allow each department to deploy its own AI tools and workflows."},{"k":"B","en":"Delegate AI decision-making to the company's IT department."},{"k":"C","en":"Outsource AI development to an external vendor."},{"k":"D","en":"Establish an AI council to provide guidance, oversight, and coordination."}],"answer":["D"],"suggested":"D","vote":"Not available","votepct":"","vi":"Công ty của bạn dự định áp dụng AI trên nhiều đơn vị kinh doanh. Bạn cần đảm bảo rằng tất cả các dự án AI phù hợp với chiến lược kinh doanh của công ty và được triển khai một cách có trách nhiệm. Đâu là cách tiếp cận tốt nhất để đạt được mục tiêu? Có thể có nhiều lựa chọn đạt được mục tiêu. Chọn câu trả lời TỐT NHẤT.","opts_vi":["Cho phép mỗi phòng ban tự triển khai các công cụ và quy trình AI riêng.","Giao việc ra quyết định về AI cho phòng IT của công ty.","Thuê ngoài việc phát triển AI cho một nhà cung cấp bên ngoài.","Thành lập một hội đồng AI (AI council) để cung cấp định hướng, giám sát và điều phối."],"exp":"Việc thành lập một hội đồng AI (AI council) liên chức năng đảm bảo tất cả các sáng kiến AI được điều phối, giám sát và phù hợp với chiến lược kinh doanh cũng như các nguyên tắc AI có trách nhiệm. Các lựa chọn còn lại tạo ra sự phân mảnh, thiếu giám sát tổng thể hoặc mất kiểm soát, nên đáp án đúng là D.","cite":"https://learn.microsoft.com/en-us/microsoft-cloud/dev/copilot/isv/ai-governance","conf":"H"},{"id":"3-3","t":3,"n":3,"kind":"mcq","multi":1,"stem":"Your company has a Microsoft 365 subscription and uses Microsoft 365 Copilot Chat.\nSome users need to build and use declarative agents that can access work data.\nWhich type of license should you recommend for the users?","opts":[{"k":"A","en":"a Microsoft 365 Copilot add-on license"},{"k":"B","en":"Microsoft Copilot Studio user license"},{"k":"C","en":"a Copilot Chat pay-as-you-go plan"}],"answer":["B"],"suggested":"B","vote":"B","votepct":"6/13 votes, 46%","vi":"Công ty của bạn có gói đăng ký Microsoft 365 và sử dụng Microsoft 365 Copilot Chat. Một số người dùng cần xây dựng và sử dụng các declarative agent có thể truy cập dữ liệu công việc. Bạn nên đề xuất loại giấy phép nào cho những người dùng này?","opts_vi":["Giấy phép bổ sung (add-on) Microsoft 365 Copilot","Giấy phép người dùng Microsoft Copilot Studio","Gói trả tiền theo mức dùng (pay-as-you-go) của Copilot Chat"],"exp":"Đáp án đã xác minh là B (giấy phép người dùng Microsoft Copilot Studio) cho phép người dùng xây dựng và dùng declarative agent truy cập dữ liệu công việc. Tuy nhiên độ tin cậy thấp vì cộng đồng chỉ bình chọn 46% và lựa chọn C (Copilot Chat pay-as-you-go) cũng có cơ sở: việc xây dựng declarative agent truy cập dữ liệu công việc có thể thực hiện qua giấy phép Copilot Studio HOẶC qua mô hình pay-as-you-go. Đây là câu hỏi có tính mập mờ giữa hai phương án cấp phép.","cite":"https://learn.microsoft.com/en-us/microsoft-copilot-studio/requirements-licensing-subscriptions","conf":"L"},{"id":"3-4","t":3,"n":4,"kind":"yesno","stem":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.","statements":[{"text":"Allowing AI models to make autonomous decisions supports the Microsoft responsible AI principle of accountability.","ans":"N"},{"text":"Regularly testing AI models for fairness and inclusiveness helps ensure they align with Microsoft's Responsible AI principles.","ans":"Y"},{"text":"Protecting user data and limiting access to personal information supports the Microsoft responsible AI principles of privacy and security.","ans":"Y"}],"suggested":"No, Yes, Yes (Community comment - 2 upvotes)","vote":"Not available","votepct":"","vi":"Với mỗi phát biểu sau đây, chọn Yes nếu phát biểu đúng. Ngược lại, chọn No.\nLƯU Ý: Mỗi lựa chọn đúng được một điểm.","statements_vi":["Cho phép các mô hình AI đưa ra quyết định tự chủ hỗ trợ nguyên tắc trách nhiệm giải trình (accountability) của Microsoft responsible AI.","Thường xuyên kiểm thử các mô hình AI về tính công bằng (fairness) và tính bao trùm (inclusiveness) giúp đảm bảo chúng phù hợp với các nguyên tắc Responsible AI của Microsoft.","Bảo vệ dữ liệu người dùng và giới hạn quyền truy cập thông tin cá nhân hỗ trợ nguyên tắc quyền riêng tư và bảo mật (privacy and security) của Microsoft responsible AI."],"exp":"Nguyên tắc accountability đòi hỏi con người phải chịu trách nhiệm và duy trì sự kiểm soát đối với hệ thống AI, nên việc để AI ra quyết định hoàn toàn tự chủ đi ngược nguyên tắc này (No). Việc kiểm thử fairness/inclusiveness và bảo vệ dữ liệu cá nhân đều đúng với các nguyên tắc tương ứng, nên hai phát biểu sau là Yes.","cite":"https://learn.microsoft.com/en-us/azure/machine-learning/concept-responsible-ai","conf":"H"},{"id":"3-5","t":3,"n":5,"kind":"mcq","multi":1,"stem":"Your company plans to implement a proof of concept (PoC) agent that uses Azure OpenAI.\nThe solution must start small and provide flexibility to scale usage as demand grows.\nWhich pricing model should you use?","opts":[{"k":"A","en":"Microsoft 365 Copilot"},{"k":"B","en":"Batch API"},{"k":"C","en":"Provisioned (PTUs)"},{"k":"D","en":"Standard (On-Demand)"}],"answer":["D"],"suggested":"D","vote":"Not available","votepct":"","vi":"Công ty của bạn dự định triển khai một agent thử nghiệm (proof of concept - PoC) sử dụng Azure OpenAI. Giải pháp phải khởi đầu nhỏ và có tính linh hoạt để mở rộng mức sử dụng khi nhu cầu tăng lên. Bạn nên sử dụng mô hình định giá nào?","opts_vi":["Microsoft 365 Copilot","Batch API","Provisioned (PTUs)","Standard (On-Demand)"],"exp":"Mô hình Standard (On-Demand) tính phí theo token thực tế sử dụng, phù hợp để khởi đầu nhỏ với chi phí thấp và mở rộng linh hoạt khi nhu cầu tăng. Provisioned (PTUs) dành cho khối lượng công việc lớn, ổn định và liên tục nên không phù hợp cho PoC, do đó đáp án đúng là D.","cite":"https://learn.microsoft.com/en-us/azure/ai-foundry/openai/how-to/provisioned-throughput-onboarding","conf":"H"},{"id":"3-6","t":3,"n":6,"kind":"drop","stem":"Select the answer that correctly completes the sentence.","parts":[{"pre":"To ensure that your organization follows trustworthy AI principles, the organization should establish an AI governance council to","post":"","choices":["configure and deploy AI models in the organization's Azure environment.","guide AI strategy, ensure responsible AI oversight, and promote alignment across business units.","manage day-to-day model training and labeling tasks for AI development teams."],"ans":1}],"suggested":"guide AI strategy, ensure responsible AI oversight, and promote alignment across business units. (Community comment - 2 upvotes)","vote":"Not available","votepct":"","vi":"Chọn câu trả lời hoàn thành câu một cách chính xác.","parts_vi":[{"pre_vi":"Để đảm bảo tổ chức của bạn tuân theo các nguyên tắc AI đáng tin cậy (trustworthy AI), tổ chức nên thành lập một hội đồng quản trị AI (AI governance council) để","post_vi":"","choices_vi":["cấu hình và triển khai các mô hình AI trong môi trường Azure của tổ chức.","định hướng chiến lược AI, đảm bảo giám sát AI có trách nhiệm, và thúc đẩy sự thống nhất giữa các đơn vị kinh doanh.","quản lý các tác vụ huấn luyện và gán nhãn mô hình hằng ngày cho các nhóm phát triển AI."]}],"exp":"Hội đồng quản trị AI hoạt động ở tầm chiến lược và giám sát: định hướng chiến lược AI, đảm bảo trách nhiệm về responsible AI và tạo sự thống nhất liên đơn vị kinh doanh. Các lựa chọn còn lại là công việc kỹ thuật/vận hành hằng ngày chứ không phải chức năng của hội đồng quản trị, nên đáp án đúng là lựa chọn thứ hai.","cite":"https://learn.microsoft.com/en-us/microsoft-cloud/dev/copilot/isv/ai-governance","conf":"H"},{"id":"3-7","t":3,"n":7,"kind":"mcq","multi":1,"stem":"Your company deploys an AI-powered loan approval solution that enables applicants to request an explanation as to why their loan application was denied.\nWhich Microsoft responsible AI principle is this an example of?","opts":[{"k":"A","en":"fairness"},{"k":"B","en":"privacy and security"},{"k":"C","en":"transparency"},{"k":"D","en":"inclusiveness"}],"answer":["C"],"suggested":"C","vote":"Not available","votepct":"","vi":"Công ty của bạn triển khai một giải pháp AI phê duyệt khoản vay cho phép người nộp đơn yêu cầu giải thích lý do tại sao đơn xin vay của họ bị từ chối. Đây là ví dụ về nguyên tắc Microsoft responsible AI nào?","opts_vi":["công bằng (fairness)","quyền riêng tư và bảo mật (privacy and security)","minh bạch (transparency)","tính bao trùm (inclusiveness)"],"exp":"Việc cho phép người dùng yêu cầu giải thích về cách và lý do AI đưa ra quyết định thể hiện nguyên tắc minh bạch (transparency), giúp hệ thống AI dễ hiểu và có thể giải thích được. Do đó đáp án đúng là C.","cite":"https://learn.microsoft.com/en-us/azure/machine-learning/concept-responsible-ai","conf":"H"},{"id":"3-8","t":3,"n":8,"kind":"mcq","multi":2,"stem":"Your company wants to ensure that AI solutions are used responsibly and align with company values and compliance requirements.\nYou need to establish governance principles for AI use.\nWhich two actions should you perform? Select the two BEST answers. Each correct answer presents a complete solution.\nNOTE: Each correct selection is worth one point.","opts":[{"k":"A","en":"Allow each department to tailor governance processes for its own AI initiatives."},{"k":"B","en":"Define accountability norms for AI decisions across business and technical teams."},{"k":"C","en":"Create a process to review AI initiatives for responsible AI alignment."},{"k":"D","en":"Assign governance ownership primarily to the AI engineering and data science teams."},{"k":"E","en":"Focus governance efforts on AI systems that handle regulated or sensitive data."}],"answer":["B","C"],"suggested":"B","vote":"BC","votepct":"5/5 votes, 100%","vi":"Công ty của bạn muốn đảm bảo rằng các giải pháp AI được sử dụng có trách nhiệm và phù hợp với giá trị của công ty cũng như các yêu cầu tuân thủ. Bạn cần thiết lập các nguyên tắc quản trị cho việc sử dụng AI. Bạn nên thực hiện hai hành động nào? Chọn hai câu trả lời TỐT NHẤT. Mỗi câu trả lời đúng là một giải pháp hoàn chỉnh.\nLƯU Ý: Mỗi lựa chọn đúng được một điểm.","opts_vi":["Cho phép mỗi phòng ban tự điều chỉnh quy trình quản trị cho các sáng kiến AI riêng của họ.","Xác định các chuẩn mực về trách nhiệm giải trình (accountability) đối với các quyết định AI trên toàn bộ nhóm kinh doanh và kỹ thuật.","Tạo một quy trình rà soát các sáng kiến AI về sự phù hợp với responsible AI.","Giao quyền sở hữu quản trị chủ yếu cho các nhóm kỹ thuật AI và khoa học dữ liệu.","Tập trung nỗ lực quản trị vào các hệ thống AI xử lý dữ liệu được quản lý hoặc nhạy cảm."],"exp":"Đáp án B và C đều đúng: B xác lập chuẩn mực trách nhiệm giải trình rõ ràng cho các quyết định AI trên cả nhóm kinh doanh và kỹ thuật, còn C thiết lập quy trình rà soát nhất quán để đảm bảo mọi sáng kiến AI phù hợp với responsible AI. Các lựa chọn khác gây phân mảnh quản trị (A), thu hẹp trách nhiệm về một nhóm (D) hoặc bỏ sót các hệ thống rủi ro khác (E).","cite":"https://learn.microsoft.com/en-us/microsoft-cloud/dev/copilot/isv/ai-governance","conf":"H"},{"id":"3-9","t":3,"n":9,"kind":"mcq","multi":1,"stem":"Your company is deploying Microsoft 365 Copilot. The deployment must provide users with access to the Researcher agent to search across data in Microsoft SharePoint.\nYou need to recommend a licensing plan for the solution.\nWhat should you recommend?","opts":[{"k":"A","en":"a Microsoft 365 Copilot per-user add-on license"},{"k":"B","en":"pay-as-you-go"},{"k":"C","en":"a Microsoft 365 subscription entitlement"},{"k":"D","en":"a usage-based consumption license in Azure"}],"answer":["A"],"suggested":"A","vote":"Not available","votepct":"","vi":"Công ty của bạn đang triển khai Microsoft 365 Copilot. Việc triển khai phải cung cấp cho người dùng quyền truy cập Researcher agent để tìm kiếm trên dữ liệu trong Microsoft SharePoint. Bạn cần đề xuất một kế hoạch cấp phép cho giải pháp. Bạn nên đề xuất gì?","opts_vi":["giấy phép bổ sung (add-on) Microsoft 365 Copilot theo mỗi người dùng","trả tiền theo mức dùng (pay-as-you-go)","quyền lợi (entitlement) từ gói đăng ký Microsoft 365","giấy phép tiêu dùng theo mức sử dụng (usage-based) trong Azure"],"exp":"Researcher agent là một agent chuyên biệt chỉ khả dụng cho người dùng có giấy phép bổ sung Microsoft 365 Copilot theo mỗi người dùng (per-user add-on). Nó không đi kèm gói đăng ký Microsoft 365 thông thường và không được cấp phép theo mô hình tiêu dùng của Azure, nên đáp án đúng là A.","cite":"https://learn.microsoft.com/en-us/copilot/microsoft-365/microsoft-365-copilot-licensing","conf":"M"},{"id":"3-10","t":3,"n":10,"kind":"yesno","stem":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.","statements":[{"text":"A barrier to AI adoption can include data limitations and a lack of AI readiness and skills.","ans":"Y"},{"text":"Organizations often struggle with AI adoption because they prioritize technology selection before defining clear business use cases.","ans":"Y"},{"text":"A lack of cross-functional collaboration is a common barrier to AI adoption.","ans":"Y"}],"suggested":"Yes, Yes, Yes (Community comment - 2 upvotes)","vote":"Not available","votepct":"","vi":"Với mỗi phát biểu sau đây, chọn Yes nếu phát biểu đúng. Ngược lại, chọn No.\nLƯU Ý: Mỗi lựa chọn đúng được một điểm.","statements_vi":["Một rào cản đối với việc áp dụng AI có thể bao gồm các hạn chế về dữ liệu và sự thiếu hụt về mức độ sẵn sàng cũng như kỹ năng AI.","Các tổ chức thường gặp khó khăn trong việc áp dụng AI vì họ ưu tiên lựa chọn công nghệ trước khi xác định rõ các trường hợp sử dụng kinh doanh.","Thiếu sự hợp tác liên chức năng là một rào cản phổ biến đối với việc áp dụng AI."],"exp":"Cả ba phát biểu đều đúng (Yes). Hạn chế về dữ liệu và thiếu kỹ năng, chọn công nghệ trước khi xác định use case kinh doanh, và thiếu sự hợp tác liên chức năng đều là những rào cản phổ biến, được ghi nhận đối với việc áp dụng AI trong doanh nghiệp.","cite":"https://learn.microsoft.com/en-us/microsoft-cloud/dev/copilot/isv/ai-adoption","conf":"M"},{"id":"3-11","t":3,"n":11,"kind":"mcq","multi":1,"stem":"What is considered a best practice when forming an AI adoption team in an enterprise environment?","opts":[{"k":"A","en":"Include primarily IT and project management staff initially to streamline deployment, adding governance and compliance roles later."},{"k":"B","en":"Include procurement and vendor management specialists early to evaluate AI tools, involving business teams once a platform is selected."},{"k":"C","en":"Include representatives from legal, leadership, and business units to align AI initiatives with organizational priorities."},{"k":"D","en":"Include only data scientists and engineers at first to validate technical feasibility, then add other stakeholders later."}],"answer":["C"],"suggested":"C","vote":"Not available","votepct":"","vi":"Đâu được coi là một thực hành tốt nhất khi thành lập một nhóm áp dụng AI (AI adoption team) trong môi trường doanh nghiệp?","opts_vi":["Ban đầu chủ yếu gồm nhân sự IT và quản lý dự án để tối ưu hóa việc triển khai, bổ sung các vai trò quản trị và tuân thủ sau này.","Đưa các chuyên gia mua sắm và quản lý nhà cung cấp vào sớm để đánh giá công cụ AI, và chỉ đưa các nhóm kinh doanh tham gia khi đã chọn được nền tảng.","Bao gồm đại diện từ pháp lý, ban lãnh đạo và các đơn vị kinh doanh để định hướng các sáng kiến AI phù hợp với các ưu tiên của tổ chức.","Ban đầu chỉ gồm các nhà khoa học dữ liệu và kỹ sư để xác minh tính khả thi kỹ thuật, sau đó mới bổ sung các bên liên quan khác."],"exp":"Thực hành tốt nhất là xây dựng một nhóm liên chức năng ngay từ đầu, bao gồm đại diện từ pháp lý, ban lãnh đạo và các đơn vị kinh doanh để đảm bảo các sáng kiến AI phù hợp với ưu tiên của tổ chức. Các cách tiếp cận chỉ thu hẹp vào IT, mua sắm hay kỹ thuật ngay từ đầu sẽ bỏ lỡ sự thống nhất chiến lược, nên đáp án đúng là C.","cite":"https://learn.microsoft.com/en-us/microsoft-cloud/dev/copilot/isv/ai-adoption","conf":"H"},{"id":"3-12","t":3,"n":12,"kind":"mcq","multi":2,"stem":"Your company is developing an AI-powered customer support agent.\nYou need to ensure that the solution follows Microsoft responsible AI principles.\nWhich two actions should you perform? Select the two BEST answers. Each correct answer presents part of the solution.\nNOTE: Each correct selection is worth one point.","opts":[{"k":"A","en":"Retain all customer conversations."},{"k":"B","en":"Test the agent to ensure that responses are inclusive and culturally sensitive."},{"k":"C","en":"Enable the agent to operate independently."},{"k":"D","en":"Ensure that the agent can be used for multiple purposes."},{"k":"E","en":"Provide a clear disclaimer that users are interacting with an AI solution."}],"answer":["B","E"],"suggested":"B","vote":"Not available","votepct":"","vi":"Công ty của bạn đang phát triển một agent hỗ trợ khách hàng dùng AI. Bạn cần đảm bảo giải pháp tuân theo các nguyên tắc Microsoft responsible AI. Bạn nên thực hiện hai hành động nào? Chọn hai câu trả lời TỐT NHẤT. Mỗi câu trả lời đúng là một phần của giải pháp.\nLƯU Ý: Mỗi lựa chọn đúng được một điểm.","opts_vi":["Lưu giữ toàn bộ các cuộc hội thoại của khách hàng.","Kiểm thử agent để đảm bảo các phản hồi có tính bao trùm (inclusive) và nhạy bén về văn hóa.","Cho phép agent hoạt động độc lập.","Đảm bảo agent có thể được dùng cho nhiều mục đích.","Cung cấp lời tuyên bố (disclaimer) rõ ràng rằng người dùng đang tương tác với một giải pháp AI."],"exp":"Đáp án B và E đều đúng. B là kiểm thử tính bao trùm (inclusiveness testing): kiểm tra để phản hồi mang tính bao trùm và nhạy bén về văn hóa, phù hợp nguyên tắc inclusiveness. E là tuyên bố minh bạch (transparency disclaimer): thông báo rõ người dùng đang tương tác với AI, phù hợp nguyên tắc transparency. Các lựa chọn còn lại vi phạm hoặc không liên quan đến responsible AI.","cite":"https://learn.microsoft.com/en-us/azure/machine-learning/concept-responsible-ai","conf":"H"},{"id":"3-13","t":3,"n":13,"kind":"yesno","stem":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.","statements":[{"text":"Larger datasets can increase the cost of a generative AI solution that uses an Azure Machine Learning workspace.","ans":"Y"},{"text":"The cost of consuming Azure OpenAI models is primarily identified by the number of input and output tokens processed.","ans":"Y"},{"text":"The cost of custom generative AI solutions always remains the same regardless of the model version or capability used.","ans":"N"}],"suggested":"Yes, Yes, No (Community comment - 2 upvotes)","vote":"Not available","votepct":"","vi":"Với mỗi phát biểu sau đây, chọn Yes nếu phát biểu đúng. Ngược lại, chọn No.\nLƯU Ý: Mỗi lựa chọn đúng được một điểm.","statements_vi":["Bộ dữ liệu lớn hơn có thể làm tăng chi phí của một giải pháp AI tạo sinh sử dụng workspace của Azure Machine Learning.","Chi phí sử dụng các mô hình Azure OpenAI chủ yếu được xác định bởi số lượng token đầu vào và đầu ra được xử lý.","Chi phí của các giải pháp AI tạo sinh tùy chỉnh luôn giữ nguyên bất kể phiên bản mô hình hoặc khả năng được sử dụng."],"exp":"Bộ dữ liệu lớn hơn làm tăng nhu cầu tính toán và lưu trữ nên làm tăng chi phí (Yes), và chi phí Azure OpenAI được tính chủ yếu theo số token đầu vào/đầu ra (Yes). Chi phí thực tế thay đổi theo phiên bản mô hình và khả năng sử dụng, nên phát biểu thứ ba là sai (No).","cite":"https://azure.microsoft.com/en-us/pricing/details/cognitive-services/openai-service/","conf":"H"},{"id":"3-14","t":3,"n":14,"kind":"yesno","stem":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.","statements":[{"text":"Using incomplete or poor-quality data during generative AI model training can increase costs.","ans":"Y"},{"text":"AI models rely on training data to learn patterns and identify relationships to produce outputs.","ans":"Y"},{"text":"Generative AI models trained on non-representative datasets can produce inaccurate or unbalanced results.","ans":"Y"}],"suggested":"Yes, Yes, Yes (Community comment - 3 upvotes)","vote":"Not available","votepct":"","vi":"Với mỗi phát biểu sau đây, chọn Yes nếu phát biểu đúng. Ngược lại, chọn No.\nLƯU Ý: Mỗi lựa chọn đúng được một điểm.","statements_vi":["Sử dụng dữ liệu không đầy đủ hoặc chất lượng kém trong quá trình huấn luyện mô hình AI tạo sinh có thể làm tăng chi phí.","Các mô hình AI dựa vào dữ liệu huấn luyện để học các mẫu (pattern) và xác định các mối quan hệ nhằm tạo ra kết quả đầu ra.","Các mô hình AI tạo sinh được huấn luyện trên các bộ dữ liệu không mang tính đại diện có thể tạo ra kết quả không chính xác hoặc mất cân bằng."],"exp":"Cả ba phát biểu đều đúng (Yes). Dữ liệu kém chất lượng làm tăng chi phí do phải huấn luyện lại và xử lý; mô hình học pattern và mối quan hệ từ dữ liệu huấn luyện; và dữ liệu không đại diện dẫn đến kết quả sai lệch hoặc mất cân bằng (thiên kiến).","cite":"https://learn.microsoft.com/en-us/azure/machine-learning/concept-responsible-ai","conf":"H"},{"id":"3-15","t":3,"n":15,"kind":"mcq","multi":1,"stem":"Your company uses a fine-tuned generative AI solution trained on data that is representative of the general population.\nYou discover that some of the generated responses include inappropriate or exclusionary language based on ableist assumptions.\nYou need to prevent the inappropriate responses. Your solution must minimize costs.\nWhat should you do?","opts":[{"k":"A","en":"Apply a newer version of the generative AI model."},{"k":"B","en":"Apply a content-moderation filter."},{"k":"C","en":"Create a new version of the solution that is trained on only inclusive and representative content."},{"k":"D","en":"Create a new version of the solution that is trained on only exclusionary content."}],"answer":["B"],"suggested":"B","vote":"Not available","votepct":"","vi":"Công ty của bạn sử dụng một giải pháp AI tạo sinh được tinh chỉnh (fine-tuned), huấn luyện trên dữ liệu mang tính đại diện cho dân số chung. Bạn phát hiện một số phản hồi được tạo ra có ngôn ngữ không phù hợp hoặc mang tính loại trừ dựa trên các giả định phân biệt người khuyết tật (ableist). Bạn cần ngăn chặn các phản hồi không phù hợp này. Giải pháp phải giảm thiểu chi phí. Bạn nên làm gì?","opts_vi":["Áp dụng một phiên bản mới hơn của mô hình AI tạo sinh.","Áp dụng một bộ lọc kiểm duyệt nội dung (content-moderation filter).","Tạo một phiên bản mới của giải pháp chỉ được huấn luyện trên nội dung mang tính bao trùm và đại diện.","Tạo một phiên bản mới của giải pháp chỉ được huấn luyện trên nội dung mang tính loại trừ."],"exp":"Áp dụng bộ lọc kiểm duyệt nội dung là cách nhanh và ít tốn kém nhất để chặn các phản hồi không phù hợp hoặc mang tính loại trừ mà không cần huấn luyện lại. Việc huấn luyện lại mô hình trên dữ liệu mới tốn kém hơn nhiều, nên đáp án đúng là B.","cite":"https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/content-filter","conf":"H"},{"id":"3-16","t":3,"n":16,"kind":"mcq","multi":1,"stem":"Your company plans to use an AI-powered solution to analyze customer feedback for insights related to future product designs.\nYou need to mitigate the privacy risks associated with the solution.\nWhat is the best approach to achieve the goal? More than one answer choice may achieve the goal. Select the BEST answer.","opts":[{"k":"A","en":"Delete all the feedback data immediately after analysis."},{"k":"B","en":"Ensure that feedback is attributable to the customer so that it can be deleted upon request."},{"k":"C","en":"Limit privacy reviews to the final stage of the AI project lifecycle."},{"k":"D","en":"Anonymize the source data to remove customer Personally Identifiable Information (PII) from the feedback."}],"answer":["D"],"suggested":"D","vote":"Not available","votepct":"","vi":"Công ty của bạn dự định sử dụng một giải pháp dùng AI để phân tích phản hồi của khách hàng nhằm thu được thông tin chi tiết liên quan đến thiết kế sản phẩm trong tương lai. Bạn cần giảm thiểu các rủi ro về quyền riêng tư liên quan đến giải pháp. Đâu là cách tiếp cận tốt nhất để đạt được mục tiêu? Có thể có nhiều lựa chọn đạt được mục tiêu. Chọn câu trả lời TỐT NHẤT.","opts_vi":["Xóa toàn bộ dữ liệu phản hồi ngay sau khi phân tích.","Đảm bảo rằng phản hồi có thể quy về từng khách hàng để có thể xóa khi có yêu cầu.","Giới hạn việc rà soát quyền riêng tư chỉ ở giai đoạn cuối của vòng đời dự án AI.","Ẩn danh (anonymize) dữ liệu nguồn để loại bỏ Thông tin Nhận dạng Cá nhân (PII) khỏi phản hồi."],"exp":"Ẩn danh dữ liệu nguồn để loại bỏ PII là cách tốt nhất để giảm thiểu rủi ro quyền riêng tư trong khi vẫn cho phép phân tích phản hồi để lấy insight. Xóa toàn bộ dữ liệu làm mất giá trị phân tích, còn giữ khả năng quy về khách hàng hay chỉ rà soát ở giai đoạn cuối lại làm tăng rủi ro, nên đáp án đúng là D.","cite":"https://learn.microsoft.com/en-us/azure/machine-learning/concept-responsible-ai","conf":"H"},{"id":"3-17","t":3,"n":17,"kind":"drop","stem":"Select the answer that correctly completes the sentence.","parts":[{"pre":"An effective way to scale AI proficiency and adoption amongst employees is to","post":"","choices":["launch an internal campaign to promote AI awareness.","offer a self-paced online training course for employees.","define performance metrics for AI tool usage.","establish a champions program for your company."],"ans":3}],"suggested":"establish a champions program for your company. (Community comment - 2 upvotes)","vote":"Not available","votepct":"","vi":"Một cách hiệu quả để mở rộng năng lực và mức độ áp dụng AI trong đội ngũ nhân viên là...","parts_vi":[{"pre_vi":"Một cách hiệu quả để mở rộng năng lực và mức độ áp dụng AI trong đội ngũ nhân viên là","post_vi":"","choices_vi":["khởi động một chiến dịch nội bộ để nâng cao nhận thức về AI.","cung cấp một khóa đào tạo trực tuyến tự học cho nhân viên.","định nghĩa các chỉ số hiệu suất cho việc sử dụng công cụ AI.","thiết lập một champions program cho công ty của bạn."]}],"exp":"Champions program tạo ra một mạng lưới những người ủng hộ nội bộ, họ học hỏi, chia sẻ kinh nghiệm và giúp đồng nghiệp áp dụng AI, nhờ đó lan tỏa năng lực AI trên quy mô lớn. Cách tiếp cận này bền vững hơn so với chiến dịch nâng cao nhận thức đơn lẻ hay khóa học tự học, vốn thiếu yếu tố kèm cặp và động lực liên tục.","cite":"https://learn.microsoft.com/en-us/microsoft-365-copilot/microsoft-365-copilot-champions","conf":"H"},{"id":"3-18","t":3,"n":18,"kind":"mcq","multi":1,"stem":"Your company is building a portfolio of AI-powered business solutions.\nCompany executives want to understand how Microsoft responsible AI principles can support the company's long-term goals.\nWhich benefit best demonstrates the importance of responsible AI? More than one answer choice may achieve the goal. Select the BEST answer.","opts":[{"k":"A","en":"reduces the need for executive oversight in AI decision-making"},{"k":"B","en":"enhances stakeholder trust and fosters sustainable AI adoption throughout the organization"},{"k":"C","en":"guarantees that AI models provide accurate and relevant responses"},{"k":"D","en":"reduces the need for data protection policies and governance"}],"answer":["B"],"suggested":"B","vote":"Not available","votepct":"","vi":"Công ty của bạn đang xây dựng một danh mục các giải pháp kinh doanh dựa trên AI. Các lãnh đạo công ty muốn hiểu cách các nguyên tắc responsible AI của Microsoft có thể hỗ trợ mục tiêu dài hạn của công ty. Lợi ích nào thể hiện rõ nhất tầm quan trọng của responsible AI? Nhiều lựa chọn có thể đạt được mục tiêu. Hãy chọn đáp án TỐT NHẤT.","opts_vi":["giảm nhu cầu giám sát của lãnh đạo trong việc ra quyết định về AI","tăng cường niềm tin của các bên liên quan và thúc đẩy việc áp dụng AI bền vững trong toàn tổ chức","đảm bảo rằng các mô hình AI luôn cung cấp phản hồi chính xác và phù hợp","giảm nhu cầu về các chính sách bảo vệ dữ liệu và quản trị"],"exp":"Responsible AI xây dựng niềm tin của các bên liên quan và tạo nền tảng cho việc áp dụng AI bền vững lâu dài, phù hợp với mục tiêu chiến lược của công ty. Các lựa chọn khác đều sai: responsible AI không loại bỏ nhu cầu giám sát của con người, không đảm bảo độ chính xác tuyệt đối, và không làm giảm nhu cầu về quản trị hay bảo vệ dữ liệu.","cite":"https://learn.microsoft.com/en-us/azure/machine-learning/concept-responsible-ai","conf":"H"},{"id":"3-19","t":3,"n":19,"kind":"drop","stem":"Select the answer that correctly completes the sentence.","parts":[{"pre":"Adopting Microsoft responsible AI principles is important for your organization because the principles","post":"","choices":["ensure that AI models deliver consistent and equitable results.","help organizations increase trust in fully autonomous AI systems.","promote the ethical and accountable use of AI.","standardize model development practices across AI teams."],"ans":2}],"suggested":"promote the ethical and accountable use of AI. (Community comment - 2 upvotes)","vote":"Not available","votepct":"","vi":"Việc áp dụng các nguyên tắc responsible AI của Microsoft là quan trọng đối với tổ chức của bạn vì các nguyên tắc này...","parts_vi":[{"pre_vi":"Việc áp dụng các nguyên tắc responsible AI của Microsoft là quan trọng đối với tổ chức của bạn vì các nguyên tắc này","post_vi":"","choices_vi":["đảm bảo rằng các mô hình AI cho kết quả nhất quán và công bằng.","giúp tổ chức tăng niềm tin vào các hệ thống AI hoàn toàn tự động.","thúc đẩy việc sử dụng AI một cách đạo đức và có trách nhiệm.","chuẩn hóa các thực hành phát triển mô hình trong các nhóm AI."]}],"exp":"Mục đích cốt lõi của các nguyên tắc responsible AI là thúc đẩy việc sử dụng AI một cách đạo đức và có trách nhiệm giải trình. Các lựa chọn khác quá hẹp hoặc sai: các nguyên tắc không đảm bảo kết quả tuyệt đối nhất quán, không nhằm cổ vũ hệ thống hoàn toàn tự động, và không chỉ đơn thuần là chuẩn hóa quy trình kỹ thuật.","cite":"https://learn.microsoft.com/en-us/azure/machine-learning/concept-responsible-ai","conf":"H"},{"id":"3-20","t":3,"n":20,"kind":"yesno","stem":"For each of the following statements, select Yes if the statement is true. Otherwise, select No.\nNOTE: Each correct selection is worth one point.","statements":[{"text":"Users that want to reason over work data by using a natural language prompt in Microsoft 365 Copilot must have a Copilot add-on license.","ans":"Y"},{"text":"Microsoft 365 Copilot is included in Microsoft 365 E3 and Microsoft 365 E5 licenses.","ans":"N"},{"text":"Some Microsoft 365 Copilot services are available through a pay-as-you-go plan.","ans":"N"}],"suggested":"Yes, No, No (Community comment - 3 upvotes)","vote":"Not available","votepct":"","vi":"Với mỗi phát biểu sau, chọn Yes nếu phát biểu đúng. Nếu không, chọn No.\nLƯU Ý: Mỗi lựa chọn đúng có giá trị một điểm.","statements_vi":["Người dùng muốn suy luận trên dữ liệu công việc bằng câu lệnh ngôn ngữ tự nhiên trong Microsoft 365 Copilot phải có Copilot add-on license.","Microsoft 365 Copilot được bao gồm sẵn trong các license Microsoft 365 E3 và Microsoft 365 E5.","Một số dịch vụ Microsoft 365 Copilot có sẵn thông qua gói pay-as-you-go."],"exp":"Phát biểu 1 Đúng: cần Microsoft 365 Copilot add-on license (thường mua kèm gói M365 nền như E3/E5) để suy luận trên dữ liệu công việc, nên phát biểu 2 là Sai vì Copilot không được bao gồm sẵn trong E3/E5. Phát biểu 3 được cộng đồng giữ đáp án No, nhưng thực tế còn tranh cãi: Microsoft hiện có Copilot Chat với mô hình pay-as-you-go cho agent (tính theo message/token qua Microsoft 365 Copilot Chat), nên phát biểu này có thể được xem là Đúng tùy cách diễn giải. Vì vậy đặt độ tin cậy thấp cho câu này.","cite":"https://learn.microsoft.com/en-us/microsoft-365-copilot/extensibility/copilot-studio-agent-builder-licensing","conf":"L"},{"id":"3-21","t":3,"n":21,"kind":"mcq","multi":1,"stem":"You have a business unit that uses an AI solution to process loan applications.\nYou discover that the solution rejects the application of all applicants that are older than 60 years of age.\nWhich Microsoft responsible AI principle is this violating?","opts":[{"k":"A","en":"accountability"},{"k":"B","en":"transparency"},{"k":"C","en":"reliability and safety"},{"k":"D","en":"fairness"}],"answer":["D"],"suggested":"D","vote":"Not available","votepct":"","vi":"Bạn có một đơn vị kinh doanh sử dụng giải pháp AI để xử lý các đơn xin vay. Bạn phát hiện rằng giải pháp từ chối đơn của tất cả những người nộp đơn trên 60 tuổi. Đây là vi phạm nguyên tắc responsible AI nào của Microsoft?","opts_vi":["accountability (trách nhiệm giải trình)","transparency (minh bạch)","reliability and safety (độ tin cậy và an toàn)","fairness (công bằng)"],"exp":"Việc từ chối một cách hệ thống mọi người trên 60 tuổi là phân biệt đối xử dựa trên độ tuổi, vi phạm nguyên tắc fairness (công bằng) đòi hỏi AI đối xử bình đẳng với mọi người và không tạo ra thiên kiến. Transparency liên quan đến việc giải thích quyết định, còn accountability liên quan đến giám sát của con người, đều không phải trọng tâm của tình huống này.","cite":"https://learn.microsoft.com/en-us/azure/machine-learning/concept-responsible-ai","conf":"H"},{"id":"3-22","t":3,"n":22,"kind":"drop","stem":"Select the answer that correctly completes the sentence.","parts":[{"pre":"An organization's AI champions program includes","post":"","c
