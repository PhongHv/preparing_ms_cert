hoices":["technical teams responsible for designing advanced analytics solutions to track adoption.","users who advocate for the value of AI by learning, sharing, and identifying use cases.","users who are dedicated to building the infrastructure required to support AI across the organization.","users who come together and define the organization's overall AI strategy."],"ans":1}],"suggested":"users who advocate for the value of AI by learning, sharing, and identifying use cases. (Community comment - 2 upvotes)","vote":"Not available","votepct":"","vi":"Champions program (chương trình đại sứ) AI của một tổ chức bao gồm...","parts_vi":[{"pre_vi":"Champions program AI của một tổ chức bao gồm","post_vi":"","choices_vi":["các nhóm kỹ thuật chịu trách nhiệm thiết kế các giải pháp phân tích nâng cao để theo dõi mức độ áp dụng.","những người dùng ủng hộ giá trị của AI thông qua việc học hỏi, chia sẻ và xác định các trường hợp sử dụng.","những người dùng chuyên xây dựng hạ tầng cần thiết để hỗ trợ AI trên toàn tổ chức.","những người dùng cùng nhau xác định chiến lược AI tổng thể của tổ chức."]}],"exp":"Champions program bao gồm những người dùng nhiệt huyết đóng vai trò đại sứ, họ học hỏi, chia sẻ kiến thức và xác định các trường hợp sử dụng AI để truyền cảm hứng cho đồng nghiệp. Đây không phải nhóm kỹ thuật xây dựng hạ tầng hay hội đồng định hình chiến lược (đó là vai trò của AI governance council).","cite":"https://learn.microsoft.com/en-us/microsoft-365-copilot/microsoft-365-copilot-champions","conf":"H"},{"id":"3-23","t":3,"n":23,"kind":"mcq","multi":1,"stem":"Your company is reviewing a new AI solution before deploying it. The company wants to ensure that the solution follows Microsoft responsible AI principles.\nWhat is the best approach to achieve the goal? More than one answer choice may achieve the goal. Select the BEST answer.","opts":[{"k":"A","en":"Design the AI solution to automatically approve or reject customer loan applications."},{"k":"B","en":"Test the AI solution to identify and mitigate potential unfair or inconsistent outcomes in its outputs."},{"k":"C","en":"Prioritize model performance when tuning the AI solution."},{"k":"D","en":"Enable the AI solution to collect and store personal data."}],"answer":["B"],"suggested":"B","vote":"Not available","votepct":"","vi":"Công ty của bạn đang xem xét một giải pháp AI mới trước khi triển khai. Công ty muốn đảm bảo giải pháp tuân theo các nguyên tắc responsible AI của Microsoft. Đâu là cách tiếp cận tốt nhất để đạt mục tiêu? Nhiều lựa chọn có thể đạt được mục tiêu. Hãy chọn đáp án TỐT NHẤT.","opts_vi":["Thiết kế giải pháp AI để tự động phê duyệt hoặc từ chối các đơn xin vay của khách hàng.","Kiểm thử giải pháp AI để xác định và giảm thiểu các kết quả không công bằng hoặc thiếu nhất quán trong đầu ra.","Ưu tiên hiệu suất mô hình khi tinh chỉnh giải pháp AI.","Cho phép giải pháp AI thu thập và lưu trữ dữ liệu cá nhân."],"exp":"Việc kiểm thử giải pháp để phát hiện và giảm thiểu các kết quả không công bằng hay thiếu nhất quán trực tiếp hỗ trợ các nguyên tắc fairness cùng reliability and safety. Các lựa chọn khác đi ngược lại responsible AI: tự động phê duyệt không có giám sát của con người, chỉ ưu tiên hiệu suất, hay thu thập dữ liệu cá nhân quá mức đều làm tăng rủi ro.","cite":"https://learn.microsoft.com/en-us/azure/machine-learning/concept-responsible-ai","conf":"H"},{"id":"3-24","t":3,"n":24,"kind":"drag","stem":"Match the Microsoft responsible AI principles to the appropriate descriptions.\nTo answer, drag the principle from the column on the left to its description on the right. Each principle may be used once, more than once, or not at all.\nNOTE: Each correct match is worth one point.","items":["Fairness","Reliability and safety","Privacy and security","Inclusiveness","Transparency","Accountability"],"targets":[{"label":"Protect personal information and apply strong safeguards to keep data secure.","ans":2},{"label":"Make AI solutions understandable by explaining how and why decisions are made.","ans":4},{"label":"Design AI solutions that are accessible to people of all abilities and experiences.","ans":3},{"label":"Involve human oversight in the control of AI solutions.","ans":5}],"suggested":"Privacy and security; Transparency; Inclusiveness; Accountability (Community comment - 4 upvotes)","vote":"Not available","votepct":"","vi":"Ghép các nguyên tắc responsible AI của Microsoft với mô tả phù hợp.\nĐể trả lời, kéo nguyên tắc từ cột bên trái sang mô tả tương ứng ở bên phải. Mỗi nguyên tắc có thể được dùng một lần, nhiều lần hoặc không dùng.\nLƯU Ý: Mỗi ghép nối đúng có giá trị một điểm.","items_vi":["Fairness (Công bằng)","Reliability and safety (Độ tin cậy và an toàn)","Privacy and security (Quyền riêng tư và bảo mật)","Inclusiveness (Tính bao hàm)","Transparency (Minh bạch)","Accountability (Trách nhiệm giải trình)"],"targets_vi":["Bảo vệ thông tin cá nhân và áp dụng các biện pháp bảo vệ mạnh mẽ để giữ dữ liệu an toàn.","Làm cho các giải pháp AI dễ hiểu bằng cách giải thích cách thức và lý do đưa ra quyết định.","Thiết kế các giải pháp AI có thể tiếp cận được với người ở mọi khả năng và trải nghiệm.","Đưa sự giám sát của con người vào việc kiểm soát các giải pháp AI."],"exp":"Bảo vệ thông tin cá nhân = Privacy and security; giải thích cách và lý do ra quyết định = Transparency; thiết kế cho mọi khả năng và trải nghiệm = Inclusiveness; đưa con người vào giám sát và kiểm soát = Accountability. Đây là bốn trong sáu nguyên tắc responsible AI của Microsoft.","cite":"https://learn.microsoft.com/en-us/azure/machine-learning/concept-responsible-ai","conf":"H"},{"id":"3-25","t":3,"n":25,"kind":"mcq","multi":1,"stem":"Your company uses generative AI to assist with content creation and customer interactions.\nYou need to evaluate whether Azure Machine Learning can add value to the current customer management.\nFor which use case should you use Machine Learning?","opts":[{"k":"A","en":"predicting customer retention"},{"k":"B","en":"creating product descriptions from images"},{"k":"C","en":"generating marketing campaigns"},{"k":"D","en":"summarizing customer service transcripts"}],"answer":["A"],"suggested":"A","vote":"Not available","votepct":"","vi":"Công ty của bạn sử dụng generative AI để hỗ trợ tạo nội dung và tương tác với khách hàng. Bạn cần đánh giá xem Azure Machine Learning có thể mang lại giá trị cho việc quản lý khách hàng hiện tại hay không. Bạn nên dùng Machine Learning cho trường hợp sử dụng nào?","opts_vi":["dự đoán khả năng giữ chân khách hàng","tạo mô tả sản phẩm từ hình ảnh","tạo các chiến dịch marketing","tóm tắt các bản ghi dịch vụ khách hàng"],"exp":"Dự đoán khả năng giữ chân khách hàng (customer retention) là bài toán phân tích dự đoán dựa trên dữ liệu lịch sử, phù hợp với Azure Machine Learning. Ba lựa chọn còn lại (tạo mô tả từ hình ảnh, tạo chiến dịch, tóm tắt bản ghi) là các tác vụ generative AI, không phải thế mạnh của ML dự đoán truyền thống.","cite":"https://learn.microsoft.com/en-us/azure/machine-learning/overview-what-is-azure-machine-learning","conf":"H"},{"id":"3-26","t":3,"n":26,"kind":"mcq","multi":1,"stem":"Your company stores hundreds of internal business reports.\nYou need to recommend a generative AI solution that uses an agent to answer questions based on the content in the reports.\nWhat should you include in the recommendation?","opts":[{"k":"A","en":"natural language processing"},{"k":"B","en":"Azure Machine Learning"},{"k":"C","en":"Retrieval Augmented Generation (RAG)"},{"k":"D","en":"Generative Adversarial Network (GAN)"}],"answer":["C"],"suggested":"C","vote":"Not available","votepct":"","vi":"Công ty của bạn lưu trữ hàng trăm báo cáo kinh doanh nội bộ. Bạn cần đề xuất một giải pháp generative AI dùng một agent để trả lời câu hỏi dựa trên nội dung các báo cáo. Bạn nên đưa gì vào đề xuất?","opts_vi":["natural language processing (xử lý ngôn ngữ tự nhiên)","Azure Machine Learning","Retrieval Augmented Generation (RAG)","Generative Adversarial Network (GAN)"],"exp":"RAG truy xuất nội dung liên quan từ kho tài liệu nội bộ tại thời điểm truy vấn và neo (ground) phản hồi của mô hình vào dữ liệu đó, giúp agent trả lời câu hỏi dựa trên các báo cáo mà không cần huấn luyện lại mô hình. GAN dùng để tạo dữ liệu/hình ảnh, còn Azure ML và NLP thuần túy không giải quyết trực tiếp bài toán hỏi-đáp trên tài liệu này.","cite":"https://learn.microsoft.com/en-us/azure/search/retrieval-augmented-generation-overview","conf":"H"},{"id":"3-27","t":3,"n":27,"kind":"drop","stem":"Select the answer that correctly completes the sentence.","parts":[{"pre":"The cost of using generative AI language models is based typically on the number of","post":"processed.","choices":["documents","requests","tokens","words"],"ans":2}],"suggested":"tokens (Community comment - 3 upvotes)","vote":"Not available","votepct":"","vi":"Chi phí sử dụng các mô hình ngôn ngữ generative AI thường được tính dựa trên số lượng ... được xử lý.","parts_vi":[{"pre_vi":"Chi phí sử dụng các mô hình ngôn ngữ generative AI thường được tính dựa trên số lượng","post_vi":"được xử lý.","choices_vi":["tài liệu","yêu cầu","token","từ"]}],"exp":"Các mô hình ngôn ngữ generative AI tính phí theo số token được xử lý, bao gồm cả token đầu vào (prompt) lẫn token đầu ra (phản hồi). Token là đơn vị nhỏ hơn từ (thường là các đoạn ký tự/tiểu từ), nên việc tính theo token chính xác hơn so với đếm tài liệu, yêu cầu hay từ.","cite":"https://learn.microsoft.com/en-us/azure/ai-services/openai/overview","conf":"H"},{"id":"3-28","t":3,"n":28,"kind":"mcq","multi":1,"stem":"Your company plans to use generative AI to help summarize and analyze internal business documents.\nYou need to recommend a solution to prevent generative AI from accessing confidential or classified information.\nWhat should you include in the recommendation?","opts":[{"k":"A","en":"an information barrier (IB) policy"},{"k":"B","en":"communication monitoring"},{"k":"C","en":"a data retention policy"},{"k":"D","en":"data governance"}],"answer":["D"],"suggested":"D","vote":"Not available","votepct":"","vi":"Công ty của bạn dự định dùng generative AI để hỗ trợ tóm tắt và phân tích tài liệu kinh doanh nội bộ. Bạn cần đề xuất một giải pháp để ngăn generative AI truy cập thông tin bí mật hoặc được phân loại mật. Bạn nên đưa gì vào đề xuất?","opts_vi":["chính sách information barrier (IB)","giám sát truyền thông (communication monitoring)","chính sách lưu giữ dữ liệu (data retention)","data governance (quản trị dữ liệu)"],"exp":"Data governance thiết lập các chính sách, phân loại, phân quyền và kiểm soát truy cập để đảm bảo generative AI chỉ truy cập dữ liệu mà nó được phép, ngăn lộ thông tin bí mật hay mật. Information barrier chỉ nhằm ngăn giao tiếp giữa các nhóm, còn communication monitoring và data retention phục vụ mục đích tuân thủ/giám sát khác, không giải quyết trực tiếp việc kiểm soát truy cập của AI.","cite":"https://learn.microsoft.com/en-us/purview/data-governance-solution","conf":"M"},{"id":"3-29","t":3,"n":29,"kind":"drop","stem":"Select the answer that correctly completes the sentence.","parts":[{"pre":"When Microsoft 365 Copilot accesses company data using the principle of least privilege, this is an example of a","post":"control.","choices":["data classification","data compliance","data loss prevention (DLP)","data security"],"ans":3}],"suggested":"data security (Community comment - 5 upvotes)","vote":"Not available","votepct":"","vi":"Khi Microsoft 365 Copilot truy cập dữ liệu công ty theo nguyên tắc least privilege (đặc quyền tối thiểu), đây là một ví dụ về loại kiểm soát ... nào.","parts_vi":[{"pre_vi":"Khi Microsoft 365 Copilot truy cập dữ liệu công ty theo nguyên tắc least privilege, đây là một ví dụ về loại kiểm soát","post_vi":".","choices_vi":["data classification (phân loại dữ liệu)","data compliance (tuân thủ dữ liệu)","data loss prevention (DLP)","data security (bảo mật dữ liệu)"]}],"exp":"Nguyên tắc least privilege chỉ cấp cho người dùng và Copilot quyền truy cập tối thiểu cần thiết, đây là một biện pháp kiểm soát data security (bảo mật dữ liệu). Data classification chỉ gán nhãn mức độ nhạy cảm, DLP ngăn rò rỉ dữ liệu ra ngoài, còn data compliance hướng đến việc đáp ứng quy định, không phải bản chất của kiểm soát truy cập theo đặc quyền tối thiểu.","cite":"https://learn.microsoft.com/en-us/copilot/microsoft-365/microsoft-365-copilot-privacy","conf":"M"},{"id":"3-30","t":3,"n":30,"kind":"mcq","multi":1,"stem":"Your company uses Microsoft 365 Copilot.\nYou identify several business processes that require custom workflows and specialized automation.\nYou need to recommend a solution that extends Copilot capabilities while minimizing development effort and costs.\nWhat should you recommend?","opts":[{"k":"A","en":"Create an agent by using Microsoft Foundry."},{"k":"B","en":"Deploy a Copilot connector."},{"k":"C","en":"Build a custom agent by using the full experience of Microsoft Copilot Studio."},{"k":"D","en":"Build a declarative agent by using the lite experience of Microsoft Copilot Studio."}],"answer":["D"],"suggested":"D","vote":"Not available","votepct":"","vi":"Công ty của bạn sử dụng Microsoft 365 Copilot. Bạn xác định một số quy trình kinh doanh cần các workflow tùy chỉnh và tự động hóa chuyên biệt. Bạn cần đề xuất một giải pháp mở rộng khả năng của Copilot trong khi giảm thiểu công sức phát triển và chi phí. Bạn nên đề xuất gì?","opts_vi":["Tạo một agent bằng Microsoft Foundry.","Triển khai một Copilot connector.","Xây dựng một agent tùy chỉnh bằng trải nghiệm đầy đủ (full experience) của Microsoft Copilot Studio.","Xây dựng một declarative agent bằng trải nghiệm rút gọn (lite experience) của Microsoft Copilot Studio."],"exp":"Declarative agent xây bằng trải nghiệm lite của Copilot Studio (Copilot Studio agent builder) mở rộng Microsoft 365 Copilot với công sức và chi phí thấp nhất, phù hợp cho các workflow tùy chỉnh đơn giản. Trải nghiệm full của Copilot Studio hay tạo agent bằng Foundry phức tạp và tốn kém hơn, còn connector chỉ đưa dữ liệu vào chứ không tạo workflow tự động hóa.","cite":"https://learn.microsoft.com/en-us/microsoft-365-copilot/extensibility/copilot-studio-agent-builder","conf":"M"},{"id":"3-31","t":3,"n":31,"kind":"mcq","multi":1,"stem":"What is a key feature of Microsoft 365 Copilot that aligns with the Microsoft responsible AI principles of transparency, reliability, and safety?","opts":[{"k":"A","en":"Automatically approves AI-generated content for company-wide publishing."},{"k":"B","en":"Removes the need for a human to review AI-generated outputs."},{"k":"C","en":"Provides grounded, verifiable responses based on organizational data."},{"k":"D","en":"Enables users to select from an authorized catalog of AI models."}],"answer":["C"],"suggested":"C","vote":"Not available","votepct":"","vi":"Đâu là một tính năng quan trọng của Microsoft 365 Copilot phù hợp với các nguyên tắc responsible AI của Microsoft về transparency (minh bạch), reliability (độ tin cậy) và safety (an toàn)?","opts_vi":["Tự động phê duyệt nội dung do AI tạo ra để xuất bản trên toàn công ty.","Loại bỏ nhu cầu con người phải xem xét đầu ra do AI tạo ra.","Cung cấp các phản hồi được neo (grounded) và có thể kiểm chứng dựa trên dữ liệu tổ chức.","Cho phép người dùng chọn từ một danh mục các mô hình AI được cấp phép."],"exp":"Microsoft 365 Copilot neo (ground) phản hồi vào dữ liệu tổ chức qua Microsoft Graph và cung cấp trích dẫn có thể kiểm chứng, hỗ trợ minh bạch, độ tin cậy và an toàn. Các lựa chọn khác đi ngược responsible AI: tự động phê duyệt hay loại bỏ việc con người xem xét làm giảm giám sát, còn việc chọn mô hình không liên quan trực tiếp đến các nguyên tắc này.","cite":"https://learn.microsoft.com/en-us/copilot/microsoft-365/microsoft-365-copilot-overview","conf":"H"}];

const KIND_LABEL={mcq:"MCQ",yesno:"Yes/No",drop:"Dropdown",drag:"Drag & Drop"};
const CONF_LABEL={H:"Tin cậy: Cao (H)",M:"Tin cậy: T.Bình (M)",L:"Tin cậy: Thấp (L)"};
const $=s=>document.querySelector(s);
const $$=(s,ctx)=>Array.from((ctx||document).querySelectorAll(s));
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
function viBlock(text){const d=el("div","vi");d.textContent=text;return d;}

const state={mode:"study",answers:{},revealed:{},exam:null,allShown:false};

/* ---------- shared question rendering ---------- */
// opts: returns the question body element + attaches interaction. reviewMode false => interactive.
function ansObj(q){ if(!state.answers[q.id]) state.answers[q.id]=blankAns(q); return state.answers[q.id]; }
function blankAns(q){
  if(q.kind==="mcq") return {sel:[]};
  if(q.kind==="yesno") return {sel:q.statements.map(()=>null)};
  if(q.kind==="drop") return {sel:q.parts.map(()=>null)};
  if(q.kind==="drag") return {sel:q.targets.map(()=>null), pick:null};
  return {};
}
function isAnswered(q){
  const a=ansObj(q);
  if(q.kind==="mcq") return a.sel.length>0;
  if(q.kind==="yesno") return a.sel.every(x=>x!==null);
  if(q.kind==="drop") return a.sel.every(x=>x!==null);
  if(q.kind==="drag") return a.sel.every(x=>x!==null);
  return false;
}
function isCorrect(q){
  const a=ansObj(q);
  if(q.kind==="mcq"){const s=[...a.sel].sort().join(","),c=[...q.answer].sort().join(",");return s===c;}
  if(q.kind==="yesno") return q.statements.every((st,i)=>a.sel[i]===st.ans);
  if(q.kind==="drop") return q.parts.every((p,i)=>a.sel[i]===p.ans);
  if(q.kind==="drag") return q.targets.every((t,i)=>a.sel[i]===t.ans);
  return false;
}

function renderStem(q,card){
  const st=el("div","stem");st.textContent=q.stem;card.appendChild(st);
  card.appendChild(viBlock(q.vi));
}

function buildBody(q,card,onChange){
  if(q.kind==="mcq") buildMCQ(q,card,onChange);
  else if(q.kind==="yesno") buildYesno(q,card,onChange);
  else if(q.kind==="drop") buildDrop(q,card,onChange);
  else if(q.kind==="drag") buildDrag(q,card,onChange);
}

function buildMCQ(q,card,onChange){
  const a=ansObj(q); const N=q.multi||1;
  const box=el("div","opts");
  q.opts.forEach(o=>{
    const row=el("div","opt"+(N>1?" multi":""));
    row.dataset.k=o.k;
    const mk=el("div","mk",N>1?"":o.k); if(N>1)mk.textContent=o.k;
    const body=el("div","obody");
    const p=el("div"); const kt=el("span","ktxt",o.k+". "); p.appendChild(kt); p.appendChild(document.createTextNode(o.en)); body.appendChild(p);
    body.appendChild(viBlock(o.vi));
    row.appendChild(mk);row.appendChild(body);
    row.addEventListener("click",()=>{
      if(row.classList.contains("disabled"))return;
      const i=a.sel.indexOf(o.k);
      if(i>=0){a.sel.splice(i,1);}
      else{ if(N>1 && a.sel.length>=N){ flash(row); return; } if(N===1)a.sel=[o.k]; else a.sel.push(o.k); }
      syncMCQ(q,box); onChange&&onChange();
    });
    box.appendChild(row);
  });
  card.appendChild(box); syncMCQ(q,box);
}
function flash(row){row.style.transition="none";row.style.borderColor="var(--red)";setTimeout(()=>{row.style.transition="";row.style.borderColor="";},150);}
function syncMCQ(q,box){const a=ansObj(q);$$(".opt",box);Array.from(box.children).forEach(row=>{row.classList.toggle("sel",a.sel.includes(row.dataset.k));});}

function buildYesno(q,card,onChange){
  const a=ansObj(q);
  q.statements.forEach((st,i)=>{
    const row=el("div","yn-row");row.dataset.i=i;
    const txt=el("div","yn-txt");
    const p=el("div");p.textContent=st.text;txt.appendChild(p);txt.appendChild(viBlock(q.statements_vi[i]));
    const btns=el("div","yn-btns");
    [["Y","Yes"],["N","No"]].forEach(([v,lab])=>{
      const b=el("button",null,lab);b.dataset.v=v;
      b.addEventListener("click",()=>{ if(row.classList.contains("locked"))return; a.sel[i]=v; syncYesno(q,card); onChange&&onChange(); });
      btns.appendChild(b);
    });
    row.appendChild(txt);row.appendChild(btns);card.appendChild(row);
  });
  syncYesno(q,card);
}
function syncYesno(q,card){const a=ansObj(q);$$(".yn-row",card).forEach(row=>{const i=+row.dataset.i;$$("button",row).forEach(b=>b.classList.toggle("sel",a.sel[i]===b.dataset.v));});}

function buildDrop(q,card,onChange){
  const a=ansObj(q);
  q.parts.forEach((part,pi)=>{
    const pv=q.parts_vi[pi];
    const wrap=el("div","drop-part");wrap.dataset.pi=pi;
    const line=el("div","drop-line");
    if(part.pre) line.appendChild(document.createTextNode(part.pre+" "));
    const sel=el("select");
    sel.appendChild(new Option("— chọn —",""));
    part.choices.forEach((c,ci)=>sel.appendChild(new Option(c,ci)));
    sel.value=a.sel[pi]===null?"":String(a.sel[pi]);
    sel.addEventListener("change",()=>{a.sel[pi]=sel.value===""?null:+sel.value;onChange&&onChange();});
    line.appendChild(sel);
    if(part.post) line.appendChild(document.createTextNode(" "+part.post));
    wrap.appendChild(line);
    // VI of the sentence pieces + choices
    const viLine=el("div","vi");
    viLine.textContent=(pv.pre_vi?pv.pre_vi+" ":"")+"[ "+pv.choices_vi.join(" / ")+" ]"+(pv.post_vi?" "+pv.post_vi:"");
    wrap.appendChild(viLine);
    card.appendChild(wrap);
  });
}

function buildDrag(q,card,onChange){
  const a=ansObj(q);
  const wrap=el("div","drag-wrap");
  const pool=el("div","pool");pool.appendChild(el("div","pool-title","Kéo / bấm để chọn"));
  const chips=el("div","chips");
  q.items.forEach((it,ii)=>{
    const chip=el("div","chip");chip.dataset.ii=ii;chip.draggable=true;
    const t=el("div");t.textContent=it;chip.appendChild(t);chip.appendChild(viBlock(q.items_vi[ii]));
    chip.addEventListener("dragstart",e=>{e.dataTransfer.setData("text/plain",String(ii));});
    chip.addEventListener("click",()=>{ if(pool.classList.contains("locked"))return; a.pick=(a.pick===ii?null:ii); syncDrag(q,wrap); });
    chips.appendChild(chip);
  });
  pool.appendChild(chips);
  const tgts=el("div","targets");tgts.appendChild(el("div","tgt-title","Thả vào ô phù hợp"));
  q.targets.forEach((tg,ti)=>{
    const trow=el("div","target");trow.dataset.ti=ti;
    const slot=el("div","drop-slot");slot.dataset.ti=ti;slot.textContent="—";
    slot.addEventListener("dragover",e=>{e.preventDefault();slot.classList.add("dragover");});
    slot.addEventListener("dragleave",()=>slot.classList.remove("dragover"));
    slot.addEventListener("drop",e=>{e.preventDefault();slot.classList.remove("dragover");if(pool.classList.contains("locked"))return;const ii=+e.dataTransfer.getData("text/plain");a.sel[ti]=ii;a.pick=null;syncDrag(q,wrap);onChange&&onChange();});
    slot.addEventListener("click",()=>{
      if(pool.classList.contains("locked"))return;
      if(a.pick!==null){a.sel[ti]=a.pick;a.pick=null;}
      else if(a.sel[ti]!==null){a.sel[ti]=null;} // click filled to clear
      syncDrag(q,wrap);onChange&&onChange();
    });
    const lab=el("div","tgt-label");
    const lb=el("div");const p=el("div");p.textContent=tg.label;lb.appendChild(p);lb.appendChild(viBlock(q.targets_vi[ti]));lab.appendChild(lb);
    trow.appendChild(slot);trow.appendChild(lab);tgts.appendChild(trow);
  });
  wrap.appendChild(pool);wrap.appendChild(tgts);card.appendChild(wrap);
  syncDrag(q,wrap);
}
function syncDrag(q,wrap){
  const a=ansObj(q);
  const used=new Set(a.sel.filter(x=>x!==null));
  $$(".chip",wrap).forEach(c=>{const ii=+c.dataset.ii;c.classList.toggle("selected",a.pick===ii);c.classList.toggle("used",used.has(ii));});
  $$(".drop-slot",wrap).forEach(s=>{const ti=+s.dataset.ti;const v=a.sel[ti];if(v===null){s.classList.remove("filled");s.textContent="—";}else{s.classList.add("filled");s.textContent=q.items[v];}});
}

/* ---------- reveal / grading visuals ---------- */
function gradeVisual(q,card){
  const a=ansObj(q);
  if(q.kind==="mcq"){
    Array.from(card.querySelectorAll(".opt")).forEach(row=>{
      row.classList.add("disabled");
      const k=row.dataset.k;const isAns=q.answer.includes(k);const isSel=a.sel.includes(k);
      if(isAns)row.classList.add("correct");
      else if(isSel)row.classList.add("wrong");
    });
  } else if(q.kind==="yesno"){
    $$(".yn-row",card).forEach(row=>{const i=+row.dataset.i;row.classList.add("locked");const ok=a.sel[i]===q.statements[i].ans;row.classList.add(ok?"ok":"bad");
      $$("button",row).forEach(b=>{if(b.dataset.v===q.statements[i].ans)b.classList.add("ansmark");if(a.sel[i]===b.dataset.v&&!ok)b.classList.add("wrongsel");});});
  } else if(q.kind==="drop"){
    $$(".drop-part",card).forEach(w=>{const pi=+w.dataset.pi;const sel=w.querySelector("select");sel.disabled=true;const ok=a.sel[pi]===q.parts[pi].ans;sel.classList.add(ok?"ok":"bad");
      if(!ok){const cc=el("div","drop-correct","✓ Đúng: "+q.parts[pi].choices[q.parts[pi].ans]);w.appendChild(cc);}});
  } else if(q.kind==="drag"){
    const wrap=card.querySelector(".drag-wrap");wrap.querySelector(".pool").classList.add("locked");
    $$(".drop-slot",wrap).forEach(s=>{const ti=+s.dataset.ti;const ok=a.sel[ti]===q.targets[ti].ans;s.classList.add(ok?"ok":"bad");
      if(!ok){const trow=s.closest(".target");const cc=el("div","tgt-correct","✓ Đúng: "+q.items[q.targets[ti].ans]);trow.querySelector(".tgt-label").appendChild(cc);}});
  }
}
function buildReveal(q){
  const rv=el("div","reveal");
  const correct=isCorrect(q);const answered=isAnswered(q);
  const vd=el("div","verdict "+(correct?"correct":"incorrect"),correct?"✓ Chính xác":(answered?"✗ Chưa đúng":"✗ Chưa trả lời"));
  rv.appendChild(vd);
  const exp=el("div","exp");exp.appendChild(el("div","exp-label","Giải thích"));const et=el("div");et.textContent=q.exp;exp.appendChild(et);rv.appendChild(exp);
  const meta=el("div","meta");
  const cf=el("div");cf.innerHTML="<b>Độ tin cậy:</b> ";cf.appendChild(document.createTextNode(CONF_LABEL[q.conf]));meta.appendChild(cf);
  const vt=el("div");vt.innerHTML="<b>Vote cộng đồng:</b> ";vt.appendChild(document.createTextNode((q.vote&&q.vote!=="Not available")?(q.vote+(q.votepct?" ("+q.votepct+")":"")):("Không có · gợi ý ExamTopics: "+q.suggested)));meta.appendChild(vt);
  if(q.cite){const c=el("div");c.innerHTML="<b>Nguồn:</b> ";const a=el("a");a.href=q.cite;a.target="_blank";a.rel="noopener";a.textContent=q.cite;c.appendChild(a);meta.appendChild(c);}
  rv.appendChild(meta);
  return rv;
}

/* ---------- STUDY MODE ---------- */
function makeCard(q,idx){
  const card=el("div","qcard");card.id="q_"+q.id;card.dataset.id=q.id;
  const top=el("div","qtop");
  top.appendChild(el("span","qnum","Topic "+q.t+" · Câu "+q.n));
  top.appendChild(el("span","tag kind",KIND_LABEL[q.kind]));
  if((q.multi||1)>1) top.appendChild(el("span","tag multi","Chọn đúng "+q.multi+" đáp án"));
  top.appendChild(el("span","tag conf-"+q.conf,q.conf));
  card.appendChild(top);
  renderStem(q,card);
  buildBody(q,card);
  const acts=el("div","qactions");
  const chk=el("button","btn primary","Kiểm tra");
  acts.appendChild(chk);
  card.appendChild(acts);
  let rvEl=null; // reveal is built lazily, AFTER the user answers, so the verdict is correct
  function reveal(){
    if(!rvEl){ gradeVisual(q,card); rvEl=buildReveal(q); card.appendChild(rvEl); }
    rvEl.classList.add("show"); chk.textContent="Ẩn đáp án";
  }
  function hide(){ if(rvEl) rvEl.classList.remove("show"); chk.textContent="Kiểm tra"; }
  chk.addEventListener("click",()=>{ if(rvEl && rvEl.classList.contains("show")) hide(); else reveal(); });
  card._reveal=reveal;
  return card;
}
function renderStudy(){
  const t=$("#fTopic").value,k=$("#fKind").value,cf=$("#fConf").value,q=$("#fSearch").value.trim().toLowerCase();
  const list=$("#studyList");list.innerHTML="";
  let shown=0;
  DATA.forEach((item,idx)=>{
    if(t&&String(item.t)!==t)return;
    if(k&&item.kind!==k)return;
    if(cf&&item.conf!==cf)return;
    if(q&&!searchText(item).includes(q))return;
    // reset answer state & card
    const card=makeCard(item,idx);
    if(state.allShown){card._reveal();}
    list.appendChild(card);shown++;
  });
  $("#studyCount").textContent="Hiển thị "+shown+" / "+DATA.length+" câu";
}
function searchText(q){
  let s=q.stem+" "+q.vi;
  if(q.opts)s+=" "+q.opts.map(o=>o.en).join(" ")+" "+(q.opts_vi||[]).join(" ");
  if(q.statements)s+=" "+q.statements.map(o=>o.text).join(" ")+" "+(q.statements_vi||[]).join(" ");
  if(q.parts){s+=" "+q.parts.map(p=>p.choices.join(" ")).join(" ");(q.parts_vi||[]).forEach(p=>s+=" "+(p.choices_vi||[]).join(" "));}
  if(q.items)s+=" "+q.items.join(" ")+" "+(q.items_vi||[]).join(" ")+" "+q.targets.map(t=>t.label).join(" ")+" "+(q.targets_vi||[]).join(" ");
  return s.toLowerCase();
}

/* ---------- EXAM MODE ---------- */
function startExam(){
  const scope=$("#eScope").value; let pool=DATA.filter(q=>!scope||String(q.t)===scope);
  let n=Math.max(1,Math.min(pool.length,parseInt($("#eCount").value)||pool.length));
  const mins=Math.max(1,parseInt($("#eTime").value)||45);
  const order=shuffle(pool.slice()).slice(0,n);
  // reset answers for chosen
  order.forEach(q=>state.answers[q.id]=blankAns(q));
  state.exam={order,ids:order.map(q=>q.id),timeLeft:mins*60,timerId:null,submitted:false};
  $("#examSetup").classList.add("hidden");$("#examResult").classList.add("hidden");$("#examRun").classList.remove("hidden");
  renderExamList();renderPalette();updateProgress();
  state.exam.timerId=setInterval(tick,1000);updateTimer();
  window.scrollTo(0,0);
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function renderExamList(){
  const list=$("#examList");list.innerHTML="";
  state.exam.order.forEach((q,idx)=>{
    const card=el("div","qcard");card.id="ex_"+q.id;card.dataset.id=q.id;
    const top=el("div","qtop");
    top.appendChild(el("span","qnum","Câu "+(idx+1)));
    top.appendChild(el("span","tag kind",KIND_LABEL[q.kind]));
    if((q.multi||1)>1) top.appendChild(el("span","tag multi","Chọn đúng "+q.multi+" đáp án"));
    card.appendChild(top);
    renderStem(q,card);
    buildBody(q,card,()=>{updatePaletteOne(idx);updateProgress();});
    list.appendChild(card);
  });
}
function renderPalette(){
  const pal=$("#palette");pal.innerHTML="";
  state.exam.order.forEach((q,idx)=>{
    const b=el("button",null,String(idx+1));b.dataset.idx=idx;
    b.addEventListener("click",()=>{document.getElementById("ex_"+q.id).scrollIntoView({behavior:"smooth",block:"start"});});
    pal.appendChild(b);
  });
  updatePaletteAll();
}
function updatePaletteOne(idx){const q=state.exam.order[idx];const b=$("#palette").children[idx];if(b)b.classList.toggle("answered",isAnswered(q));}
function updatePaletteAll(){state.exam.order.forEach((q,i)=>updatePaletteOne(i));}
function updateProgress(){
  const done=state.exam.order.filter(q=>isAnswered(q)).length;const tot=state.exam.order.length;
  $("#progFill").style.width=(100*done/tot)+"%";
  $("#progText").textContent=done+"/"+tot+" đã trả lời";
}
function tick(){state.exam.timeLeft--;if(state.exam.timeLeft<=0){updateTimer();submitExam(true);return;}updateTimer();}
function updateTimer(){const t=Math.max(0,state.exam.timeLeft);const m=String(Math.floor(t/60)).padStart(2,"0"),s=String(t%60).padStart(2,"0");const el2=$("#timer");el2.textContent=m+":"+s;el2.classList.toggle("warn",t<=60);}
function submitExam(auto){
  if(state.exam.submitted)return;
  if(!auto){const done=state.exam.order.filter(q=>isAnswered(q)).length;if(done<state.exam.order.length && !confirm("Bạn còn "+(state.exam.order.length-done)+" câu chưa trả lời. Nộp bài luôn?"))return;}
  state.exam.submitted=true;clearInterval(state.exam.timerId);
  const total=state.exam.order.length;const correct=state.exam.order.filter(q=>isCorrect(q)).length;
  const pct=Math.round(100*correct/total);const pass=pct>=70;
  $("#examRun").classList.add("hidden");$("#examResult").classList.remove("hidden");
  const sb=$("#scoreBox");sb.innerHTML="";
  const num=el("div","score-num "+(pass?"score-pass":"score-fail"),pct+"%");sb.appendChild(num);
  sb.appendChild(el("div","score-sub","Đúng "+correct+"/"+total+" câu · "+(pass?"ĐẠT ✓":"CHƯA ĐẠT ✗")+" (mốc 70%)"));
  // review
  const rlist=$("#reviewList");rlist.innerHTML="";
  const pal2=$("#palette2");pal2.innerHTML="";
  state.exam.order.forEach((q,idx)=>{
    const card=el("div","qcard");card.id="rv_"+q.id;
    const top=el("div","qtop");
    top.appendChild(el("span","qnum","Câu "+(idx+1)));
    top.appendChild(el("span","tag kind",KIND_LABEL[q.kind]));
    if((q.multi||1)>1) top.appendChild(el("span","tag multi","Chọn đúng "+q.multi+" đáp án"));
    top.appendChild(el("span","tag conf-"+q.conf,q.conf));
    card.appendChild(top);
    renderStem(q,card);
    buildBody(q,card);
    gradeVisual(q,card);
    const rv=buildReveal(q);rv.classList.add("show");card.appendChild(rv);
    rlist.appendChild(card);
    const b=el("button",null,String(idx+1));b.classList.add(isCorrect(q)?"correct":"incorrect");
    b.addEventListener("click",()=>card.scrollIntoView({behavior:"smooth",block:"start"}));
    pal2.appendChild(b);
  });
  window.scrollTo(0,0);
}
function quitExam(){if(state.exam&&state.exam.timerId)clearInterval(state.exam.timerId);state.exam=null;$("#examRun").classList.add("hidden");$("#examResult").classList.add("hidden");$("#examSetup").classList.remove("hidden");}

/* ---------- mode / theme / lang ---------- */
function setMode(m){
  state.mode=m;
  $$("#modeSeg button").forEach(b=>b.classList.toggle("active",b.dataset.mode===m));
  $("#studyView").classList.toggle("hidden",m!=="study");
  const inExam=m==="exam";
  $("#examSetup").classList.toggle("hidden",!inExam|| (state.exam!==null));
  $("#examRun").classList.toggle("hidden",!(inExam&&state.exam&&!state.exam.submitted));
  $("#examResult").classList.toggle("hidden",!(inExam&&state.exam&&state.exam.submitted));
  if(m==="study")renderStudy();
  if(inExam && !state.exam){$("#examSetup").classList.remove("hidden");}
}
function initEvents(){
  $$("#modeSeg button").forEach(b=>b.addEventListener("click",()=>setMode(b.dataset.mode)));
  $("#langBtn").addEventListener("click",()=>{const en=document.body.classList.toggle("lang-en");document.body.classList.toggle("lang-both",!en);$("#langBtn").textContent=en?"EN":"EN+VI";$("#langBtn").classList.toggle("active",!en);});
  $("#themeBtn").addEventListener("click",()=>{const cur=document.body.getAttribute("data-theme");const nw=cur==="dark"?"light":"dark";document.body.setAttribute("data-theme",nw);$("#themeBtn").textContent=nw==="dark"?"🌙":"☀️";});
  ["#fTopic","#fKind","#fConf"].forEach(s=>$(s).addEventListener("change",renderStudy));
  $("#fSearch").addEventListener("input",renderStudy);
  $("#toggleAllBtn").addEventListener("click",()=>{state.allShown=!state.allShown;$("#toggleAllBtn").textContent=state.allShown?"Ẩn tất cả đáp án":"Hiện tất cả đáp án";renderStudy();});
  $("#startExamBtn").addEventListener("click",startExam);
  $("#submitBtn").addEventListener("click",()=>submitExam(false));
  $("#submitBtn2").addEventListener("click",()=>submitExam(false));
  $("#quitBtn").addEventListener("click",quitExam);
  $("#retryBtn").addEventListener("click",()=>{state.exam=null;$("#examResult").classList.add("hidden");$("#examSetup").classList.remove("hidden");window.scrollTo(0,0);});
}
document.addEventListener("DOMContentLoaded",()=>{initEvents();setMode("study");});
// expose for tests
if(typeof module!=="undefined"){module.exports={DATA,blankAns,isCorrect,isAnswered};}
</script>
</body>
